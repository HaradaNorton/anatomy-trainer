text": "Вход в гортань (Aditus laryngis)", "images": []}, {"text": "Подголосовая полость (Cavitas infraglottica)", "images": []}, {"text": "Желудочек гортани (Ventriculus laryngis)", "images": []}, {"text": "Трахея (Trachea)", "images": []}], "rows": [], "correct": [4], "explanation": "«Желудочки гортани, ventriculi laryngis, располагаются в виде углублений от преддверных до голосовых складок; между ними самое узкое место гортани». Это и есть средний (промежуточный) отдел полости гортани.", "source": "0116_Лекция 6. Дыхательная система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "c2839b1943ef", "type": "multichoice", "multiple": false, "text": "Какая связка натянута между углом щитовидного хряща и голосовым отростком черпаловидного хряща?", "images": [], "options": [{"text": "Черпалонадгортанная связка", "images": []}, {"text": "Щитоподъязычная связка (Lig. thyrohyoideum)", "images": []}, {"text": "Перстнещитовидная связка (Lig. cricothyroideum)", "images": []}, {"text": "Голосовая связка (Lig. vocale)", "images": []}, {"text": "Преддверная связка (Lig. vestibulare)", "images": []}, {"text": "Перстнечерпаловидная связка (Lig. cricoarytenoideum)", "images": []}], "rows": [], "correct": [3], "explanation": "Дословно из лекции: верхний край эластического конуса образует «парную голосовую связку, lig. vocale, которая натянута между углом щитовидного хряща и голосовым отростком черпаловидного хряща».", "source": "0116_Лекция 6. Дыхательная система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "37bf6c2bcf68", "type": "multichoice", "multiple": false, "text": "Что является структурно-функциональной единицей легкого, включающей дыхательные бронхиолы, альвеолярные ходы и альвеолы?", "images": [], "options": [{"text": "Бронхолегочный сегмент (Segmentum bronchopulmonale)", "images": []}, {"text": "Альвеолярное дерево", "images": []}, {"text": "Долька легкого (Lobulus pulmonis)", "images": []}, {"text": "Бронхиальное дерево (Arbor bronchialis)", "images": []}, {"text": "Терминальная бронхиола", "images": []}, {"text": "Ацинус (Acinus)", "images": []}], "rows": [], "correct": [5], "explanation": "«Функционально-анатомической единицей легкого считается ацинус. Он представляет собой часть альвеолярного дерева, на которую разветвляется одна терминальная бронхиола» — то есть дыхательные бронхиолы, альвеолярные ходы и альвеолы.", "source": "0116_Лекция 6. Дыхательная система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "a27aed0954e7", "type": "multichoice", "multiple": false, "text": "Что следует непосредственно за гортанью (larynx) на уровне VI-VII шейных позвонков?", "images": [], "options": [{"text": "Трахея (Trachea)", "images": []}, {"text": "Главные бронхи (Bronchi principales)", "images": []}, {"text": "Сегментарные бронхи (Bronchi segmentales)", "images": []}, {"text": "Бронхиолы (Bronchioli)", "images": []}, {"text": "Долевые бронхи (Bronchi lobares)", "images": []}, {"text": "Бифуркация (Bifurcatio)", "images": []}], "rows": [], "correct": [0], "explanation": "«Трахея (trachea) начинается от нижнего конца гортани и идет в грудную полость». Гортань расположена на уровне IV-VI шейных позвонков, поэтому на уровне VI-VII шейных позвонков за ней следует трахея.", "source": "0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "5a8dfee6d035", "type": "multichoice", "multiple": false, "text": "На какие структуры разделяется трахея на уровне V грудного позвонка?", "images": [], "options": [{"text": "Сегментарные бронхи (Bronchi segmentales)", "images": []}, {"text": "Бронхиолы (Bronchioli)", "images": []}, {"text": "Альвеолярные ходы (Ductuli alveolares)", "images": []}, {"text": "Главные бронхи (Bronchi principales)", "images": []}, {"text": "Терминальные бронхиолы", "images": []}, {"text": "Долевые бронхи (Bronchi lobares)", "images": []}], "rows": [], "correct": [3], "explanation": "«Трахея... на уровне V-VI грудных позвонков разделяется на правый и левый главные бронхи, образуя бифуркацию (bifurcatio tracheae)». Деление идёт сразу на главные бронхи.", "source": "0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "e5998087f358", "type": "multichoice", "multiple": false, "text": "Куда открывается носослезный канал (ductus nasolacrimalis)?", "images": [], "options": [{"text": "Нижний носовой ход (Meatus nasi inferior)", "images": []}, {"text": "Носоглоточный ход (Meatus nasopharyngeus)", "images": []}, {"text": "Общий носовой ход (Meatus nasi communis)", "images": []}, {"text": "Клиновидно-решетчатое углубление (Recessus sphenoethmoidalis)", "images": []}, {"text": "Средний носовой ход (Meatus nasi medius)", "images": []}, {"text": "Верхний носовой ход (Meatus nasi superior)", "images": []}], "rows": [], "correct": [0], "explanation": "«В нижнем носовом ходе под сводом нижней раковины находится отверстие слезно-носового протока». Это подтверждается и краниологией: canalis nasolacrimalis «открывающийся в нижний носовой ход».", "source": "0116_Лекция 6. Дыхательная система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "7ca09b434857", "type": "multichoice", "multiple": false, "text": "Какая поверхность легкого обращена к диафрагме?", "images": [], "options": [{"text": "Позвоночная часть (Pars vertebralis)", "images": []}, {"text": "Средостенная поверхность (Facies mediastinalis)", "images": []}, {"text": "Передняя поверхность", "images": []}, {"text": "Реберная поверхность (Facies costalis)", "images": []}, {"text": "Диафрагмальная поверхность (Facies diaphragmatica)", "images": []}, {"text": "Верхушка легкого (Apex pulmonis)", "images": []}], "rows": [], "correct": [4], "explanation": "«Легкое имеет 3 поверхности: реберную (facies costalis), прилежащую к ребрам; диафрагмальную (facies diaphragmatica), прилежащую к диафрагме, и средостенную (facies mediastinalis)».", "source": "0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "523a1e07a10b", "type": "multichoice", "multiple": false, "text": "Чем заканчиваются дыхательные пути, являясь конечными структурными элементами ацинуса, где происходит газообмен?", "images": [], "options": [{"text": "Долевые бронхи (Bronchi lobares)", "images": []}, {"text": "Терминальные бронхиолы (Bronchioli terminales)", "images": []}, {"text": "Альвеолы (Alveoli) в составе альвеолярных мешочков", "images": []}, {"text": "Трахея (Trachea)", "images": []}, {"text": "Главные бронхи", "images": []}, {"text": "Гортань (Larynx)", "images": []}], "rows": [], "correct": [2], "explanation": "«Стенки альвеолярных ходов и мешочков состоят из легочных альвеол... Через стенку альвеол и капилляров осуществляется обмен между кровью и альвеолярным воздухом». Альвеолы в составе альвеолярных мешочков — конечное звено ацинуса.", "source": "0116_Лекция 6. Дыхательная система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "3d9cf29bf81f", "type": "multichoice", "multiple": false, "text": "С какого элемента начинается альвеолярное дерево (ацинус), где происходит газообмен?", "images": [], "options": [{"text": "Альвеолы (Alveoli)", "images": []}, {"text": "Сегментарные бронхи", "images": []}, {"text": "Дыхательные бронхиолы (Bronchioli respiratorii)", "images": []}, {"text": "Терминальные бронхиолы (Bronchioli terminales)", "images": []}, {"text": "Альвеолярные мешочки (Sacculi alveolares)", "images": []}, {"text": "Дольковые бронхи (Bronchi lobulares)", "images": []}], "rows": [], "correct": [2], "explanation": "«Респираторные бронхиолы, альвеолярные ходы и альвеолярные мешочки с альвеолами составляют альвеолярное дерево». Первое звено альвеолярного дерева — именно дыхательные (респираторные) бронхиолы, так как на их стенках уже появляются альвеолы; терминальная бронхиола относится ещё к бронхиальному дереву.", "source": "0116_Лекция 6. Дыхательная система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "8c1552d5b2bb", "type": "multichoice", "multiple": false, "text": "Какие бронхи следуют непосредственно за главными бронхами (bronchi principales)?", "images": [], "options": [{"text": "Терминальные бронхиолы (Bronchioli terminales)", "images": []}, {"text": "Субсегментарные бронхи", "images": []}, {"text": "Долевые бронхи (Bronchi lobares)", "images": []}, {"text": "Дольковые бронхи (Bronchi lobulares)", "images": []}, {"text": "Сегментарные бронхи (Bronchi segmentales)", "images": []}, {"text": "Альвеолярные мешочки (Sacculi alveolares)", "images": []}], "rows": [], "correct": [2], "explanation": "«Главные бронхи (1 порядка) в воротах легкого делятся на долевые бронхи, bronchi lobares. Это бронхи второго порядка».", "source": "0116_Лекция 6. Дыхательная система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "0749da407b6d", "type": "multichoice", "multiple": false, "text": "Какой отдел полости гортани следует за входом в гортань (aditus laryngis) до складок преддверия?", "images": [], "options": [{"text": "Преддверие гортани (Vestibulum laryngis)", "images": []}, {"text": "Голосовая щель (Rima glottidis)", "images": []}, {"text": "Желудочек гортани (Ventriculus laryngis)", "images": []}, {"text": "Промежуточная полость", "images": []}, {"text": "Подголосовая полость (Cavitas infraglottica)", "images": []}, {"text": "Трахея (Trachea)", "images": []}], "rows": [], "correct": [0], "explanation": "«Преддверие гортани, vestibulum laryngis, простирается от входа в гортань до преддверных складок, в состав которых входят преддверные связки».", "source": "0116_Лекция 6. Дыхательная система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "34ce0a8158c6", "type": "multichoice", "multiple": false, "text": "Что является конечным разветвлением бронхиального дерева (воздухопроводящих путей), переходящим в альвеолярное дерево?", "images": [], "options": [{"text": "Терминальные бронхиолы (Bronchioli terminales)", "images": []}, {"text": "Дыхательные бронхиолы (Bronchioli respiratorii)", "images": []}, {"text": "Сегментарные бронхи (Bronchi segmentales)", "images": []}, {"text": "Альвеолярные ходы (Ductuli alveolares)", "images": []}, {"text": "Дольковые бронхи (Bronchi lobulares)", "images": []}, {"text": "Главные бронхи", "images": []}], "rows": [], "correct": [0], "explanation": "«Бронхиальное дерево... образовано ветвлением бронхов от главного бронха до терминальных бронхиол (XVI-XVIII порядков)», а далее «каждая терминальная бронхиола делится на дыхательные бронхиолы» — то есть переходит в альвеолярное дерево.", "source": "0116_Лекция 6. Дыхательная система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "d055da99e8bf", "type": "multichoice", "multiple": false, "text": "Как называется вдавление на переднем крае левого легкого, в котором располагается сердце?", "images": [], "options": [{"text": "Аортальное вдавление (Impressio aortica)", "images": []}, {"text": "Диафрагмальная поверхность (Facies diaphragmatica)", "images": []}, {"text": "Пищеводное вдавление (Impressio oesophageale)", "images": []}, {"text": "Реберная поверхность (Facies costalis)", "images": []}, {"text": "Сердечная вырезка (Incisura cardiaca)", "images": []}, {"text": "Ворота легкого (Hilum pulmonis)", "images": []}], "rows": [], "correct": [4], "explanation": "«Спереди у левого легкого имеется сердечная вырезка, в которой помещается часть сердца» (incisura cardiaca на переднем крае левого легкого).", "source": "0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "5170e7953cd5", "type": "multichoice", "multiple": false, "text": "В какую часть глотки переходит ротовая часть глотки (pars oralis pharyngis) каудально?", "images": [], "options": [{"text": "Pars nasalis pharyngis", "images": []}, {"text": "Trachea", "images": []}, {"text": "Oesophagus", "images": []}, {"text": "Pars laryngea pharyngis", "images": []}, {"text": "Fauces", "images": []}, {"text": "Vestibulum laryngis", "images": []}], "rows": [], "correct": [3], "explanation": "«В глотке различают 3 части: носовую часть глотки (pars nasalis pharyngis), ротовую часть глотки (pars oralis pharyngis) и гортанную часть (pars laryngea pharyngis)» — сверху вниз, значит каудально ротовая часть переходит в гортанную.", "source": "0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "85e05d4e5774", "type": "multichoice", "multiple": false, "text": "Какой отдел полости гортани следует за голосовой щелью (rima glottidis) и простирается до начала трахеи?", "images": [], "options": [{"text": "Желудочек гортани (Ventriculus laryngis)", "images": []}, {"text": "Подголосовая полость (Cavitas infraglottica)", "images": []}, {"text": "Главные бронхи (Bronchi principales)", "images": []}, {"text": "Вход в гортань (Aditus laryngis)", "images": []}, {"text": "Промежуточная полость", "images": []}, {"text": "Преддверие гортани (Vestibulum laryngis)", "images": []}], "rows": [], "correct": [1], "explanation": "«Подголосовая полость, cavitas infraglottica, простирается от голосовых складок до начала трахеи».", "source": "0116_Лекция 6. Дыхательная система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "cdbba5de3a49", "type": "multichoice", "multiple": false, "text": "Какой отдел полости гортани располагается между складками преддверия (plicae vestibulares) и голосовыми складками (plicae vocales)?", "images": [], "options": [{"text": "Вход в гортань (Aditus laryngis)", "images": []}, {"text": "Желудочек гортани (Ventriculus laryngis)", "images": []}, {"text": "Голосовая щель (Rima glottidis)", "images": []}, {"text": "Подголосовая полость (Cavitas infraglottica)", "images": []}, {"text": "Преддверие гортани (Vestibulum laryngis)", "images": []}, {"text": "Грушевидный карман (Recessus piriformis)", "images": []}], "rows": [], "correct": [1], "explanation": "Тот же факт, что и в вопросе c20f8fb04cbc: «Желудочки гортани, ventriculi laryngis, располагаются в виде углублений от преддверных до голосовых складок».", "source": "0116_Лекция 6. Дыхательная система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "5e1e74593255", "type": "multichoice", "multiple": false, "text": "Что следует непосредственно за ноздрями (nares) и составляет начальный отдел полости носа?", "images": [], "options": [{"text": "Носоглотка (Pars nasalis pharyngis)", "images": []}, {"text": "Хоаны (Choanae)", "images": []}, {"text": "Нижний носовой ход (Meatus nasi inferior)", "images": []}, {"text": "Преддверие носа (Vestibulum nasi)", "images": []}, {"text": "Обонятельная область (Regio olfactoria)", "images": []}, {"text": "Дыхательная область (Regio respiratoria)", "images": []}], "rows": [], "correct": [3], "explanation": "«Часть полости носа, примыкающая к ноздрям, называется преддверием носа, vestibulum nasi». Это начальный отдел полости носа, выстланный кожей с волосками.", "source": "0116_Лекция 6. Дыхательная система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "1558e397a56f", "type": "multichoice", "multiple": false, "text": "Какая кость участвует в образовании верхней стенки полости носа?", "images": [], "options": [{"text": "Клиновидная кость (Os sphenoidale, крыловидные отростки)", "images": []}, {"text": "Слезная кость (Os lacrimale)", "images": []}, {"text": "Небная кость (Os palatinum)", "images": []}, {"text": "Решетчатая кость (Os ethmoidale, lamina cribrosa)", "images": []}, {"text": "Сошник (Vomer)", "images": []}, {"text": "Верхняя челюсть (Maxilla)", "images": []}], "rows": [], "correct": [3], "explanation": "«Верхняя стенка, или свод полости носа, образована решетчатой пластинкой решетчатой кости, через которую проходят обонятельные нервы» (lamina cribrosa ossis ethmoidalis).", "source": "0116_Лекция 6. Дыхательная система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}]}, {"cmid": "27941", "folder": "05_mochevaya_i_polovaya", "title": "Тестирование по мочевой и половой системам", "minutes": 10, "group": "Тренировочные", "questions": [{"key": "089229344cb3", "type": "multichoice", "multiple": false, "text": "В какой части маточной трубы обычно происходит оплодотворение яйцеклетки?", "images": [], "options": [{"text": "Яичниковая бахромка (Fimbria ovarica)", "images": []}, {"text": "Ампула маточной трубы (Ampulla tubae uterinae)", "images": []}, {"text": "Интрамуральная часть", "images": []}, {"text": "Перешеек (Isthmus tubae uterinae)", "images": []}, {"text": "Маточная часть (Pars uterina)", "images": []}, {"text": "Воронка (Infundibulum tubae uterinae)", "images": []}], "rows": [], "correct": [1], "explanation": "Лекция говорит, что яйцеклетка захватывается бахромками и поступает в маточную трубу, «где происходит оплодотворение», но конкретную часть не называет. По классической анатомии и эмбриологии оплодотворение происходит в ампуле маточной трубы — самой широкой её части, где яйцеклетка задерживается дольше всего.", "source": "0118_Лекция 8. Половая система.pdf.txt + классическая анатомия", "confidence": "claude-medium", "moodle_right": ""}, {"key": "36181d5eb4b3", "type": "multichoice", "multiple": false, "text": "Где собираются сперматозоиды после прохождения прямых семенных канальцев, находясь в толще средостения яичка?", "images": [], "options": [{"text": "В сети яичка (Rete testis)", "images": []}, {"text": "В выносящих канальцах (Ductuli efferentes)", "images": []}, {"text": "В семенных пузырьках (Vesiculae seminales)", "images": []}, {"text": "В придатке яичка (Epididymis)", "images": []}, {"text": "В семявыносящем протоке (Ductus deferens)", "images": []}, {"text": "В извитых канальцах (Tubuli seminiferi contorti)", "images": []}], "rows": [], "correct": [0], "explanation": "«Последние переходят в прямые семенные канальцы, tubuli seminiferi recti, образующие сеть яичка, rete testis, в средостении». То есть именно в толще mediastinum testis находится rete testis.", "source": "0118_Лекция 8. Половая система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "32222b1785b8", "type": "multichoice", "multiple": false, "text": "Куда поступает моча из дистальных извитых канальцев нескольких нефронов?", "images": [], "options": [{"text": "В малую почечную чашку (Calyx renalis minor)", "images": []}, {"text": "В петлю Генле (Ansa nephroni)", "images": []}, {"text": "В проксимальный извитой каналец (Tubulus contortus proximalis)", "images": []}, {"text": "В почечный клубочек (Glomerulus)", "images": []}, {"text": "В собирательную трубочку (Tubulus renalis colligens)", "images": []}, {"text": "В почечную лоханку (Pelvis renalis)", "images": []}], "rows": [], "correct": [4], "explanation": "«Дистальная часть канальца нефрона... впадает в собирательную почечную трубочку»; в собирательные канальцы впадают дистальные отделы нескольких нефронов, и далее они открываются на сосочках пирамид.", "source": "0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "dd72268f8b68", "type": "multichoice", "multiple": false, "text": "Через какое отверстие сперма (эякулят) покидает мужской организм?", "images": [], "options": [{"text": "Внутреннее отверстие уретры (Ostium urethrae internum)", "images": []}, {"text": "Наружное отверстие мочеиспускательного канала (Ostium urethrae externum)", "images": []}, {"text": "Венец головки (Corona glandis)", "images": []}, {"text": "Отверстие влагалищного отростка", "images": []}, {"text": "Отверстие семявыбрасывающего протока", "images": []}, {"text": "Отверстие крайней плоти", "images": []}], "rows": [], "correct": [1], "explanation": "Мужская уретра «служит для выведения мочи и выбрасывания спермы в момент эякуляции» и «открывается на головке полового члена наружным отверстием мочеиспускательного канала, ostium urethrae externum» — это и есть конечное отверстие для эякулята.", "source": "0118_Лекция 8. Половая система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "f2f7a6d62020", "type": "multichoice", "multiple": false, "text": "Какая часть маточной трубы является самой широкой и открывается в брюшную полость своими бахромками?", "images": [], "options": [{"text": "Яичниковая бахромка (Fimbria ovarica)", "images": []}, {"text": "Ампула и воронка (Ampulla et Infundibulum tubae)", "images": []}, {"text": "Перешеек (Isthmus tubae)", "images": []}, {"text": "Маточная часть (Pars uterina)", "images": []}, {"text": "Брыжейка трубы (Mesosalpinx)", "images": []}, {"text": "Продольный проток (Ductus longitudinalis)", "images": []}], "rows": [], "correct": [1], "explanation": "«ампулу (ampulla tubae uterinae) — расширенную часть; воронку (infundibulum tubae uterinae), открывающуюся брюшным отверстием, окруженным многочисленными бахромками». Ампула — самая широкая часть, воронка заканчивается бахромками и открывается в полость брюшины, поэтому верен комбинированный вариант.", "source": "0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "c8a1b53f2cd2", "type": "multichoice", "multiple": false, "text": "Где располагается яичник по отношению к брюшине?", "images": [], "options": [{"text": "Интраперитонеально (покрыт со всех сторон)", "images": []}, {"text": "Субперитонеально", "images": []}, {"text": "Интрамурально", "images": []}, {"text": "Экстраперитонеально (покрыт с одной стороны)", "images": []}, {"text": "Ретроперитонеально (позади брюшины)", "images": []}, {"text": "Мезоперитонеально (имеет брыжейку, но поверхность не покрыта брюшиной)", "images": []}], "rows": [], "correct": [5], "explanation": "Дословно: «Яичник — единственный орган, лежащий в полости брюшины не покрытый брюшиной, но имеющий брыжейку, mesovarium». Формулировка варианта 5 полностью совпадает с лекцией.", "source": "0118_Лекция 8. Половая система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "29e2b13698a5", "type": "multichoice", "multiple": false, "text": "Какая доля предстательной железы располагается между двумя семявыбрасывающими протоками и задней поверхностью уретры (часто гипертрофируется в пожилом возрасте)?", "images": [], "options": [{"text": "Боковая доля", "images": []}, {"text": "Передняя доля", "images": []}, {"text": "Левая доля (Lobus sinister)", "images": []}, {"text": "Средняя доля (Lobus medius)", "images": []}, {"text": "Правая доля (Lobus dexter)", "images": []}, {"text": "Перешеек (Isthmus prostatae)", "images": []}], "rows": [], "correct": [3], "explanation": "Лекция описывает простату как две доли и перешеек, не упоминая среднюю долю. Однако по классической анатомии именно средняя доля (lobus medius), лежащая между семявыбрасывающими протоками и задней стенкой уретры, гипертрофируется в пожилом возрасте и вызывает задержку мочи — что и описано в вопросе.", "source": "классическая анатомия (в лекции 0118 указаны только две доли и перешеек)", "confidence": "claude-medium", "moodle_right": ""}, {"key": "d4e058c47fd6", "type": "multichoice", "multiple": false, "text": "Какая часть мужского мочеиспускательного канала следует непосредственно за предстательной частью (pars prostatica)?", "images": [], "options": [{"text": "Губчатая часть (Pars spongiosa)", "images": []}, {"text": "Простатическая маточка (Utriculus prostaticus)", "images": []}, {"text": "Наружное отверстие уретры (Ostium urethrae externum)", "images": []}, {"text": "Ладьевидная ямка (Fossa navicularis)", "images": []}, {"text": "Перепончатая часть (Pars membranacea)", "images": []}, {"text": "Внутреннее отверстие уретры (Ostium urethrae internum)", "images": []}], "rows": [], "correct": [4], "explanation": "Порядок частей уретры в лекции: «1) Простатическая часть, pars prostatica... 2) перепончатая часть, pars membranacea, проходит через мочеполовую диафрагму, длиной 1,5 см; 3) губчатая часть, pars spongiosa».", "source": "0117_Лекция 7 Мочевая система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "067973451726", "type": "multichoice", "multiple": false, "text": "Какие образования составляют основу полового члена?", "images": [], "options": [{"text": "Только губчатое тело (corpus spongiosum penis)", "images": []}, {"text": "Только мочеиспускательный канал", "images": []}, {"text": "Два губчатых и одно пещеристое тело", "images": []}, {"text": "Сеть выносящих канальцев", "images": []}, {"text": "Только одно пещеристое тело", "images": []}, {"text": "Два пещеристых тела и одно губчатое тело полового члена", "images": []}], "rows": [], "correct": [5], "explanation": "«Половой член состоит из двух пещеристых тел, corpora cavernosa penis, и одного губчатого тела, corpus spongiosum penis».", "source": "0118_Лекция 8. Половая система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "e48d070a2dd2", "type": "multichoice", "multiple": false, "text": "Как называется сосудистая сеть, образующаяся при распаде приносящей артериолы внутри почечного тельца?", "images": [], "options": [{"text": "Чудесная венозная сеть (Rete mirabile venosum)", "images": []}, {"text": "Вторичная капиллярная сеть", "images": []}, {"text": "Прямые сосуды (Vasa recta)", "images": []}, {"text": "Перитубулярные капилляры", "images": []}, {"text": "Сосудистый клубочек (Glomerulus)", "images": []}, {"text": "Междольковая артерия", "images": []}], "rows": [], "correct": [4], "explanation": "«От каждой междольковой артерии отходит приносящая клубочковая артериола, которая образует капиллярный клубочек... Такое деление сосудов, когда на артерии вновь образуется артерия, называется чудесной артериальной сетью (rete mirabile)». Сама сеть внутри почечного тельца — сосудистый клубочек, glomerulus; вариант «чудесная ВЕНОЗНАЯ сеть» неверен, так как сеть артериальная.", "source": "0117_Лекция 7 Мочевая система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "92f772faa19a", "type": "multichoice", "multiple": false, "text": "Какая часть мужской уретры является наиболее узкой и фиксированной (помимо наружного отверстия)?", "images": [], "options": [{"text": "Предстательная часть (Pars prostatica)", "images": []}, {"text": "Перепончатая часть (Pars membranacea)", "images": []}, {"text": "Внутреннее отверстие (Ostium internum)", "images": []}, {"text": "Губчатая часть (Pars spongiosa)", "images": []}, {"text": "Ладьевидная ямка (Fossa navicularis)", "images": []}, {"text": "Луковица уретры", "images": []}], "rows": [], "correct": [1], "explanation": "Лекция перечисляет только три расширения уретры (простатическая часть, луковица, ладьевидная ямка), а сужения не называет. По классической анатомии перепончатая часть — самая короткая, узкая и фиксированная (проходит через мочеполовую диафрагму), поэтому она наиболее уязвима при катетеризации.", "source": "классическая анатомия (0117 перечисляет 3 сужения без их названий)", "confidence": "claude-medium", "moodle_right": ""}, {"key": "8fae77573a7b", "type": "multichoice", "multiple": false, "text": "Какой проток является непосредственным продолжением протока придатка яичка и транспортирует сперму в брюшную полость?", "images": [], "options": [{"text": "Паховый проток", "images": []}, {"text": "Мочеточник (Ureter)", "images": []}, {"text": "Семявыбрасывающий проток (Ductus ejaculatorius)", "images": []}, {"text": "Проток семенного пузырька", "images": []}, {"text": "Выделительный проток (Ductus excretorius)", "images": []}, {"text": "Семявыносящий проток (Ductus deferens)", "images": []}], "rows": [], "correct": [5], "explanation": "«Семявыносящий проток, ductus deferens, парный орган. Является продолжением протока придатка яичка». Он поднимается в составе семенного канатика через паховый канал в полость таза (формулировка вопроса «в брюшную полость» неточна, но однозначно указывает на ductus deferens).", "source": "0118_Лекция 8. Половая система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "f4cfca58bbde", "type": "multichoice", "multiple": false, "text": "Какой орган мочевой системы следует за мочеточником (ureter)?", "images": [], "options": [{"text": "Прямая кишка (Rectum)", "images": []}, {"text": "Мочевой пузырь (Vesica urinaria)", "images": []}, {"text": "Почечная лоханка (Pelvis renalis)", "images": []}, {"text": "Мочеиспускательный канал (Urethra)", "images": []}, {"text": "Предстательная железа (Prostata)", "images": []}, {"text": "Почка (Ren)", "images": []}], "rows": [], "correct": [1], "explanation": "«Моча... на своем пути до мочевого пузыря проходит через малые чашки, большие чашки, почечную лоханку и мочеточник» — значит за мочеточником следует мочевой пузырь, на задней стенке которого открываются мочеточники.", "source": "0117_Лекция 7 Мочевая система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "5c44a271671d", "type": "multichoice", "multiple": false, "text": "Какая часть семявыносящего протока является наиболее широкой и образует веретенообразное расширение перед входом в простату?", "images": [], "options": [{"text": "Канатиковая часть (Pars funicularis)", "images": []}, {"text": "Яичковая часть (Pars testicularis)", "images": []}, {"text": "Мошоночная часть (Pars scrotalis)", "images": []}, {"text": "Ампула семявыносящего протока (Ampulla ductus deferentis)", "images": []}, {"text": "Тазовая часть (Pars pelvica)", "images": []}, {"text": "Паховая часть (Pars inguinalis)", "images": []}], "rows": [], "correct": [3], "explanation": "«Достигнув мочевого пузыря, проток загибается ко дну мочевого пузыря и подходит к предстательной железе. В нижнем своем отделе он заметно расширяется в виде ампулы семявыносящего протока, ampulla ductus deferentis».", "source": "0118_Лекция 8. Половая система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "5ee84158b471", "type": "multichoice", "multiple": false, "text": "В каком анатомическом образовании проходит мужская уретра в области полового члена? Как называется структура, образующаяся на месте лопнувшего зрелого фолликула после овуляции? { ~Первичный фолликул ~Атретический фолликул ~Белое тело (corpus albicans) ~Графов пузырек =Желтое тело (corpus luteum) ~Желтое тело беременности (corpus luteum graviditatis) }", "images": [], "options": [{"text": "В отдельном фиброзном канале под уретрой", "images": []}, {"text": "Внутри обоих пещеристых тел", "images": []}, {"text": "Между пещеристыми телами", "images": []}, {"text": "Внутри губчатого тела полового члена", "images": []}, {"text": "В толще фасции полового члена", "images": []}, {"text": "В толще кожи", "images": []}], "rows": [], "correct": [3], "explanation": "Вопрос содержит склейку двух заданий (во втором, в фигурных скобках, ответ помечен как желтое тело), но приведённые варианты относятся к первому вопросу — где проходит уретра в половом члене. Лекция: «Внутри губчатого тела проходит мочеиспускательный канал, который открывается на головке полового члена». Если на экране окажется список про фолликул — правильный ответ «Желтое тело (corpus luteum)».", "source": "0118_Лекция 8. Половая система.pdf.txt", "confidence": "claude-medium", "moodle_right": ""}, {"key": "d4846c32faf8", "type": "multichoice", "multiple": false, "text": "Какая структура следует непосредственно за дном мочевого пузыря (fundus vesicae) и мочепузырным треугольником на пути оттока мочи?", "images": [], "options": [{"text": "Тело пузыря (Corpus vesicae)", "images": []}, {"text": "Внутреннее отверстие мочеиспускательного канала (Ostium urethrae internum)", "images": []}, {"text": "Срединная пупочная связка (Lig. umbilicale medianum)", "images": []}, {"text": "Верхушка пузыря (Apex vesicae)", "images": []}, {"text": "Наружное отверстие уретры", "images": []}, {"text": "Устья мочеточников (Ostia ureterum)", "images": []}], "rows": [], "correct": [1], "explanation": "«Мочепузырный треугольник по бокам ограничен отверстиями мочеточников... а спереди внутренним отверстием мочеиспускательного канала, ostium urethrae internum» — именно через него моча покидает пузырь, переходя в шейку и уретру.", "source": "0117_Лекция 7 Мочевая система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "cfd2c66cbe95", "type": "multichoice", "multiple": false, "text": "Какое событие в яичнике соответствует середине менструального цикла (примерно 14-й день при 28-дневном цикле)?", "images": [], "options": [{"text": "Начало роста примордиальных фолликулов", "images": []}, {"text": "Максимальное развитие белого тела", "images": []}, {"text": "Начало менструального кровотечения", "images": []}, {"text": "Полная атрофия желтого тела", "images": []}, {"text": "Имплантация зародыша", "images": []}, {"text": "Овуляция", "images": []}], "rows": [], "correct": [5], "explanation": "«Каждые 28-30 дней в фолликуле созревает яйцеклетка... Созревающий фолликул (графов пузырек) продвигается к поверхности яичника и лопается... это процесс овуляции». Конкретная дата 14-го дня в лекции не указана, но классически овуляция приходится на середину 28-дневного цикла.", "source": "0118_Лекция 8. Половая система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "5a390e1902b6", "type": "multichoice", "multiple": false, "text": "Какая часть мужского мочеиспускательного канала является самой длинной и следует за перепончатой частью?", "images": [], "options": [{"text": "Внутреннее отверстие уретры (Ostium urethrae internum)", "images": []}, {"text": "Внутристеночная часть (Pars intramuralis)", "images": []}, {"text": "Промежуточная часть", "images": []}, {"text": "Предстательная часть (Pars prostatica)", "images": []}, {"text": "Губчатая часть (Pars spongiosa)", "images": []}, {"text": "Перепончатая часть (Pars membranacea)", "images": []}], "rows": [], "correct": [4], "explanation": "Перепончатая часть — 1,5 см, простатическая — 2,5 см, а «губчатая часть, pars spongiosa, проходит через губчатое тело полового члена на всем его протяжении» (около 15 см), то есть самая длинная, и следует она сразу за перепончатой.", "source": "0117_Лекция 7 Мочевая система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "9980497c9003", "type": "multichoice", "multiple": false, "text": "Какая часть шейки матки выступает в просвет влагалища?", "images": [], "options": [{"text": "Канал шейки матки (Canalis cervicis uteri)", "images": []}, {"text": "Надвлагалищная часть (Portio supravaginalis)", "images": []}, {"text": "Пальмовидные складки (Plicae palmatae)", "images": []}, {"text": "Задняя губа (Labium posterius)", "images": []}, {"text": "Влагалищная часть (Portio vaginalis)", "images": []}, {"text": "Перешеек (Isthmus uteri)", "images": []}], "rows": [], "correct": [4], "explanation": "«Шейка матки делится на надвлагалищную часть, portio supravaginalis cervicis, и влагалищную часть, portio vaginalis cervicis» — именно последняя выступает в просвет влагалища (и поэтому не покрыта брюшиной).", "source": "0118_Лекция 8. Половая система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "fffa70ea00c6", "type": "multichoice", "multiple": false, "text": "С каким протоком сливается выделительный проток семенного пузырька (ductus excretorius) для образования семявыбрасывающего протока?", "images": [], "options": [{"text": "С протоком придатка яичка (Ductus epididymidis)", "images": []}, {"text": "С семявыбрасывающим протоком (Ductus ejaculatorius)", "images": []}, {"text": "С мочеточником (Ureter)", "images": []}, {"text": "С протоком бульбоуретральной железы", "images": []}, {"text": "С семявыносящим протоком (Ductus deferens)", "images": []}, {"text": "С протоком простаты (Ductulus prostaticus)", "images": []}], "rows": [], "correct": [4], "explanation": "«Нижний заостренный конец семенного пузырька переходит в узкий выделительный проток, ductus excretorius, который соединяется под острым углом с ductus deferens той же стороны, образуя вместе с ним семявыбрасывающий проток, ductus ejaculatorius».", "source": "0118_Лекция 8. Половая система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}]}, {"cmid": "29148", "folder": "06_tsns_i_organy_chuvstv", "title": "Тестирование по ЦНС и органам чувств", "minutes": 20, "group": "Тренировочные", "questions": [{"key": "4c1a0209f03f", "type": "multichoice", "multiple": false, "text": "Определите функциональную принадлежность языкоглоточного нерва (IX пара), иннервирующего мышцы глотки, околоушную железу и заднюю треть языка.", "images": [], "options": [{"text": "Чувствительный нерв", "images": []}, {"text": "Двигательный нерв", "images": []}, {"text": "Исключительно соматический нерв", "images": []}, {"text": "Смешанный нерв", "images": []}], "rows": [], "correct": [3], "explanation": "Языкоглоточный нерв смешанный: содержит двигательные волокна (шилоглоточная мышца), чувствительные (задняя треть языка, глотка, барабанная полость) и парасимпатические (околоушная железа). Материал прямо говорит: «Языкоглоточный нерв (n. glossopharyngeus) - нерв третьей жаберной дуги, смешанный... В составе нерва 3 вида нервных волокон».", "source": "0087_Черепные нервы, шейное сплетение.docx.txt:266", "confidence": "claude-high", "moodle_right": ""}, {"key": "3249c571ff87", "type": "multichoice", "multiple": false, "text": "Каким термином обозначается крупная извилина, расположенная в лобной доле кпереди от центральной борозды и содержащая корковый конец двигательного анализатора?", "images": [], "options": [{"text": "Gyrus cinguli", "images": []}, {"text": "Gyrus postcentralis", "images": []}, {"text": "Gyrus precentralis", "images": []}, {"text": "Gyrus frontalis superior", "images": []}], "rows": [], "correct": [2], "explanation": "Кпереди от центральной борозды в лобной доле лежит предцентральная извилина — корковый конец двигательного анализатора. Материал: «Указанные борозды делят лобную долю на 4 извилины: предцентральную (gyrus precentralis)...», и далее «пучки заканчиваются в ядрах кожного и двигательного анализаторов коры (постцентральная и предцентральная извилины)».", "source": "0084_Центральная нервная система в печать.docx.txt:221,348", "confidence": "claude-high", "moodle_right": ""}, {"key": "35ad779f4a52", "type": "multichoice", "multiple": false, "text": "Как называется самая нижняя часть ствола головного мозга, являющаяся непосредственным продолжением спинного мозга?", "images": [], "options": [{"text": "Pons", "images": []}, {"text": "Mesencephalon", "images": []}, {"text": "Medulla oblongata", "images": []}, {"text": "Diencephalon", "images": []}], "rows": [], "correct": [2], "explanation": "Продолговатый мозг — самая нижняя часть ствола. Материал: «Продолговатый мозг (medulla oblongata) представляет собой отдел мозгового ствола длиной в среднем 25 мм, который является непосредственным продолжением спинного мозга».", "source": "0084_Центральная нервная система в печать.docx.txt:81", "confidence": "claude-high", "moodle_right": ""}, {"key": "eb59c7f8b66e", "type": "multichoice", "multiple": false, "text": "Как называются структуры, образованные аксонами двигательных нейронов, которые выходят из переднелатеральной борозды спинного мозга?", "images": [], "options": [{"text": "Cornua anteriora", "images": []}, {"text": "Radices posteriores", "images": []}, {"text": "Radices anteriores", "images": []}, {"text": "Funiculi laterales", "images": []}], "rows": [], "correct": [2], "explanation": "Передние корешки — это аксоны двигательных клеток передних рогов, выходящие из переднелатеральной борозды. Материал: «Передний корешок (radix anterior) образован преимущественно аксонами двигательных клеток передних рогов спинного мозга... Передний корешок выходит из передней боковой борозды спинного мозга и выполняет двигательные функции».", "source": "0084_Центральная нервная система в печать.docx.txt:40", "confidence": "claude-high", "moodle_right": ""}, {"key": "8692b9000317", "type": "multichoice", "multiple": false, "text": "Укажите латинское название отдела головного мозга, который включает в себя таламус, эпиталамус, метаталамус и гипоталамус.", "images": [], "options": [{"text": "Telencephalon", "images": []}, {"text": "Metencephalon", "images": []}, {"text": "Mesencephalon", "images": []}, {"text": "Diencephalon", "images": []}], "rows": [], "correct": [3], "explanation": "Таламус, эпиталамус, метаталамус и гипоталамус — отделы промежуточного мозга. Материал последовательно описывает их в разделе «Промежуточный мозг (diencephalon)»: «различают более «молодые» отделы промежуточного мозга (таламус, метаталамус, эпиталамус) и относительно «старый» гипоталамус».", "source": "0084_Центральная нервная система в печать.docx.txt:179-180", "confidence": "claude-high", "moodle_right": ""}, {"key": "59e4ff090c23", "type": "multichoice", "multiple": false, "text": "Какое анатомическое образование сосудистой оболочки отвечает за процесс аккомодации благодаря изменению натяжения ресничного пояска (цинновой связки)?", "images": [], "options": [{"text": "Iris", "images": []}, {"text": "Cornea", "images": []}, {"text": "Choroidea", "images": []}, {"text": "Corpus ciliare", "images": []}], "rows": [], "correct": [3], "explanation": "Аккомодацию обеспечивает ресничное тело (corpus ciliare) за счёт ресничной мышцы, меняющей натяжение ресничного пояска. Материал: «Этой мышцей ресничное тело выполняет вторую важную функцию - аккомодационную... При их сокращении ресничное тело подтягивается вперед и натяжение ресничного пояска уменьшается».", "source": "0083_Учение об органах чувств.docx.txt:34-35", "confidence": "claude-high", "moodle_right": ""}, {"key": "965044e7e501", "type": "multichoice", "multiple": false, "text": "Укажите латинское название двигательного ядра отводящего нерва (VI пара), которое проецируется в области лицевого холмика (colliculus facialis) ромбовидной ямки.", "images": [], "options": [{"text": "Nucleus nervi abducentis", "images": []}, {"text": "Nucleus motorius nervi trigemini", "images": []}, {"text": "Nucleus nervi facialis", "images": []}, {"text": "Nucleus salivatorius superior", "images": []}], "rows": [], "correct": [0], "explanation": "Ядро отводящего нерва (nucleus nervi abducentis) лежит в покрышке моста и проецируется на лицевой холмик ромбовидной ямки, где его огибает колено лицевого нерва. Материал подтверждает локализацию ядра в мосту («10 - ядро отводящего нерва») и наличие лицевого бугорка на схеме проекции ядер на ромбовидную ямку («2 - лицевой бугорок»).", "source": "0084_Центральная нервная система в печать.docx.txt:114,145", "confidence": "claude-high", "moodle_right": ""}, {"key": "a3462926a48a", "type": "multichoice", "multiple": false, "text": "Как называется пространство ядра глаза, ограниченное задней поверхностью радужки спереди и передней поверхностью хрусталика сзади?", "images": [], "options": [{"text": "Spatium perichoroideale", "images": []}, {"text": "Camera posterior bulbi", "images": []}, {"text": "Camera anterior bulbi", "images": []}, {"text": "Sinus venosus sclerae", "images": []}], "rows": [], "correct": [1], "explanation": "Задняя камера глаза ограничена спереди задней поверхностью радужки, сзади — хрусталиком. Материал: «Сзади от радужки расположен хрусталик, который вместе с ней ограничивает заднюю камеру глазного яблока (camera posterior bulbi)».", "source": "0083_Учение об органах чувств.docx.txt:28", "confidence": "claude-high", "moodle_right": ""}, {"key": "bb5499a439fd", "type": "multichoice", "multiple": false, "text": "Какая жидкость внутреннего уха первой приходит в движение в лестнице преддверия (scala vestibuli) под действием колебаний толчка стремени?", "images": [], "options": [{"text": "Humor aquosus", "images": []}, {"text": "Liquor cerebrospinalis", "images": []}, {"text": "Endolympha", "images": []}, {"text": "Perilympha", "images": []}], "rows": [], "correct": [3], "explanation": "Лестница преддверия относится к перилимфатическому пространству, поэтому первой приходит в движение перилимфа. Материал: «Они передаются цепочке слуховых косточек и через основание стремени в окне преддверия - перилимфе лестницы преддверия».", "source": "0083_Учение об органах чувств.docx.txt:155", "confidence": "claude-high", "moodle_right": ""}, {"key": "cdb2e661e6df", "type": "multichoice", "multiple": false, "text": "Какая двояковыпуклая прозрачная линза входит в состав светопреломляющего ядра глаза и способна менять свою кривизну?", "images": [], "options": [{"text": "Humor aquosus", "images": []}, {"text": "Cornea", "images": []}, {"text": "Corpus vitreum", "images": []}, {"text": "Lens", "images": []}], "rows": [], "correct": [3], "explanation": "Двояковыпуклая прозрачная линза, меняющая кривизну при аккомодации, — хрусталик (lens). Материал описывает именно изменение кривизны хрусталика ресничной мышцей: «аккомодационную - изменение кривизны хрусталика... Хрусталик в силу своей эластичности принимает более округлую форму». Роговица преломляет, но кривизну не меняет; стекловидное тело и влага — не линзы.", "source": "0083_Учение об органах чувств.docx.txt:35", "confidence": "claude-high", "moodle_right": ""}, {"key": "4efa7d58f83c", "type": "multichoice", "multiple": false, "text": "Каким термином обозначается внутренняя чувствительная оболочка глазного яблока, содержащая фоторецепторы?", "images": [], "options": [{"text": "Cornea", "images": []}, {"text": "Retina", "images": []}, {"text": "Choroidea", "images": []}, {"text": "Sclera", "images": []}], "rows": [], "correct": [1], "explanation": "Внутренняя чувствительная оболочка — сетчатка. Материал: «Внутренняя оболочка глазного яблока (tun. interna bulbi) состоит из сетчатки (retina)... В нервной части находятся светочувствительные клетки - фоторецепторы, которые имеют вид палочек и колбочек».", "source": "0083_Учение об органах чувств.docx.txt:37", "confidence": "claude-high", "moodle_right": ""}, {"key": "b22653a8ae3e", "type": "multichoice", "multiple": false, "text": "Укажите правильный последовательный путь передачи звуковых колебаний по цепи слуховых косточек среднего уха.", "images": [], "options": [{"text": "Stapes -> incus -> malleus", "images": []}, {"text": "Malleus -> stapes -> incus", "images": []}, {"text": "Malleus -> incus -> stapes", "images": []}, {"text": "Incus -> malleus -> stapes", "images": []}], "rows": [], "correct": [2], "explanation": "Цепь идёт от барабанной перепонки к окну преддверия: молоточек — наковальня — стремя. Материал: «Головка молоточка соединяется с телом наковальни. Рукоятка молоточка срастается с барабанной перепонкой. Основание стремени укреплено подвижно в окружности отверстия преддверия».", "source": "0083_Учение об органах чувств.docx.txt:112", "confidence": "claude-high", "moodle_right": ""}, {"key": "cff36d2fd725", "type": "multichoice", "multiple": false, "text": "В каких анатомических образованиях перепончатого лабиринта расположены ампулярные гребешки (cristae ampullares), воспринимающие угловые ускорения и вращательные движения?", "images": [], "options": [{"text": "Ductus cochlearis", "images": []}, {"text": "Canalis reuniens", "images": []}, {"text": "Ductus semicirculares", "images": []}, {"text": "Utriculus et sacculus", "images": []}], "rows": [], "correct": [2], "explanation": "Ампулярные гребешки лежат в ампулах полукружных протоков и реагируют на угловые ускорения. Материал: «Полукружные протоки (ductus semicirculares)... Волосковые чувствительные клетки расположены на ампулярных гребешках (cristae ampullares), которые... находятся в каждой ампуле... При поворотах головы или ускоренном угловом вращении». В мешочках (utriculus et sacculus) расположены пятна (maculae), а не гребешки.", "source": "0083_Учение об органах чувств.docx.txt:145", "confidence": "claude-high", "moodle_right": ""}, {"key": "7204700c7d0d", "type": "multichoice", "multiple": false, "text": "К какому функциональному типу относится подъязычный нерв (XII пара), управляющий движениями мышц языка?", "images": [], "options": [{"text": "Двигательный нерв", "images": []}, {"text": "Вегетативный нерв", "images": []}, {"text": "Смешанный нерв", "images": []}, {"text": "Чувствительный нерв", "images": []}], "rows": [], "correct": [0], "explanation": "XII пара — чисто двигательный нерв мышц языка. Материал: «XII - подъязычный нерв: двигательный (мышцы языка)».", "source": "0087_Черепные нервы, шейное сплетение.docx.txt:21", "confidence": "claude-high", "moodle_right": ""}, {"key": "b6716b95c8e8", "type": "multichoice", "multiple": false, "text": "Какая из слуховых косточек среднего уха своей основой (базисом) закрывает окно преддверия (fenestra vestibuli)?", "images": [], "options": [{"text": "Stapes", "images": []}, {"text": "Malleus", "images": []}, {"text": "Incus", "images": []}, {"text": "Os lenticulare", "images": []}], "rows": [], "correct": [0], "explanation": "Основание стремени закрывает окно преддверия. Материал: «Окно преддверия закрыто основанием стремени, окно улитки - вторичной барабанной перепонкой».", "source": "0083_Учение об органах чувств.docx.txt:110", "confidence": "claude-high", "moodle_right": ""}, {"key": "87c1c4f925d7", "type": "multichoice", "multiple": false, "text": "Через какое анатомическое образование на сетчатке выходит зрительный нерв, из-за чего в этой зоне полностью отсутствуют фоторецепторы («слепое пятно»)?", "images": [], "options": [{"text": "Macula lutea", "images": []}, {"text": "Fovea centralis", "images": []}, {"text": "Discus nervi optici", "images": []}, {"text": "Ora serrata", "images": []}], "rows": [], "correct": [2], "explanation": "Диск зрительного нерва — место выхода нерва, фоторецепторы там отсутствуют («слепое пятно»). Материал: «Место выхода этого нерва из зрительной части сетчатки - это хорошо выраженное овальное возвышение - диск зрительного нерва (discus nn. optici)... Палочки и колбочки в области диска отсутствуют».", "source": "0083_Учение об органах чувств.docx.txt:37", "confidence": "claude-high", "moodle_right": ""}, {"key": "a1ad98bec14c", "type": "multichoice", "multiple": false, "text": "Через какое окно медиальной стенки барабанной полости основание стремени (stapes) передает механические колебания на жидкости внутреннего уха?", "images": [], "options": [{"text": "Apertura tympanica", "images": []}, {"text": "Porus acusticus internus", "images": []}, {"text": "Fenestra vestibuli", "images": []}, {"text": "Fenestra cochleae", "images": []}], "rows": [], "correct": [2], "explanation": "Стремя передаёт колебания через окно преддверия (fenestra vestibuli) на медиальной (лабиринтной) стенке барабанной полости. Материал: «Лабиринтная стенка... На этой стенке имеется 2 отверстия: окно преддверия (fenestra vestibuli) и окно улитки (fenestra cochleae). Окно преддверия закрыто основанием стремени». Окно улитки затянуто вторичной барабанной перепонкой и служит выходом колебаний.", "source": "0083_Учение об органах чувств.docx.txt:110", "confidence": "claude-high", "moodle_right": ""}, {"key": "5d7c73e3c0b0", "type": "multichoice", "multiple": false, "text": "Какое ядро продолговатого мозга является общим чувствительным ядром для IX (языкоглоточного) и X (блуждающего) пар черепных нервов, куда поступают вкусовые и висцерочувствительные импульсы?", "images": [], "options": [{"text": "Nucleus spinalis nervi trigemini", "images": []}, {"text": "Nucleus salivatorius inferior", "images": []}, {"text": "Nucleus ambiguus", "images": []}, {"text": "Nucleus solitarius", "images": []}], "rows": [], "correct": [3], "explanation": "Ядро одиночного пути (nucleus solitarius, ядро одиночного пучка) — общее чувствительное ядро для VII, IX и X пар, принимает вкусовые и висцерочувствительные импульсы. Материал относит его к ядрам продолговатого мозга («4 - ядро одиночного пути») и к ядрам черепных нервов на схеме («21 - ядро одиночного пучка»). Nucleus ambiguus — двигательное (двойное) ядро IX и X, а не чувствительное.", "source": "0084_Центральная нервная система в печать.docx.txt:105; 0087_Черепные нервы, шейное сплетение.docx.txt:29", "confidence": "claude-high", "moodle_right": ""}, {"key": "f57bd806cd6e", "type": "multichoice", "multiple": false, "text": "В полушариях какого отдела головного мозга расположены боковые желудочки (первый и второй)?", "images": [], "options": [{"text": "Telencephalon", "images": []}, {"text": "Mesencephalon", "images": []}, {"text": "Metencephalon", "images": []}, {"text": "Diencephalon", "images": []}], "rows": [], "correct": [0], "explanation": "Боковые желудочки — полости конечного мозга, лежащие в толще его полушарий. Материал: «Полостями конечного мозга являются боковые желудочки (ventriculi laterales). Они расположены в толще полушарий».", "source": "0084_Центральная нервная система в печать.docx.txt:304", "confidence": "claude-high", "moodle_right": ""}, {"key": "639a75548a09", "type": "multichoice", "multiple": false, "text": "Укажите латинское название парасимпатического (добавочного) ядра III пары черепных нервов, обеспечивающего иннервацию мышцы, суживающей зрачок (m. sphincter pupillae).", "images": [], "options": [{"text": "Nucleus nervi oculomotorii", "images": []}, {"text": "Nucleus accessorius nervi oculomotorii", "images": []}, {"text": "Nucleus mesencephalicus nervi trigemini", "images": []}, {"text": "Nucleus nervi trochlearis", "images": []}], "rows": [], "correct": [1], "explanation": "Парасимпатическое ядро III пары — добавочное ядро глазодвигательного нерва (ядро Якубовича-Эдингера-Вестфаля). Материал: «Мезэнцефалическое парасимпатическое ядро - добавочное ядро глазодвигательного нерва (nucleus accessories n. oculomotorii)... Преганглионарные парасимпатические волокна идут из этого ядра... к ресничному узлу», а от узла короткие ресничные нервы «иннервируют сфинктер зрачка и ресничную мышцу».", "source": "0087_Черепные нервы, шейное сплетение.docx.txt:389,397", "confidence": "claude-high", "moodle_right": ""}, {"key": "97c4f917fd28", "type": "multichoice", "multiple": false, "text": "Какова функция отводящего нерва (VI пара), отвечающего за поворот глазного яблока кнаружи?", "images": [], "options": [{"text": "Парасимпатический нерв", "images": []}, {"text": "Чувствительный нерв", "images": []}, {"text": "Двигательный нерв", "images": []}, {"text": "Смешанный нерв", "images": []}], "rows": [], "correct": [2], "explanation": "VI пара — чисто двигательный нерв латеральной прямой мышцы глаза, которая поворачивает глазное яблоко кнаружи. Материал: «VI - отводящий нерв: двигательный (латеральная прямая мышца глаза)» и «Иннервирует наружную прямую мышцу глаза».", "source": "0087_Черепные нервы, шейное сплетение.docx.txt:21,184", "confidence": "claude-high", "moodle_right": ""}, {"key": "d8965a913e22", "type": "multichoice", "multiple": false, "text": "Через какое анатомическое образование водянистая влага (humor aquosus) оттекает из передней камеры глаза в венозную систему?", "images": [], "options": [{"text": "Processus ciliares", "images": []}, {"text": "Pupilla", "images": []}, {"text": "Sinus venosus sclerae", "images": []}, {"text": "Foramen caecum", "images": []}], "rows": [], "correct": [2], "explanation": "Отток водянистой влаги из передней камеры идёт через пространства радужно-роговичного угла в венозный синус склеры (синус Шлемма). Материал: «Из передней камеры через пространства радужно-роговичного угла она оттекает в венозный синус склеры, далее - в венозное сплетение склеры и передние ресничные вены».", "source": "0083_Учение об органах чувств.docx.txt:39", "confidence": "claude-high", "moodle_right": ""}, {"key": "7018cd4dac61", "type": "multichoice", "multiple": false, "text": "В какую полость (камеру) глазного яблока попадает свет непосредственно после прохождения через роговицу?", "images": [], "options": [{"text": "Corpus vitreum", "images": []}, {"text": "Camera anterior bulbi", "images": []}, {"text": "Sinus venosus sclerae", "images": []}, {"text": "Camera posterior bulbi", "images": []}], "rows": [], "correct": [1], "explanation": "Сразу за роговицей лежит передняя камера глаза. Материал: «Между передней поверхностью радужки и роговицей находится передняя камера глазного яблока (camera anterior bulbi)». Дальше свет идёт через зрачок в заднюю камеру, затем хрусталик и стекловидное тело.", "source": "0083_Учение об органах чувств.docx.txt:28", "confidence": "claude-high", "moodle_right": ""}, {"key": "c5d3ef3e3697", "type": "multichoice", "multiple": false, "text": "Каким латинским термином обозначаются корешки спинномозговых нервов, которые состоят из центральных отростков чувствительных узлов и входят в заднелатеральную борозду?", "images": [], "options": [{"text": "Radices posteriores", "images": []}, {"text": "Radices anteriores", "images": []}, {"text": "Funiculi posteriores", "images": []}, {"text": "Cornua posteriora", "images": []}], "rows": [], "correct": [0], "explanation": "Задние корешки — центральные отростки (аксоны) клеток чувствительных спинномозговых узлов, вступающие в заднелатеральную борозду. Материал: «Задний корешок (radix posterior) составляют аксоны чувствительных клеток спинномозговых узлов... Задний корешок вступает в боковую заднюю борозду и является чувствительным».", "source": "0084_Центральная нервная система в печать.docx.txt:40", "confidence": "claude-high", "moodle_right": ""}, {"key": "5ddc6f2b04a8", "type": "multichoice", "multiple": false, "text": "Как называется место на сетчатке, расположенное латеральнее диска зрительного нерва, которое является зоной наилучшего видения и содержит наибольшую концентрацию колбочек?", "images": [], "options": [{"text": "Macula lutea", "images": []}, {"text": "Ora serrata", "images": []}, {"text": "Discus nervi optici", "images": []}, {"text": "Excavatio disci", "images": []}], "rows": [], "correct": [0], "explanation": "Жёлтое пятно (macula lutea) лежит кнаружи (латеральнее) диска зрительного нерва и является зоной наилучшего видения. Материал: «На 4 мм кнаружи от диска зрительного нерва расположено желтое пятно (macula lutea)... содержит большое количество колбочек (палочки отсутствуют) и является местом наилучшего восприятия световых раздражений». Fovea centralis — её центральная ямка, но в вариантах её нет, а термин вопроса («место... содержит наибольшую концентрацию колбочек») соответствует macula lutea.", "source": "0083_Учение об органах чувств.docx.txt:37", "confidence": "claude-high", "moodle_right": ""}, {"key": "3fb8ff21f2af", "type": "multichoice", "multiple": false, "text": "Как называется внутренняя (чувствительная) оболочка глаза, содержащая фоторецепторы (палочки и колбочки)?", "images": [], "options": [{"text": "Retina", "images": []}, {"text": "Cornea", "images": []}, {"text": "Choroidea", "images": []}, {"text": "Sclera", "images": []}], "rows": [], "correct": [0], "explanation": "Внутренняя чувствительная оболочка с палочками и колбочками — сетчатка (retina). Материал: «Внутренняя оболочка глазного яблока (tun. interna bulbi) состоит из сетчатки (retina)... фоторецепторы, которые имеют вид палочек и колбочек». Дубль вопроса 4efa7d58f83c, но с другим порядком вариантов.", "source": "0083_Учение об органах чувств.docx.txt:37", "confidence": "claude-high", "moodle_right": ""}, {"key": "4c920a5892fb", "type": "multichoice", "multiple": false, "text": "Как называется хорошо заметная продольная борозда, проходящая по вентральной поверхности моста по срединной линии?", "images": [], "options": [{"text": "Fissura mediana anterior", "images": []}, {"text": "Sulcus bulbopontinus", "images": []}, {"text": "Sulcus basilaris", "images": []}, {"text": "Sulcus intermedius anterior", "images": []}], "rows": [], "correct": [2], "explanation": "По срединной линии вентральной (передней) поверхности моста проходит базилярная борозда, в которой лежит базилярная артерия. Материал: «Посередине передней поверхности моста расположена базилярная борозда (sul. basilaris)». Fissura mediana anterior — срединная щель продолговатого и спинного мозга, sulcus bulbopontinus — поперечная борозда на границе моста и продолговатого мозга.", "source": "0084_Центральная нервная система в печать.docx.txt:102", "confidence": "claude-high", "moodle_right": ""}, {"key": "024998b4f53a", "type": "multichoice", "multiple": false, "text": "Укажите латинское название прозрачной передней части фиброзной оболочки, которая не имеет сосудов и является мощной светопреломляющей средой.", "images": [], "options": [{"text": "Sclera", "images": []}, {"text": "Retina", "images": []}, {"text": "Cornea", "images": []}, {"text": "Iris", "images": []}], "rows": [], "correct": [2], "explanation": "Передняя прозрачная бессосудистая часть фиброзной оболочки — роговица. Материал: «Фиброзная оболочка глазного яблока (tun. fibrosa bulbi) наружная... состоит из роговицы, занимающей переднюю треть глазного яблока, и склеры, расположенной на остальных двух третях». Роговица — главная светопреломляющая среда глаза (около 40 дптр).", "source": "0083_Учение об органах чувств.docx.txt:18", "confidence": "claude-high", "moodle_right": ""}, {"key": "33a957566a2f", "type": "multichoice", "multiple": false, "text": "Укажите латинское название борозды продолговатого мозга, из которой выходят корешки подъязычного нерва (XII пара).", "images": [], "options": [{"text": "Fissura mediana anterior", "images": []}, {"text": "Sulcus anterolateralis", "images": []}, {"text": "Sulcus posterolateralis", "images": []}, {"text": "Sulcus bulbopontinus", "images": []}], "rows": [], "correct": [1], "explanation": "Корешки XII пары выходят из переднелатеральной борозды между пирамидой и оливой. Материал: «Из передней латеральной борозды между пирамидой и оливой выходят корешки подъязычного нерва. Позади оливы из задней латеральной борозды выходят корешки языкоглоточного, блуждающего и добавочного черепных нервов».", "source": "0084_Центральная нервная система в печать.docx.txt:83", "confidence": "claude-high", "moodle_right": ""}, {"key": "65a168881705", "type": "multichoice", "multiple": false, "text": "Укажите латинское название самой крупной, преимущественно чувствительной части промежуточного мозга, которая представляет собой парное скопление серого вещества.", "images": [], "options": [{"text": "Epithalamus", "images": []}, {"text": "Metathalamus", "images": []}, {"text": "Thalamus", "images": []}, {"text": "Hypothalamus", "images": []}], "rows": [], "correct": [2], "explanation": "Таламус — парное массивное скопление серого вещества, коллектор чувствительных путей, самая крупная часть промежуточного мозга. Материал: «Таламус (thalamus) представляет собой парное массивное образование яйцевидной формы... Таламус представляет собой наиболее крупное скопление серого вещества... является коллектором чувствительных путей».", "source": "0084_Центральная нервная система в печать.docx.txt:181-182", "confidence": "claude-high", "moodle_right": ""}]}, {"cmid": "29147", "folder": "07_serdtse_i_angiologiya", "title": "Тестирование по сердцу и общей ангиологии", "minutes": 20, "group": "Тренировочные", "questions": [{"key": "a09937a0c067", "type": "multichoice", "multiple": false, "text": "Как по-латыни называется левое ушко сердца, расположенное на его передней поверхности рядом с легочным стволом?", "images": [], "options": [{"text": "Auricula sinistra", "images": []}, {"text": "Atrium sinistrum", "images": []}, {"text": "Auricula dextra", "images": []}, {"text": "Ventriculus sinister", "images": []}], "rows": [], "correct": [0], "explanation": "Левое предсердие кпереди продолжается в добавочную полость — левое ушко, auricula sinistra, которое направлено к основанию легочного ствола. Atrium sinistrum — это сама камера, а не ушко.", "source": "0148_Лекция 4.2 Сердце. Круги кровообращения..pdf.txt:151 — «Кпереди оно продолжается в добавочную полость — левое ушко, auricula sinistra, которое направлено к основанию легочного ствола»", "confidence": "claude-high", "moodle_right": ""}, {"key": "363775fe75d4", "type": "multichoice", "multiple": false, "text": "Какие ветви грудной аорты несут артериальную кровь к легким?", "images": [], "options": [{"text": "Rami mediastinales", "images": []}, {"text": "Arteriae pulmonales", "images": []}, {"text": "Rami pericardiaci", "images": []}, {"text": "Rami bronchiales", "images": []}], "rows": [], "correct": [3], "explanation": "Артериальную (питающую) кровь к бронхам и тканям легких несут бронхиальные ветви грудной части аорты, rr. bronchiales. Aa. pulmonales несут венозную кровь из правого желудочка (малый круг), поэтому они не подходят.", "source": "0149_Лекция 4.3. Артерии большого круга кровообращения.pdf.txt:104 — «Висцеральные ветви грудной части аорты: a) Бронхиальные ветви, rr. bronchiales»; 0080_Сердечнососудистая система.docx.txt:309 — «Бронхиальные ветви (rr. bronchiales)... снабжая кровью бронхи и легкие»", "confidence": "claude-high", "moodle_right": ""}, {"key": "40fc14c72934", "type": "multichoice", "multiple": false, "text": "Как называется главная артерия плеча, которая является продолжением подмышечной артерии?", "images": [], "options": [{"text": "Arteria collateralis ulnaris superior", "images": []}, {"text": "Arteria radialis", "images": []}, {"text": "Arteria profunda brachii", "images": []}, {"text": "Arteria brachialis", "images": []}], "rows": [], "correct": [3], "explanation": "Плечевая артерия, a. brachialis, — прямое продолжение подмышечной артерии от нижнего края большой грудной мышцы; идет в sulcus bicipitalis medialis до локтевой ямки, где делится на лучевую и локтевую. A. profunda brachii и a. collateralis ulnaris superior — её ветви.", "source": "0080_Сердечнососудистая система.docx.txt:395 — «Плечевая артерия (a. brachialis) является продолжением подмышечной артерии от нижнего края большой грудной мышцы»", "confidence": "claude-high", "moodle_right": ""}, {"key": "cf511d8be09c", "type": "multichoice", "multiple": false, "text": "Какая крупная магистральная артерия является непосредственным продолжением наружной подвздошной артерии после её выхода из сосудистой лакуны на бедро?", "images": [], "options": [{"text": "Arteria iliaca interna", "images": []}, {"text": "Arteria poplitea", "images": []}, {"text": "Arteria profunda femoris", "images": []}, {"text": "Arteria femoralis", "images": []}], "rows": [], "correct": [3], "explanation": "", "source": "перенесено из другого теста (тот же вопрос)", "confidence": "moodle", "moodle_right": ""}, {"key": "a12523065ad6", "type": "multichoice", "multiple": false, "text": "Из какого отдела сердца берет начало восходящая часть аорты, дающая начало большому кругу кровообращения?", "images": [], "options": [{"text": "Ventriculus sinister", "images": []}, {"text": "Atrium dextrum", "images": []}, {"text": "Ventriculus dexter", "images": []}, {"text": "Atrium sinistrum", "images": []}], "rows": [], "correct": [0], "explanation": "", "source": "перенесено из другого теста (тот же вопрос)", "confidence": "moodle", "moodle_right": ""}, {"key": "e9b1666c8180", "type": "multichoice", "multiple": false, "text": "Какое анатомическое образование представляет собой правый лимфатический проток, собирающий лимфу от правой половины головы, шеи, правой руки и правой половины грудной клетки?", "images": [], "options": [{"text": "Ductus thoracicus", "images": []}, {"text": "Truncus bronchomediastinalis dexter", "images": []}, {"text": "Truncus jugularis dexter", "images": []}, {"text": "Ductus lymphaticus dexter", "images": []}], "rows": [], "correct": [3], "explanation": "", "source": "перенесено из другого теста (тот же вопрос)", "confidence": "moodle", "moodle_right": ""}, {"key": "c3ee98d6cabc", "type": "multichoice", "multiple": false, "text": "Стенки каких камер сердца характеризуются наличием сосочковых мышц, соединенных со створками клапанов сухожильными хордами?", "images": [], "options": [{"text": "Ventriculi cordis", "images": []}, {"text": "Auriculae atriorum", "images": []}, {"text": "Sinus venarum cavarum", "images": []}, {"text": "Atria cordis", "images": []}], "rows": [], "correct": [0], "explanation": "Сосочковые мышцы (mm. papillares), от верхушек которых к створкам атриовентрикулярных клапанов идут сухожильные хорды, образованы внутренним слоем миокарда ЖЕЛУДОЧКОВ. В предсердиях и ушках вместо них гребенчатые мышцы.", "source": "0080_Сердечнососудистая система.docx.txt:191, 196 — «створок... сухожильных хорд и сосочковых мышц, образованных внутренним слоем миокарда желудочков»; «Сухожильные хорды... идущие в виде нитей от краев створок к верхушкам сосочковых мышц»", "confidence": "claude-high", "moodle_right": ""}, {"key": "67986cccb9d7", "type": "multichoice", "multiple": false, "text": "В какой общий венозный коллектор, расположенный на диафрагмальной поверхности сердца, впадает большинство собственных вен миокарда?", "images": [], "options": [{"text": "Vena cava superior", "images": []}, {"text": "Vena cordis magna", "images": []}, {"text": "Sinus coronarius", "images": []}, {"text": "Vena cava inferior", "images": []}], "rows": [], "correct": [2], "explanation": "", "source": "перенесено из другого теста (тот же вопрос)", "confidence": "moodle", "moodle_right": ""}, {"key": "cc3137d6863b", "type": "multichoice", "multiple": false, "text": "Какая крупная артерия отходит от дуги аорты второй по счету и направляется на шею для кровоснабжения левой половины головы и шеи?", "images": [], "options": [{"text": "Arteria subclavia sinistra", "images": []}, {"text": "Arteria carotis communis dextra", "images": []}, {"text": "Arteria carotis communis sinistra", "images": []}, {"text": "Truncus brachiocephalicus", "images": []}], "rows": [], "correct": [2], "explanation": "", "source": "скриншот разбора Moodle (photo_5330347997285522218)", "confidence": "photo", "moodle_right": ""}, {"key": "25cb3c967020", "type": "multichoice", "multiple": false, "text": "Укажите название непарного крупного артериального ствола, который отходит от брюшной аорты сразу под диафрагмой и делится на три ветви: селезеночную, общую печеночную и левую желудочную?", "images": [], "options": [{"text": "Truncus coeliacus", "images": []}, {"text": "Arteria mesentericа superior", "images": []}, {"text": "Arteria iliaca communis", "images": []}, {"text": "Arteria mesentericа inferior", "images": []}], "rows": [], "correct": [0], "explanation": "Чревный ствол, truncus coeliacus, — непарная висцеральная ветвь, отходящая от вентральной поверхности брюшной аорты на уровне XII грудного позвонка (сразу под диафрагмой) и делящаяся на левую желудочную, общую печеночную и селезеночную артерии.", "source": "0149_Лекция 4.3. Артерии большого круга кровообращения.pdf.txt:140,155-160 — «Чревный ствол, truncus coeliacus... разделяется на три артерии: левую желудочную, общую печеночную и селезеночную»", "confidence": "claude-high", "moodle_right": ""}, {"key": "8016b81d2af5", "type": "multichoice", "multiple": false, "text": "Какая ветвь отходит от дуги аорты первой по счету (справа налево)?", "images": [], "options": [{"text": "Arteria carotis communis sinistra", "images": []}, {"text": "Truncus brachiocephalicus", "images": []}, {"text": "Arteria subclavia sinistra", "images": []}, {"text": "Arteria coronaria dextra", "images": []}], "rows": [], "correct": [1], "explanation": "От дуги аорты справа налево отходят: 1) truncus brachiocephalicus, 2) a. carotis communis sinistra, 3) a. subclavia sinistra. Венечные артерии отходят не от дуги, а от восходящей аорты (bulbus aortae).", "source": "скриншот разбора Moodle (part8 №26: «вторая по счету» = a. carotis communis sinistra, значит первая — truncus brachiocephalicus) + 0149_Лекция 4.3. Артерии большого круга кровообращения.pdf.txt:28,66", "confidence": "claude-high", "moodle_right": ""}, {"key": "91e19a419b81", "type": "multichoice", "multiple": false, "text": "В какой венозный сосуд брюшной полости оттекает кровь от желчного пузыря, желудка и поджелудочной железы перед тем, как пройти барьерную очистку?", "images": [], "options": [{"text": "Vena portae hepatis", "images": []}, {"text": "Vena cava inferior", "images": []}, {"text": "Vena lumbalis", "images": []}, {"text": "Vena phrenica inferior", "images": []}], "rows": [], "correct": [0], "explanation": "", "source": "перенесено из другого теста (тот же вопрос)", "confidence": "moodle", "moodle_right": ""}, {"key": "4076ee8a66a2", "type": "multichoice", "multiple": false, "text": "Какая крупная артерия ложится в венечную борозду, огибает левый край сердца и отдает ветви к стенкам левого предсердия и левого желудочка?", "images": [], "options": [{"text": "Ramus marginalis dexter", "images": []}, {"text": "Ramus circumflexus", "images": []}, {"text": "Arteria coronaria dextra", "images": []}, {"text": "Ramus interventricularis posterior", "images": []}], "rows": [], "correct": [1], "explanation": "Огибающая ветвь левой венечной артерии, r. circumflexus, идет по венечной борозде налево, проходит под левым ушком, огибает левый край сердца и отдает ветви к стенке левого предсердия и левого желудочка.", "source": "0148_Лекция 4.2 Сердце. Круги кровообращения..pdf.txt:379-383 — «огибающую ветвь, r. circumflexus, которая сначала идет по венечной борозде налево, проходит под левым ушком... отдавая по пути многочисленные мышечные ветви к стенке левого предсердия и левого желудочка»", "confidence": "claude-high", "moodle_right": ""}, {"key": "bd69e6100d16", "type": "multichoice", "multiple": false, "text": "Как называется крупный парный венозный сосуд, который образуется при слиянии внутренней яремной и подключичной вен позади грудино-ключичного сустава?", "images": [], "options": [{"text": "Vena jugularis interna", "images": []}, {"text": "Vena brachiocephalica", "images": []}, {"text": "Vena subclavia", "images": []}, {"text": "Vena cava superior", "images": []}], "rows": [], "correct": [1], "explanation": "Плечеголовная вена, v. brachiocephalica (парная), образуется слиянием v. subclavia и v. jugularis interna; правая проходит почти вертикально позади грудино-ключичного сустава. V. cava superior — непарная, поэтому не подходит.", "source": "0150_Лекция 4.4. Вены большого круга кровообращения.pdf.txt:66-74 — «Плечеголовные вены, vv. brachiocephalicae (правая и левая)... образуется путем слияния подключичной и внутренней яремной вен... позади грудино-ключичного сустава»", "confidence": "claude-high", "moodle_right": ""}, {"key": "665ba4401a7e", "type": "multichoice", "multiple": false, "text": "Какая артерия предплечья проходит в лучевой борозде и в ее нижней третьей части часто используется для определения пульса, так как прилежит к лучевой кости?", "images": [], "options": [{"text": "Arteria radialis", "images": []}, {"text": "Arteria interossea communis", "images": []}, {"text": "Arteria ulnaris", "images": []}, {"text": "Arteria profunda brachii", "images": []}], "rows": [], "correct": [0], "explanation": "", "source": "перенесено из другого теста (тот же вопрос)", "confidence": "moodle", "moodle_right": ""}, {"key": "b9be9ec6f1bd", "type": "multichoice", "multiple": false, "text": "Слияние каких двух крупных венозных сосудов брюшной полости является главным источником формирования воротной вены?", "images": [], "options": [{"text": "Vena mesenterica superior et vena splenica", "images": []}, {"text": "Vena cava inferior et vena iliaca communis", "images": []}, {"text": "Vena mesenterica inferior et vena renalis", "images": []}, {"text": "Vena hepatica et vena phrenica inferior", "images": []}], "rows": [], "correct": [0], "explanation": "Воротная вена формируется позади головки поджелудочной железы при слиянии двух главных корней — верхней брыжеечной вены (v. mesenterica superior) и селезеночной вены (v. splenica/lienalis). Нижняя брыжеечная вена является корнем лишь в 1/3 случаев.", "source": "0150_Лекция 4.4. Вены большого круга кровообращения.pdf.txt:114-118 — «формируется позади головки поджелудочной железы после слияния двух наиболее значительных ее корней — 1. верхней брыжеечной вены... 2. селезеночной вены»", "confidence": "claude-high", "moodle_right": ""}, {"key": "fd010e5f7a0f", "type": "multichoice", "multiple": false, "text": "Какой магистральный венозный сосуд собирает кровь от непарных органов брюшной полости (желудка, кишечника, селезенки) и несет ее в печень?", "images": [], "options": [{"text": "Vena cava inferior", "images": []}, {"text": "Vena splenica", "images": []}, {"text": "Vena renalis", "images": []}, {"text": "Vena portae", "images": []}], "rows": [], "correct": [3], "explanation": "", "source": "скриншот разбора Moodle (photo_5330347997285522216)", "confidence": "photo", "moodle_right": ""}, {"key": "cf2770cb02f6", "type": "multichoice", "multiple": false, "text": "Какая структура (заслонка) частично прикрывает отверстие венечного синуса в месте его впадения в правое предсердие?", "images": [], "options": [{"text": "Valvula foraminis ovalis", "images": []}, {"text": "Cuspis anterior", "images": []}, {"text": "Valvula venae cavae inferioris", "images": []}, {"text": "Valvula sinus coronarii", "images": []}], "rows": [], "correct": [3], "explanation": "Устье венечного синуса в правом предсердии частично прикрыто заслонкой венечного синуса — valvula sinus coronarii (заслонка Тебезия). Valvula venae cavae inferioris (заслонка Евстахия) прикрывает отверстие нижней полой вены.", "source": "0080_Сердечнососудистая система.docx.txt:181 — «7 - устье венечного синуса; 8 - заслонка венечного синуса; 9 - заслонка нижней полой вены»", "confidence": "claude-high", "moodle_right": ""}, {"key": "a0be3547e781", "type": "multichoice", "multiple": false, "text": "Как называется участок аорты, расположенный в заднем средостении грудной полости?", "images": [], "options": [{"text": "Arcus aortae", "images": []}, {"text": "Aorta abdominalis", "images": []}, {"text": "Aorta ascendens", "images": []}, {"text": "Aorta thoracica", "images": []}], "rows": [], "correct": [3], "explanation": "Грудная часть аорты (pars thoracica aortae, aorta thoracica) лежит в заднем средостении, слева от тел V–VIII и спереди тел IX–XII грудных позвонков. Восходящая аорта и дуга относятся к верхнему/переднему средостению.", "source": "0149_Лекция 4.3. Артерии большого круга кровообращения.pdf.txt:83-89 — «Грудная часть аорты, pars thoracica aortae... лежит в заднем средостении»", "confidence": "claude-high", "moodle_right": ""}, {"key": "4465d95f569c", "type": "multichoice", "multiple": false, "text": "Какая крупная глубокая вена залегает в одноименной ямке позади коленного сустава?", "images": [], "options": [{"text": "Vena femoralis", "images": []}, {"text": "Vena iliaca externa", "images": []}, {"text": "Vena saphena magna", "images": []}, {"text": "Vena poplitea", "images": []}], "rows": [], "correct": [3], "explanation": "", "source": "перенесено из другого теста (тот же вопрос)", "confidence": "moodle", "moodle_right": ""}, {"key": "a874d085d08d", "type": "multichoice", "multiple": false, "text": "Миокард какой камеры сердца имеет наибольшую толщину, что связано с высокой гидравлической нагрузкой?", "images": [], "options": [{"text": "Atrium sinistrum", "images": []}, {"text": "Ventriculus sinister", "images": []}, {"text": "Ventriculus dexter", "images": []}, {"text": "Atrium dextrum", "images": []}], "rows": [], "correct": [1], "explanation": "", "source": "скриншот разбора Moodle (photo_5330347997285522204)", "confidence": "photo", "moodle_right": ""}, {"key": "c5b86deee8d5", "type": "multichoice", "multiple": false, "text": "Какая вена собирает кровь от верхних отделов левой стенки грудной полости, идет сверху вниз по левой стороне позвоночника и впадает в полунепарную вену (или непосредственно в непарную вену)?", "images": [], "options": [{"text": "Vena azygos", "images": []}, {"text": "Vena hemiazygos", "images": []}, {"text": "Vena brachiocephalica sinistra", "images": []}, {"text": "Vena hemiazygos accessoria", "images": []}], "rows": [], "correct": [3], "explanation": "Добавочная полунепарная вена, v. hemiazygos accessoria, формируется из 6–7 левых ВЕРХНИХ задних межреберных вен, идет сверху вниз по левой стороне позвоночника и впадает в полунепарную вену или, переходя вправо, — в непарную. Это ровно формулировка вопроса; сама v. hemiazygos формируется из левой восходящей поясничной вены (нижние отделы).", "source": "0080_
