<style>
:root {
  color-scheme: light;  /* не давать телефону в ночном режиме перекрашивать страницу */
  --bg: #f6f5f2; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1db;
  --accent: #2f5d8a; --accent-ink: #ffffff; --ok: #1f7a4d; --ok-bg: #e5f4ec; --bad: #b3261e; --bad-bg: #fbe9e7;
  --warn: #8a5a00; --warn-bg: #fff3d6; --sel: #e8eef6;
}
/* Тёмная тема отключена намеренно: учить удобнее по светлому,

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 80px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
header.top h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
header.top .sub { color: var(--muted); font-size: 14px; }
button, .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 14px;
  border-radius: 8px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.sm { padding: 5px 10px; font-size: 14px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.test-card h3 { font-size: 16px; margin: 0 0 6px; line-height: 1.3; }
.meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.timer.low { color: var(--bad); }
.progress { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 16px; }
.progress > i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.qnum { color: var(--muted); font-size: 14px; margin-bottom: 6px; }
.qtext { font-size: 18px; font-weight: 500; margin: 0 0 14px; }
.qimg { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); margin: 6px 0 12px; background: #fff; }
.opt { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 8px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--card); }
.opt .l { font-weight: 600; color: var(--muted); min-width: 1.4em; }
.opt .t { flex: 1; }
.opt.chosen { background: var(--sel); border-color: var(--accent); }
.opt.right { background: var(--ok-bg); border-color: var(--ok); }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
.opt .mark { font-weight: 700; }
.opt.right .mark { color: var(--ok); } .opt.wrong .mark { color: var(--bad); }
.note { border-left: 3px solid var(--accent); background: var(--sel); border-radius: 0 8px 8px 0; padding: 10px 14px; margin: 12px 0 0; font-size: 15px; }
.note .src { display: block; color: var(--muted); font-size: 13px; margin-top: 6px; }
.note .src.ok { color: var(--ok); font-weight: 500; }
.note .src.warn { color: var(--warn); font-weight: 500; }
.note.nokey { border-color: var(--warn); background: var(--warn-bg); }
.nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.score { font-size: 42px; font-weight: 700; letter-spacing: -0.02em; }
.score small { font-size: 18px; font-weight: 500; color: var(--muted); }
.rev-q { border-top: 1px solid var(--line); padding: 18px 0; }
.rev-q:first-of-type { border-top: 0; }
.rev-head { display: flex; gap: 8px; align-items: baseline; margin-bottom: 8px; }
.rev-head .ico { font-size: 18px; }
.ans-line { margin: 4px 0; font-size: 15px; }
.ans-line b { font-weight: 600; }
.hidden { display: none !important; }
.setkey { border: 1px dashed var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 12px; font-size: 14px; color: var(--muted); }
.setkey b { color: var(--ink); }
label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); cursor: pointer; }
.empty { color: var(--muted); font-style: italic; }
@media print {
  body { background: #fff; }
  .noprint, header.top, .nav, .progress, .bar { display: none !important; }
  .card, .rev-q { border: 0; box-shadow: none; padding: 0; break-inside: avoid; }
  .wrap { max-width: none; padding: 0; }
  .print-key { display: block !important; }
  .opt { border: 0; padding: 2px 0; margin: 0; background: none !important; }
  .opt:not(.right) { display: none; }
}
.print-key { display: none; }
</style>

icialis и lamina profunda f. cervicalis propria), которое над подъязычной костью образует влагалище поднижнечелюстной слюнной железы, и телом нижней челюсти; в пространстве лежат gl. submandibularis и a. et v. facialis. В материалах курса описано само фасциальное влагалище железы, но термин spatium submandibulare и перечень границ не даны — остальные варианты заведомо неполны (одна структура).", "source": "0074_Мышцы и фасции шеи.docx.txt + классическая топографическая анатомия", "confidence": "claude-medium", "moodle_right": ""}, {"key": "5f7f24c42855", "type": "multichoice", "multiple": false, "text": "Назовите мышцу, которая закрывает ротовую щель", "images": [], "options": [{"text": "m. mentalis", "images": []}, {"text": "m. sternohyoideus", "images": []}, {"text": "m. stylohyoideus", "images": []}, {"text": "m. risorius", "images": []}, {"text": "m. masseter", "images": []}, {"text": "m. buccinator", "images": []}, {"text": "m. pterygoideus lateralis", "images": []}, {"text": "m. hyoglossus", "images": []}, {"text": "m. orbicularis oris", "images": []}, {"text": "m. depressor labii inferioris", "images": []}], "rows": [], "correct": [8], "explanation": "«Круговая мышца рта (m. orbicularis oris) располагается вокруг ротового отверстия в толще губ… Функция: закрывает рот, вытягивает губы вперёд». Мышца расположена циркулярно, поэтому суживает (закрывает) отверстие.", "source": "0073_Мышцы и фасции лица.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "af7b4f6178f8", "type": "multichoice", "multiple": false, "text": "Назовите мышцу, которая, воздействуя на височно-нижнечелюстной сустав, опускает нижнюю челюсть", "images": [], "options": [{"text": "m. corrugator supercilii", "images": []}, {"text": "m. orbicularis oris", "images": []}, {"text": "m. temporalis", "images": []}, {"text": "m. pterygoideus medidlis", "images": []}, {"text": "m. mentalis", "images": []}, {"text": "m. masseter", "images": []}, {"text": "m. pterygoideus lateralis", "ima стка атланта, прикрепляется к базилярной части затылочной кости. Функция: наклоняет голову вперёд» — то есть действует именно в атланто-затылочном суставе. M. obliquus capitis inferior перекидывается между атлантом и осевым позвонком, то есть работает в атлантоосевом (не атланто-затылочном) суставе.", "source": "0074_Мышцы и фасции шеи.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "e783ae88ab05", "type": "multichoice", "multiple": false, "text": "Какая мышца начинается от facies posterior manubrium sterni и прикрепляется к corpus ossis hyoidei?", "images": [], "options": [{"text": "m. sternohyoideus", "images": []}, {"text": "m. digastricus", "images": []}, {"text": "m. omohyoideus", "images": []}, {"text": "m. mylohyoideus", "images": []}, {"text": "m. sternothyroideus", "images": []}, {"text": "m. thyrohyoideus", "images": []}], "rows": [], "correct": [0], "explanation": "«Грудино-подъязычная мышца (m. sternohyoideus) начинается от внутренней поверхности рукоятки грудины, грудинного конца ключицы, идет вверх; прикрепляется к нижнему краю тела подъязычной кости». M. sternothyroideus идёт к щитовидному хрящу, а не к подъязычной кости.", "source": "0074_Мышцы и фасции шеи.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "c1cd1b9349d9", "type": "multichoice", "multiple": false, "text": "Какие структуры ограничивают trigonum submandibulare?", "images": [], "options": [{"text": "только mandibula", "images": []}, {"text": "margo inferior mandibulae и брюшки m. digastricus", "images": []}, {"text": "только corpus ossis hyoidei", "images": []}, {"text": "только m. mylohyoideus", "images": []}, {"text": "только m. scaleni", "images": []}, {"text": "только m. sternohyoideus", "images": []}], "rows": [], "correct": [1], "explanation": "«Передний треугольник посредством двубрюшной мышцы и верхнего брюшка лопаточно-подъязычной мышцы делится на 4 треугольника: сонный, лопаточно-трахеальный, поднижнечелюстной и подподбородочный». Соответ  "source": "0073_Мышцы и фасции лица.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "6642f85baeeb", "type": "multichoice", "multiple": false, "text": "При одностороннем сокращении m. pterygoideus lateralis происходит какое движение?", "images": [], "options": [{"text": "смещение челюсти в сторону сокращения", "images": []}, {"text": "запрокидывание головы", "images": []}, {"text": "смещение челюсти в противоположную сторону", "images": []}, {"text": "опускание челюсти", "images": []}, {"text": "циклическое движение", "images": []}, {"text": "поднятие челюсти", "images": []}], "rows": [], "correct": [2], "explanation": "Дословно по источнику: «Функция [m. pterygoideus lateralis]: при двустороннем сокращении выдвигает нижнюю челюсть вперёд, при одностороннем смещает ее в противоположную сторону». Это классическая ловушка: челюсть идёт в сторону, ПРОТИВОПОЛОЖНУЮ сократившейся мышце.", "source": "0073_Мышцы и фасции лица.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "09894e7bbfd5", "type": "multichoice", "multiple": false, "text": "Какая структура делит regio colli (область шеи) на переднюю и боковую области?", "images": [], "options": [{"text": "только processus mastoideus", "images": []}, {"text": "m. sternocleidomastoideus", "images": []}, {"text": "только margo inferior mandibulae", "images": []}, {"text": "только clavicula", "images": []}, {"text": "только linea mediana", "images": []}, {"text": "только lig. nuchae", "images": []}], "rows": [], "correct": [1], "explanation": "", "source": "скриншот разбора Moodle (photo_...501)", "confidence": "photo", "moodle_right": ""}, {"key": "ed9aead150ba", "type": "multichoice", "multiple": false, "text": "Какие структуры образуют galea aponeurotica как основной сухожильный шлем черепа?", "images": [], "options": [{"text": "venter occipitalis и апоневроз, переходящий в venter frontalis", "images": []}, {"text": "m. epicranius et f. superficialis capitis", "images": []}, {"text": "только m. temporalis апоневроз", "images": []}, {"text": "только fascia temporalis", "images": []}, {"text": "venter occipitalis m. occipitofrontalis", "images": []}, {"text": "venter frontalis m. occipitofrontalis", "images": []}], "rows": [], "correct": [0], "explanation": "", "source": "перенесено из другого теста (тот же вопрос)", "confidence": "moodle", "moodle_right": ""}, {"key": "4ed0133701f1", "type": "multichoice", "multiple": false, "text": "Какая часть m. orbicularis oculi осуществляет расширение слезного мешка и поступление в него слезной жидкости?", "images": [], "options": [{"text": "pars palpebralis", "images": []}, {"text": "pars temporalis", "images": []}, {"text": "pars orbitalis", "images": []}, {"text": "pars nasalis", "images": []}, {"text": "pars frontalis", "images": []}, {"text": "pars lacrimalis", "images": []}], "rows": [], "correct": [5], "explanation": "", "source": "скриншот разбора Moodle (photo_...509)", "confidence": "photo", "moodle_right": ""}, {"key": "f2b7a14555b5", "type": "multichoice", "multiple": false, "text": "Назовите мышцу, которая состоит из 2 х частей, закрывая ротовую щель", "images": [], "options": [{"text": "m. depressor anguli oris", "images": []}, {"text": "m. levator anguli oris", "images": []}, {"text": "m. buccinator", "images": []}, {"text": "m. levator labii superioris", "images": []}, {"text": "m. depressor labii inferioris", "images": []}, {"text": "m. orbicularis oris", "images": []}], "rows": [], "correct": [5], "explanation": "«Круговая мышца рта (m. orbicularis oris)… В ней различают две части: краевую часть (pars marginalis) и губную часть (pars labialis)… Функция: закрывает рот». Два признака вопроса — две части и закрытие ротовой щели — совпадают только с m. orbicularis oris.", "source": "0073_Мышцы и фасции лица.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "3b83c5a33a1d", "type": "multichoice", "multiple": false, "text": "Какие границы образуют trigonum omotracheale?", "images": [], "options": [{"text": "m. sternocleidomastoideus, venter superior m. omohyoideus и linea mediana colli", "images": []}, {"text": "только corpus mandibulae", "images": []}, {"text": "только clavicula", "images": []}, {"text": "только processus mastoideus", "images": []}, {"text": "только incisura jugularis", "images": []}, {"text": "только venter inferior m. omohyoideus", "images": []}], "rows": [], "correct": [0], "explanation": "Лопаточно-трахеальный треугольник (trigonum omotracheale) — часть переднего треугольника шеи, выделяемая верхним брюшком m. omohyoideus; он ограничен медиально срединной линией шеи, сверху/латерально верхним брюшком лопаточно-подъязычной мышцы и латерально передним краем m. sternocleidomastoideus. Источник подтверждает деление переднего треугольника верхним брюшком m. omohyoideus и срединной линией шеи, но полный перечень границ треугольника в тексте не приведён.", "source": "0074_Мышцы и фасции шеи.docx.txt + классическая анатомия", "confidence": "claude-medium", "moodle_right": ""}, {"key": "76e1c21410ab", "type": "multichoice", "multiple": false, "text": "Назовите мышцу, которая, воздействуя на височно-нижнечелюстной сустав, поднимает нижнюю челюсть", "images": [], "options": [{"text": "m. stylohyoideus", "images": []}, {"text": "m. digastricus", "images": []}, {"text": "m. pterygoideus lateralis", "images": []}, {"text": "m. sternohyoideus", "images": []}, {"text": "m. depressor labii inferioris", "images": []}, {"text": "m. buccinator", "images": []}, {"text": "m. mentalis", "images": []}, {"text": "m. orbicularis oris", "images": []}, {"text": "m. hyoglossus", "images": []}, {"text": "m. masseter", "images": []}], "rows": [], "correct": [2], "explanation": "", "source": "скриншот разбора Moodle (photo_...504)", "confidence": "photo", "moodle_right": ""}]}, {"cmid": "27934", "folder": "03_pishchevaritelnaya", "title": "Тестирование по пищеварительной системе", "minutes": 10, "group": "Тренировочные", "questions": [{"key": "3affad848e36", "type": "multichoice", "multiple": false, "text": "Где открываются протоки малых подъязычных желез (ductus sublinguales minores)?", "images": [], "options": [{"text": "В Fossa tonsillaris", "images": []}, {"text": "В Foramen caecum языка", "images": []}, {"text": "В преддверии рта на уровне верхних моляров", "images": []}, {"text": "Вдоль Plica sublingualis", "images": []}, {"text": "На нижней поверхности языка", "images": []}, {"text": "На Caruncula sublingualis", "images": []}], "rows": [], "correct": [3], "explanation": "Дословно по источнику: «от отдельных долек железы… берут начало малые подъязычные протоки (ductus sublinguales minores) (18-20), которые открываются самостоятельно в полость рта вдоль подъязычной складки». На caruncula sublingualis (подъязычном сосочке) открываются большой подъязычный и поднижнечелюстной протоки — это другой вариант.", "source": "0064_Анатомия полости рта и зубов.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "ee078d42b3b4", "type": "multichoice", "multiple": false, "text": "Какой отдел прямой кишки следует непосредственно за сигмовидной кишкой?", "images": [], "options": [{"text": "Промежностный изгиб", "images": []}, {"text": "Сфинктер заднего прохода", "images": []}, {"text": "Заднепроходное отверстие (Anus)", "images": []}, {"text": "Морганиевы столбы", "images": []}, {"text": "Анальный канал (Canalis analis)", "images": []}, {"text": "Надампулярная часть и Ампула прямой кишки (Ampulla recti)", "images": []}], "rows": [], "correct": [5], "explanation": "Сразу за сигмовидной кишкой начинается прямая кишка, в которой различают надампулярную часть и ампулу (ampulla recti), а ниже — заднепроходный канал (canalis analis), заканчивающийся anus. Остальные варианты — более дистальные отделы и структуры.", "source": "0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "c54f0b7d3954", "type": "multichoice", "multiple": false, "text": "Какой участок тонкой кишки начинается сразу за привратником?", "images": [], "options": [{"text": "duodenum", "images": []}, {"text": "colon ascendens", "images": []}, {"text": "ileum", "images": []}, {"text": "intestinum crassum", "images": []}, {"text": "caecum", "images": []}, {"text": "jejunum", "images": []}], "rows": [], "correct": [0], "explanation": "Тонкая кишка начинается двенадцатиперстной кишкой (duodenum), которая следует сразу за привратником желудка; jejunum и ileum идут далее. Варианты colon ascendens, caecum, intestinum crassum относятся к толстой кишке.", "source": "0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "9567f0ee6bd2", "type": "multichoice", "multiple": false, "text": "Какое образование глотки содержит трубную миндалину (tonsilla tubaria)?", "images": [], "options": [{"text": "Трубный валик (Torus tubarius)", "images": []}, {"text": "Небная миндалина (Tonsilla palatina)", "images": []}, {"text": "Крыловидно-нижнечелюстной шов (Raphe pterygomandibularis)", "images": []}, {"text": "Грушевидный карман (Recessus piriformis)", "images": []}, {"text": "Ямка надгортанника (Vallecula epiglottica)", "images": []}, {"text": "Глоточный карман (Recessus pharyngeus)", "images": []}], "rows": [], "correct": [0], "explanation": "«На боковых стенках носовой части глотки… находится парное… глоточное отверстие слуховой трубы, которое сзади и сверху ограничено трубным валиком (torus tubarius)». Именно в области трубного валика, вокруг устья трубы, лежит скопление лимфоидной ткани — трубная миндалина (tonsilla tubaria), одна из шести миндалин кольца Пирогова–Вальдейера.", "source": "0064_Анатомия полости рта и зубов.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "f2da005191cc", "type": "multichoice", "multiple": false, "text": "Какой отдел толстой кишки следует непосредственно за слепой кишкой?", "images": [], "options": [{"text": "Сигмовидная ободочная кишка (Colon sigmoideum)", "images": []}, {"text": "Восходящая ободочная кишка (Colon ascendens)", "images": []}, {"text": "Поперечная ободочная кишка (Colon transversum)", "images": []}, {"text": "Нисходящая ободочная кишка (Colon descendens)", "images": []}, {"text": "Червеобразный отросток (Appendix vermiformis)", "images": []}, {"text": "Прямая кишка (Rectum)", "images": []}], "rows": [], "correct": [1], "explanation": "Порядок отделов толстой кишки: caecum → colon ascendens → colon transversum → colon descendens → colon sigmoideum → rectum. Appendix vermiformis — отросток самой слепой кишки, а не следующий за ней отдел.", "source": "0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "d8e42be49955", "type": "multichoice", "multiple": false, "text": "Через какое отверстие диафрагмы пищевод проникает из грудной полости в брюшную?", "images": [], "options": [{"text": "Аортальное отверстие (Hiatus aorticus)", "images": []}, {"text": "Отверстие нижней полой вены (Foramen venae cavae)", "images": []}, {"text": "Пищеводное отверстие (Hiatus oesophageus)", "images": []}, {"text": "Грудино-реберный треугольник (Trigonum sternocostale)", "images": []}, {"text": "Пояснично-реберный треугольник (Trigonum lumbocostale)", "images": []}, {"text": "Медиальная дугообразная связка (Lig. arcuatum mediale)", "images": []}], "rows": [], "correct": [2], "explanation": "Пищевод переходит в брюшную полость через пищеводное отверстие диафрагмы (hiatus oesophageus) на уровне X–XI грудного позвонка: «Брюшная часть (pars abdominalis) пищевода… расположена между пищеводным отверстием диафрагмы на уровне X-XI грудного позвонка и входом в желудок». Через hiatus aorticus проходит аорта, через foramen venae cavae — нижняя полая вена.", "source": "0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "4203d6039fc9", "type": "multichoice", "multiple": false, "text": "Какой отдел тонкой кишки следует непосредственно за привратником желудка (pylorus)?", "images": [], "options": [{"text": "Тощая кишка (Jejunum)", "images": []}, {"text": "Слепая кишка (Caecum)", "images": []}, {"text": "Горизонтальная часть дуоденум", "images": []}, {"text": "Подвздошная кишка (Ileum)", "images": []}, {"text": "Верхняя часть двенадцатиперстной кишки (Pars superior duodeni)", "images": []}, {"text": "Нисходящая часть дуоденум", "images": []}], "rows": [], "correct": [4], "explanation": "Сразу за привратником (pylorus) следует верхняя часть двенадцатиперстной кишки (pars superior duodeni), образующая ампулу/«луковицу»; горизонтальная и нисходящая части лежат дальше по ходу duodenum. Вопрос требует именно конкретный отдел, а не кишку в целом.", "source": "классическая анатомия (Сапин, Международная анатомическая терминология)", "confidence": "claude-medium", "moodle_right": ""}, {"key": "b42930ceb93b", "type": "multichoice", "multiple": false, "text": "Какой отдел кишечника следует непосредственно за двенадцатиперстной кишкой (duodenum)?", "images": [], "options": [{"text": "Appendix vermiformis", "images": []}, {"text": "Ileum", "images": []}, {"text": "Jejunum", "images": []}, {"text": "Colon sigmoideum", "images": []}, {"text": "Caecum", "images": []}, {"text": "Colon ascendens", "images": []}], "rows": [], "correct": [2], "explanation": "За двенадцатиперстной кишкой следует тощая кишка (jejunum): «Тощая кишка (jejunum) и подвздошная кишка (ileum) образуют ряд петель…», причём jejunum начинается от двенадцатиперстно-тощекишечного изгиба (flexura duodenojejunalis). Ileum идёт после jejunum.", "source": "0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "4d101494fc02", "type": "multichoice", "multiple": false, "text": "Сколько продольных мышечных лент (taeniae coli) имеется у ободочной кишки?", "images": [], "options": [{"text": "Пять лент", "images": []}, {"text": "Одна лента", "images": []}, {"text": "Две ленты", "images": []}, {"text": "Шесть лент", "images": []}, {"text": "Четыре ленты", "images": []}, {"text": "Три ленты", "images": []}], "rows": [], "correct": [5], "explanation": "«Ленты ободочной кишки (taenia coli)… появляются в связи с неравномерным распределением продольных мышечных пучков, собранных в виде полос только в трех местах… Различают сальниковую ленту (taenia omentalis)…» — всего три ленты: свободная, сальниковая и брыжеечная.", "source": "0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "e853f00208f2", "type": "multichoice", "multiple": false, "text": "На уровне какого зуба открывается проток околоушной слюнной железы (ductus parotideus) в преддверии рта?", "images": [], "options": [{"text": "Третьего верхнего моляра", "images": []}, {"text": "Второго верхнего моляра", "images": []}, {"text": "Второго нижнего моляра", "images": []}, {"text": "Второго верхнего премоляра", "images": []}, {"text": "Первого нижнего моляра", "images": []}, {"text": "Первого верхнего моляра", "images": []}], "rows": [], "correct": [1], "explanation": "«На уровне верхнего 2-го большого коренного зуба на ней имеется возвышение - сосочек протока околоушной железы (papilla ductus parotidei)» — то есть ductus parotideus открывается в преддверии рта на уровне второго верхнего моляра.", "source": "0064_Анатомия полости рта и зубов.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "aabc6b858b6b", "type": "multichoice", "multiple": false, "text": "Какая связка соединяет верхушку корня зуба с дном альвеолы, пропуская сосуды и нервы?", "images": [], "options": [{"text": "Межзубная связка (Lig. interdentale)", "images": []}, {"text": "Никакая", "images": []}, {"text": "Спиральная связка", "images": []}, {"text": "Зубная связка (Lig. dentis)", "images": []}, {"text": "Круговая связка зуба (Lig. circulare dentis)", "images": []}, {"text": "Десневая связка", "images": []}], "rows": [], "correct": [1], "explanation": "Такой связки не существует: фиксацию зуба обеспечивает периодонт, волокна которого (зубодесневые, межзубные, зубоальвеолярные) натянуты между цементом корня и костной альвеолой, а сосуды и нервы входят в зуб через апикальное отверстие, не образуя связки. Терминов «Lig. dentis», «Lig. circulare dentis» или «спиральная связка» в материалах курса и в Международной анатомической терминологии нет.", "source": "0064_Анатомия полости рта и зубов.docx.txt", "confidence": "claude-medium", "moodle_right": ""}, {"key": "eaf24708dc6f", "type": "multichoice", "multiple": false, "text": "В каком слое стенки пищевода находятся собственные железы пищевода (glandulae oesophageae)?", "images": [], "options": [{"text": "Продольный мышечный слой (Stratum longitudinale)", "images": []}, {"text": "Собственная пластинка слизистой оболочки (Lamina propria mucosae)", "images": []}, {"text": "Мышечная пластинка слизистой оболочки (Lamina muscularis mucosae)", "images": []}, {"text": "Подслизистая основа (Tela submucosa)", "images": []}, {"text": "Адвентициальная оболочка (Tunica adventitia)", "images": []}, {"text": "Круговой мышечный слой (Stratum circulare)", "images": []}], "rows": [], "correct": [3], "explanation": "По классической анатомии и гистологии собственные железы пищевода (glandulae oesophageae propriae) — сложные альвеолярно-трубчатые железы, залегающие именно в подслизистой основе (tela submucosa); их выводные протоки прободают мышечную пластинку слизистой и открываются на поверхности эпителия. ВНИМАНИЕ: в материале кафедры формулировка иная — железы отнесены к слизистой оболочке («В ней содержатся собственные пищеводные и кардиальные железы»), поэтому если кафедра ждёт ответ по своему тексту, правильным могут счесть вариант «Lamina propria mucosae» (индекс 1). Выбран стандартный вариант tela submucosa, но сомнение реальное.", "source": "классическая анатомия/гистология; ср. 0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-low", "moodle_right": ""}, {"key": "75ec89ef44b7", "type": "multichoice", "multiple": false, "text": "Какая костная структура образует заднюю треть костного неба (palatum osseum)?", "images": [], "options": [{"text": "Processus pterygoideus ossis sphenoidalis", "images": []}, {"text": "Lamina perpendicularis ossis palatini", "images": []}, {"text": "Processus palatinus maxillae", "images": []}, {"text": "Vomer", "images": []}, {"text": "Processus alveolaris maxillae", "images": []}, {"text": "Lamina horizontalis ossis palatini", "images": []}], "rows": [], "correct": [5], "explanation": "«Твердое нёбо (palatum durum) состоит из костного нёба (palatum osseum), включающего нёбный отросток верхней челюсти и горизонтальную пластинку нёбной кости». Нёбные отростки верхней челюсти формируют передние две трети, а горизонтальные пластинки нёбных костей (lamina horizontalis ossis palatini) — заднюю треть костного нёба.", "source": "0064_Анатомия полости рта и зубов.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "eb0bafa503e7", "type": "multichoice", "multiple": false, "text": "Какой слой стенки полого органа обеспечивает его перистальтику и постоянный тонус, и из какой ткани он преимущественно состоит в средней трети пищевода?", "images": [], "options": [{"text": "Мышечная оболочка (Tunica muscularis) — гладкая мышечная ткань", "images": []}, {"text": "Слизистая оболочка (Tunica mucosa) — многослойный плоский эпителий", "images": []}, {"text": "Серозная оболочка (Tunica serosa) — мезотелий", "images": []}, {"text": "Мышечная оболочка (Tunica muscularis) — поперечно-полосатая мышечная ткань", "images": []}, {"text": "Адвентициальная оболочка (Tunica adventitia) — рыхлая соединительная ткань", "images": []}, {"text": "Подслизистая основа (Tela submucosa) — рыхлая волокнистая соединительная ткань", "images": []}], "rows": [], "correct": [0], "explanation": "Перистальтику и тонус обеспечивает мышечная оболочка (tunica muscularis) из продольного и циркулярного слоёв. Лекция указывает, что поперечно-полосатая мышечная ткань есть «лишь в органах полости рта, глотке и в начальной части пищевода», остальная часть — гладкая, поэтому для средней трети выбран вариант с гладкой мышечной тканью. Замечание: в учебнике кафедры верхний отдел грудной части назван смешанным (поперечнополосатые + гладкие), а «только гладкие» — в нижней трети, так что средняя треть строго говоря переходная; но из предложенных формулировок гладкомышечная ближе всего.", "source": "0114_Лекция 4 . Общая спланхнология.pdf.txt + 0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-medium", "moodle_right": ""}, {"key": "c53f28bc664c", "type": "multichoice", "multiple": false, "text": "Какая анатомическая структура является структурно-функциональной единицей печени?", "images": [], "options": [{"text": "Acinus", "images": []}, {"text": "Segmentum hepatis", "images": []}, {"text": "Nephron", "images": []}, {"text": "Lobulus hepaticus", "images": []}, {"text": "Folliculus", "images": []}, {"text": "Osteon", "images": []}], "rows": [], "correct": [3], "explanation": "Дословно: «Долька печени, lobulus hepatis, является морфофункциональной единицей печени». Nephron — единица почки, osteon — кости, acinus — лёгкого/железы, segmentum hepatis — хирургическая, а не структурно-функциональная единица.", "source": "0115_Лекция 5. Пищеварительная система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "174781d1c936", "type": "multichoice", "multiple": false, "text": "Какая из перечисленных мышц языка является собственной, изменяющей форму языка, но не его положение?", "images": [], "options": [{"text": "Шилоязычная мышца (M. styloglossus)", "images": []}, {"text": "Небно-язычная мышца (M. palatoglossus)", "images": []}, {"text": "Хряще-язычная мышца (M. chondroglossus)", "images": []}, {"text": "Подбородочно-язычная мышца (M. genioglossus)", "images": []}, {"text": "Подъязычно-язычная мышца (M. hyoglossus)", "images": []}, {"text": "Поперечная мышца языка (M. transversus linguae)", "images": []}], "rows": [], "correct": [5], "explanation": "M. transversus linguae входит во внутреннюю (собственную) группу мышц языка: «начинается от перегородки языка и распространяется в стороны… Функция: суживает и удлиняет язык» — то есть меняет форму языка. Все остальные перечисленные (styloglossus, hyoglossus, genioglossus, chondroglossus, palatoglossus) — наружные (скелетные) мышцы, начинающиеся от костей/нёба и меняющие положение языка.", "source": "0064_Анатомия полости рта и зубов.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "0e7d38fe7d1c", "type": "multichoice", "multiple": false, "text": "В какой отдел толстой кишки открывается подвздошная кишка через илеоцекальный клапан?", "images": [], "options": [{"text": "Восходящая ободочная кишка (Colon ascendens)", "images": []}, {"text": "Сигмовидная ободочная кишка (Colon sigmoideum)", "images": []}, {"text": "Прямая кишка (Rectum)", "images": []}, {"text": "Слепая кишка (Caecum)", "images": []}, {"text": "Поперечная ободочная кишка (Colon transversum)", "images": []}, {"text": "Нисходящая ободочная кишка (Colon descendens)", "images": []}], "rows": [], "correct": [3], "explanation": "Подвздошная кишка открывается в слепую кишку через подвздошно-слепокишечный (илеоцекальный) клапан — в источнике разобран «Подвздошно-слепокишечный переход» с уздечкой подвздошно-слепокишечного клапана. Восходящая ободочная кишка начинается уже выше места впадения ileum.", "source": "0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "68d245cc9b1f", "type": "multichoice", "multiple": false, "text": "Как называется вертикальная борозда на верхней губе, идущая от перегородки носа к губному бугорку?", "images": [], "options": [{"text": "Губной валик (Torus labialis)", "images": []}, {"text": "Угол рта (Angulus oris)", "images": []}, {"text": "Уздечка губы (Frenulum labii)", "images": []}, {"text": "Фильтр или губной желобок (Philtrum)", "images": []}, {"text": "Подбородочно-губная борозда (Sulcus mentolabialis)", "images": []}, {"text": "Носогубная борозда (Sulcus nasolabialis)", "images": []}], "rows": [], "correct": [3], "explanation": "«По середине верхней губы от перегородки носа книзу проходит губной желобок» (philtrum), оканчивающийся бугорком верхней губы; на рисунке он обозначен как «1 - губной желобок», отдельно от носогубной (2) и подбородочно-губной (4) борозд.", "source": "0064_Анатомия полости рта и зубов.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "3e70f164bd00", "type": "multichoice", "multiple": false, "text": "В какую часть желудка непосредственно попадает пища из пищевода?", "images": [], "options": [{"text": "Пилорическая часть (Pars pylorica)", "images": []}, {"text": "Кардиальная часть (Pars cardiaca)", "images": []}, {"text": "Тело желудка (Corpus gastricum)", "images": []}, {"text": "Канал привратника (Canalis pyloricus)", "images": []}, {"text": "Привратниковая пещера (Antrum pyloricum)", "images": []}, {"text": "Дно желудка (Fundus gastricus)", "images": []}], "rows": [], "correct": [1], "explanation": "Пищевод впадает в желудок через кардиальное отверстие (ostium cardiacum), прилежащая к нему часть желудка — кардиальная (pars cardiaca); именно туда непосредственно попадает пища. Fundus лежит выше уровня кардии и пищей заполняется не напрямую (там скапливается газ), а пилорическая часть — выход из желудка.", "source": "0115_Лекция 5. Пищеварительная система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "bd05b6dbf0b6", "type": "multichoice", "multiple": false, "text": "Какая структура обеспечивает фиксацию корня зуба в зубной альвеоле (соединение типа гомфоз)?", "images": [], "options": [{"text": "Пульпа зуба (Pulpa dentis)", "images": []}, {"text": "Апикальное отверстие (Foramen apicale)", "images": []}, {"text": "Эмаль (Enamelum)", "images": []}, {"text": "Зубной сосочек (Papilla dentis)", "images": []}, {"text": "Периодонт (Periodontium)", "images": []}, {"text": "Десна (Gingiva)", "images": []}], "rows": [], "correct": [4], "explanation": "«Фиксация зуба осуществляется при помощи периодонта, волокна которого натянуты между цементом и костной альвеолой» — это и есть вколачивание (гомфоз, articulatio dentoalveolaris). Эмаль, пульпа, десна и апикальное отверстие фиксирующей функции не выполняют.", "source": "0064_Анатомия полости рта и зубов.docx.txt", "confidence": "claude-high", "moodle_right": ""}]}, {"cmid": "27937", "folder": "04_dykhatelnaya", "title": "Тестирование по дыхательной системе", "minutes": 10, "group": "Тренировочные", "questions": [{"key": "24308eb1033a", "type": "multichoice", "multiple": false, "text": "Какие бронхи следуют за долевыми бронхами (bronchi lobares)?", "images": [], "options": [{"text": "Дольковые бронхи (Bronchi lobulares)", "images": []}, {"text": "Терминальные бронхиолы (Bronchioli terminales)", "images": []}, {"text": "Сегментарные бронхи (Bronchi segmentales)", "images": []}, {"text": "Главные бронхи (Bronchi principales)", "images": []}, {"text": "Альвеолы (Alveoli)", "images": []}, {"text": "Дыхательные бронхиолы (Bronchioli respiratorii)", "images": []}], "rows": [], "correct": [2], "explanation": "Главные бронхи (1 порядка) делятся на долевые (2 порядка), а те — на сегментарные (3 порядка). В лекции: «Долевые бронхи делятся на сегментарные bronchi segmentales (3 порядка) и внутрисегментарные бронхи».", "source": "0116_Лекция 6. Дыхательная система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "6839426c169c", "type": "multichoice", "multiple": false, "text": "Какие придаточные пазухи носа открываются в верхний носовой ход (meatus nasi superior)?", "images": [], "options": [{"text": "Клиновидная пазуха и задние ячейки решетчатой кости", "images": []}, {"text": "Только верхнечелюстная пазуха", "images": []}, {"text": "Только лобная пазуха", "images": []}, {"text": "Клиновидная пазуха и лобная пазуха", "images": []}, {"text": "Лобная пазуха и передние ячейки решетчатой кости", "images": []}, {"text": "Верхнечелюстная пазуха и средние ячейки решетчатой кости", "images": []}], "rows": [], "correct": [0], "explanation": "Лекция прямо указывает: «В верхний носовой ход открывается клиновидная пазуха, задние и средние ячейки решетчатой пазухи». Лобная и верхнечелюстная пазухи открываются в средний носовой ход, поэтому единственный подходящий вариант — клиновидная пазуха и задние ячейки решетчатой кости.", "source": "0116_Лекция 6. Дыхательная система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "c20f8fb04cbc", "type": "multichoice", "multiple": false, "text": "Какое пространство гортани расположено между складками преддверия и голосовыми складками?", "images": [], "options": [{"text": "Грушевидный карман (Recessus piriformis)", "images": []}, {"text": "Преддверие гортани (Vestibulum laryngis)", "images": []}, {"text": "Вход в гортань (Aditus laryngis)", "images": []}, {"text": "Подголосовая полость (Cavitas infraglottica)", "images": []}, {"text": "Желудочек гортани (Ventriculus laryngis)", "images": []}, {"text": "Трахея (Trachea)", "images": []}], "rows": [], "correct": [4], "explanation": "«Желудочки гортани, ventriculi laryngis, располагаются в виде углублений от преддверных до голосовых складок; между ними самое узкое место гортани». Это и есть средний (промежуточный) отдел полости гортани.", "source": "0116_Лекция 6. Дыхательная система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "c2839b1943ef", "type": "multichoice", "multiple": false, "text": "Какая связка натянута между углом щитовидного хряща и голосовым отростком черпаловидного хряща?", "images": [], "options": [{"text": "Черпалонадгортанная связка", "images": []}, {"text": "Щитоподъязычная связка (Lig. thyrohyoideum)", "images": []}, {"text": "Перстнещитовидная связка (Lig. cricothyroideum)", "images": []}, {"text": "Голосовая связка (Lig. vocale)", "images": []}, {"text": "Преддверная связка (Lig. vestibulare)", "images": []}, {"text": "Перстнечерпаловидная связка (Lig. cricoarytenoideum)", "images": []}], "rows": [], "correct": [3], "explanation": "Дословно из лекции: верхний край эластического конуса образует «парную голосовую связку, lig. vocale, которая натянута между углом щитовидного хряща и голосовым отростком черпаловидного хряща».", "source": "0116_Лекция 6. Дыхательная система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "37bf6c2bcf68", "type": "multichoice", "multiple": false, "text": "Что является структурно-функциональной единицей легкого, включающей дыхательные бронхиолы, альвеолярные ходы и альвеолы?", "images": [], "options": [{"text": "Бронхолегочный сегмент (Segmentum bronchopulmonale)", "images": []}, {"text": "Альвеолярное дерево", "images": []}, {"text": "Долька легкого (Lobulus pulmonis)", "images": []}, {"text": "Бронхиальное дерево (Arbor bronchialis)", "images": []}, {"text": "Терминальная бронхиола", "images": []}, {"text": "Ацинус (Acinus)", "images": []}], "rows": [], "correct": [5], "explanation": "«Функционально-анатомической единицей легкого считается ацинус. Он представляет собой часть альвеолярного дерева, на которую разветвляется одна терминальная бронхиола» — то есть дыхательные бронхиолы, альвеолярные ходы и альвеолы.", "source": "0116_Лекция 6. Дыхательная система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "a27aed0954e7", "type": "multichoice", "multiple": false, "text": "Что следует непосредственно за гортанью (larynx) на уровне VI-VII шейных позвонков?", "images": [], "options": [{"text": "Трахея (Trachea)", "images": []}, {"text": "Главные бронхи (Bronchi principales)", "images": []}, {"text": "Сегментарные бронхи (Bronchi segmentales)", "images": []}, {"text": "Бронхиолы (Bronchioli)", "images": []}, {"text": "Долевые бронхи (Bronchi lobares)", "images": []}, {"text": "Бифуркация (Bifurcatio)", "images": []}], "rows": [], "correct": [0], "explanation": "«Трахея (trachea) начинается от нижнего конца гортани и идет в грудную полость». Гортань расположена на уровне IV-VI шейных позвонков, поэтому на уровне VI-VII шейных позвонков за ней следует трахея.", "source": "0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "5a8dfee6d035", "type": "multichoice", "multiple": false, "text": "На какие структуры разделяется трахея на уровне V грудного позвонка?", "images": [], "options": [{"text": "Сегментарные бронхи (Bronchi segmentales)", "images": []}, {"text": "Бронхиолы (Bronchioli)", "images": []}, {"text": "Альвеолярные ходы (Ductuli alveolares)", "images": []}, {"text": "Главные бронхи (Bronchi principales)", "images": []}, {"text": "Терминальные бронхиолы", "images": []}, {"text": "Долевые бронхи (Bronchi lobares)", "images": []}], "rows": [], "correct": [3], "explanation": "«Трахея... на уровне V-VI грудных позвонков разделяется на правый и левый главные бронхи, образуя бифуркацию (bifurcatio tracheae)». Деление идёт сразу на главные бронхи.", "source": "0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "e5998087f358", "type": "multichoice", "multiple": false, "text": "Куда открывается носослезный канал (ductus nasolacrimalis)?", "images": [], "options": [{"text": "Нижний носовой ход (Meatus nasi inferior)", "images": []}, {"text": "Носоглоточный ход (Meatus nasopharyngeus)", "images": []}, {"text": "Общий носовой ход (Meatus nasi communis)", "images": []}, {"text": "Клиновидно-решетчатое углубление (Recessus sphenoethmoidalis)", "images": []}, {"text": "Средний носовой ход (Meatus nasi medius)", "images": []}, {"text": "Верхний носовой ход (Meatus nasi superior)", "images": []}], "rows": [], "correct": [0], "explanation": "«В нижнем носовом ходе под сводом нижней раковины находится отверстие слезно-носового протока». Это подтверждается и краниологией: canalis nasolacrimalis «открывающийся в нижний носовой ход».", "source": "0116_Лекция 6. Ды ется альвеолярное дерево (ацинус), где происходит газообмен?", "images": [], "options": [{"text": "Альвеолы (Alveoli)", "images": []}, {"text": "Сегментарные бронхи", "images": []}, {"text": "Дыхательные бронхиолы (Bronchioli respiratorii)", "images": []}, {"text": "Терминальные бронхиолы (Bronchioli terminales)", "images": []}, {"text": "Альвеолярные мешочки (Sacculi alveolares)", "images": []}, {"text": "Дольковые бронхи (Bronchi lobulares)", "images": []}], "rows": [], "correct": [2], "explanation": "«Респираторные бронхиолы, альвеолярные ходы и альвеолярные мешочки с альвеолами составляют альвеолярное дерево». Первое звено альвеолярного дерева — именно дыхательные (респираторные) бронхиолы, так как на их стенках уже появляются альвеолы; терминальная бронхиола относится ещё к бронхиальному дереву.", "source": "0116_Лекция 6. Дыхательная система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "8c1552d5b2bb", "type": "multichoice", "multiple": false, "text": "Какие бронхи следуют непосредственно за главными бронхами (bronchi principales)?", "images": [], "options": [{"text": "Терминальные бронхиолы (Bronchioli terminales)", "images": []}, {"text": "Субсегментарные бронхи", "images": []}, {"text": "Долевые бронхи (Bronchi lobares)", "images": []}, {"text": "Дольковые бронхи (Bronchi lobulares)", "images": []}, {"text": "Сегментарные бронхи (Bronchi segmentales)", "images": []}, {"text": "Альвеолярные мешочки (Sacculi alveolares)", "images": []}], "rows": [], "correct": [2], "explanation": "«Главные бронхи (1 порядка) в воротах легкого делятся на долевые бронхи, bronchi lobares. Это бронхи второго порядка».", "source": "0116_Лекция 6. Дыхательная система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "0749da407b6d", "type": "multichoice", "multiple": false, "text": "Какой отдел полости гортани следует за входом в гортань (aditus laryngis) до складок преддверия?", "images": [], "options": [{"text": "Преддверие гортани (Vestibulum laryngis)", "images": []}, {"text": "Голосовая щель (Rima glottidis)", "images": []}, {"text": "Желудочек гортани (Ventriculus laryngis)", "images": []}, {"text": "Промежуточная полость", "images": []}, {"text": "Подголосовая полость (Cavitas infraglottica)", "images": []}, {"text": "Трахея (Trachea)", "images": []}], "rows": [], "correct": [0], "explanation": "«Преддверие гортани, vestibulum laryngis, простирается от входа в гортань до преддверных складок, в состав которых входят преддверные связки».", "source": "0116_Лекция 6. Дыхательная система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "34ce0a8158c6", "type": "multichoice", "multiple": false, "text": "Что является конечным разветвлением бронхиального дерева (воздухопроводящих путей), переходящим в альвеолярное дерево?", "images": [], "options": [{"text": "Терминальные бронхиолы (Bronchioli terminales)", "images": []}, {"text": "Дыхательные бронхиолы (Bronchioli respiratorii)", "images": []}, {"text": "Сегментарные бронхи (Bronchi segmentales)", "images": []}, {"text": "Альвеолярные ходы (Ductuli alveolares)", "images": []}, {"text": "Дольковые бронхи (Bronchi lobulares)", "images": []}, {"text": "Главные бронхи", "images": []}], "rows": [], "correct": [0], "explanation": "«Бронхиальное дерево... образовано ветвлением бронхов от главного бронха до терминальных бронхиол (XVI-XVIII порядков)», а далее «каждая терминальная бронхиола делится на дыхательные бронхиолы» — то есть переходит в альвеолярное дерево.", "source": "0116_Лекция 6. Дыхательная система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "d055da99e8bf", "type": "multichoice", "multiple": false, "text": "Как называется вдавление на переднем крае левого легкого, в котором располагается сердце?", "images": [], "options": [{"text": "Аортальное вдавление (Impressio aortica)", "images": []}, {"text": "Диафрагмальная поверхность (Facies diaphragmatica)", "images": []}, {"text": "Пищеводное вдавление (Impressio oesophageale)", "images": []}, {"text": "Реберная поверхность (Facies costalis)", "images": []}, {"text": "Сердечная вырезка (Incisura cardiaca)", "images": []}, {"text": "Ворота легкого (Hilum pulmonis)", "images": []}], "rows": [], "correct": [4], "explanation": "«Спереди у левого легкого имеется сердечная вырезка, в которой помещается часть сердца» (incisura cardiaca на переднем крае левого легкого).", "source": "0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "5170e7953cd5", "type": "multichoice", "multiple": false, "text": "В какую часть глотки переходит ротовая часть глотки (pars oralis pharyngis) каудально?", "images": [], "options": [{"text": "Pars nasalis pharyngis", "images": []}, {"text": "Trachea", "images": []}, {"text": "Oesophagus", "images": []}, {"text": "Pars laryngea pharyngis", "images": []}, {"text": "Fauces", "images": []}, {"text": "Vestibulum laryngis", "images": []}], "rows": [], "correct": [3], "explanation": "«В глотке различают 3 части: носовую часть глотки (pars nasalis pharyngis), ротовую часть глотки (pars oralis pharyngis) и гортанную часть (pars laryngea pharyngis)» — сверху вниз, значит каудально ротовая часть переходит в гортанную.", "source": "0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "85e05d4e5774", "type": "multichoice", "multiple": false, "text": "Какой отдел полости гортани следует за голосовой щелью (rima glottidis) и простирается до начала трахеи?", "images": [], "options": [{"text": "Желудочек гортани (Ventriculus laryngis)", "images": []}, {"text": "Подголосовая полость (Cavitas infraglottica)", "images": []}, {"text": "Главные бронхи (Bronchi principales)", "images": []}, {"text": "Вход в гортань (Aditus laryngis)", "images": []}, {"text": "Промежуточная полость", "images": []}, {"text": "Преддверие гортани (Vestibulum laryngis)", "images": []}], "rows": [], "correct": [1], "explanation": "«Подголосовая полость, cavitas infraglottica, простирается от голосовых складок до начала трахеи».", "source": "0116_Лекция 6. Дыхательная система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "cdbba5de3a49", "type": "multichoice", "multiple": false, "text": "Какой отдел полости гортани располагается между складками преддверия (plicae vestibulares) и голосовыми складками (plicae vocales)?", "images": [], "options": [{"text": "Вход в гортань (Aditus laryngis)", "images": []}, {"text": "Желудочек гортани (Ventriculus laryngis)", "images": []}, {"text": "Голосовая щель (Rima glottidis)", "images": []}, {"text": "Подголосовая полость (Cavitas infraglottica)", "images": []}, {"text": "Преддверие гортани (Vestibulum laryngis)", "images": []}, {"text": "Грушевидный карман (Recessus piriformis)", "images": []}], "rows": [], "correct": [1], "explanation": "Тот же факт, что и в вопросе c20f8fb04cbc: «Желудочки гортани, ventriculi laryngis, располагаются в виде углублений от преддверных до голосовых складок».", "source": "0116_Лекция 6. Дыхательная система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "5e1e74593255", "type": "multichoice", "multiple": false, "text": "Что следует непосредственно за ноздрями (nares) и составляет начальный отдел полости носа?", "images": [], "options": [{"text": "Носоглотка (Pars nasalis pharyngis)", "images": []}, {"text": "Хоаны (Choanae)", "images": []}, {"text": "Нижний носовой ход (Meatus nasi inferior)", "images": []}, {"text": "Преддверие носа (Vestibulum nasi)", "images": []}, {"text": "Обонятельная область (Regio olfactoria)", "images": []}, {"text": "Дыхательная область (Regio respiratoria)", "images": []}], "rows": [], "correct": [3], "explanation": "«Часть полости носа, примыкающая к ноздрям, называется преддверием носа, vestibulum nasi». Это начальный отдел полости носа, выстланный кожей с волосками.", "source": "0116_Лекция 6. Дыхательная система.pdf.txt", "confidence": "claude-high", "moodle_rig ская анатомия", "confidence": "claude-medium", "moodle_right": ""}, {"key": "36181d5eb4b3", "type": "multichoice", "multiple": false, "text": "Где собираются сперматозоиды после прохождения прямых семенных канальцев, находясь в толще средостения яичка?", "images": [], "options": [{"text": "В сети яичка (Rete testis)", "images": []}, {"text": "В выносящих канальцах (Ductuli efferentes)", "images": []}, {"text": "В семенных пузырьках (Vesiculae seminales)", "images": []}, {"text": "В придатке яичка (Epididymis)", "images": []}, {"text": "В семявыносящем протоке (Ductus deferens)", "images": []}, {"text": "В извитых канальцах (Tubuli seminiferi contorti)", "images": []}], "rows": [], "correct": [0], "explanation": "«Последние переходят в прямые семенные канальцы, tubuli seminiferi recti, образующие сеть яичка, rete testis, в средостении». То есть именно в толще mediastinum testis находится rete testis.", "source": "0118_Лекция 8. Половая система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "32222b1785b8", "type": "multichoice", "multiple": false, "text": "Куда поступает моча из дистальных извитых канальцев нескольких нефронов?", "images": [], "options": [{"text": "В малую почечную чашку (Calyx renalis minor)", "images": []}, {"text": "В петлю Генле (Ansa nephroni)", "images": []}, {"text": "В проксимальный извитой каналец (Tubulus contortus proximalis)", "images": []}, {"text": "В почечный клубочек (Glomerulus)", "images": []}, {"text": "В собирательную трубочку (Tubulus renalis colligens)", "images": []}, {"text": "В почечную лоханку (Pelvis renalis)", "images": []}], "rows": [], "correct": [4], "explanation": "«Дистальная часть канальца нефрона... впадает в собирательную почечную трубочку»; в собирательные канальцы впадают дистальные отделы нескольких нефронов, и далее они открываются на сосочках пирамид.", "source": "0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "dd72268f8b68", "type": "multichoice", "multiple": false, "text": "Через какое отверстие сперма (эякулят) покидает мужской организм?", "images": [], "options": [{"text": "Внутреннее отверстие уретры (Ostium urethrae internum)", "images": []}, {"text": "Наружное отверстие мочеиспускательного канала (Ostium urethrae externum)", "images": []}, {"text": "Венец головки (Corona glandis)", "images": []}, {"text": "Отверстие влагалищного отростка", "images": []}, {"text": "Отверстие семявыбрасывающего протока", "images": []}, {"text": "Отверстие крайней плоти", "images": []}], "rows": [], "correct": [1], "explanation": "Мужская уретра «служит для выведения мочи и выбрасывания спермы в момент эякуляции» и «открывается на головке полового члена наружным отверстием мочеиспускательного канала, ostium urethrae externum» — это и есть конечное отверстие для эякулята.", "source": "0118_Лекция 8. Половая система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "f2f7a6d62020", "type": "multichoice", "multiple": false, "text": "Какая часть маточной трубы является самой широкой и открывается в брюшную полость своими бахромками?", "images": [], "options": [{"text": "Яичниковая бахромка (Fimbria ovarica)", "images": []}, {"text": "Ампула и воронка (Ampulla et Infundibulum tubae)", "images": []}, {"text": "Перешеек (Isthmus tubae)", "images": []}, {"text": "Маточная часть (Pars uterina)", "images": []}, {"text": "Брыжейка трубы (Mesosalpinx)", "images": []}, {"text": "Продольный проток (Ductus longitudinalis)", "images": []}], "rows": [], "correct": [1], "explanation": "«ампулу (ampulla tubae uterinae) — расширенную часть; воронку (infundibulum tubae uterinae), открывающуюся брюшным отверстием, окруженным многочисленными бахромками». Ампула — самая широкая часть, воронка заканчивается бахромками и открывается в полость брюшины, поэтому верен комбинированный вариант.", "source": "0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "c8a1b53f2cd2", "type": "multichoice", "multiple": false, "text": "Где располагается яичник по отношению к брюшине?", "images": [], "options": [{"text": "Интраперитонеально (покрыт со всех сторон)", "images": []}, {"text": "Субперитонеально", "images": []}, {"text": "Интрамурально", "images": []}, {"text": "Экстраперитонеально (покрыт с одной стороны)", "images": []}, {"text": "Ретроперитонеально (позади брюшины)", "images": []}, {"text": "Мезоперитонеально (имеет брыжейку, но поверхность не покрыта брюшиной)", "images": []}], "rows": [], "correct": [5], "explanation": "Дословно: «Яичник — единственный орган, лежащий в полости брюшины не покрытый брюшиной, но имеющий брыжейку, mesovarium». Формулировка варианта 5 полностью совпадает с лекцией.", "source": "0118_Лекция 8. Половая система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "29e2b13698a5", "type": "multichoice", "multiple": false, "text": "Какая доля предстательной железы располагается между двумя семявыбрасывающими протоками и задней поверхностью уретры (часто гипертрофируется в пожилом возрасте)?", "images": [], "options": [{"text": "Боковая доля", "images": []}, {"text": "Передняя доля", "images": []}, {"text": "Левая доля (Lobus sinister)", "images": []}, {"text": "Средняя доля (Lobus medius)", "images": []}, {"text": "Правая доля (Lobus dexter)", "images": []}, {"text": "Перешеек (Isthmus prostatae)", "images": []}], "rows": [], "correct": [3], "explanation": "Лекция описывает простату как две доли и перешеек, не упоминая среднюю долю. Однако по классической анатомии именно средняя доля (lobus medius), лежащая между семявыбрасывающими протоками и задней стенкой уретры, гипертрофируется в пожилом возрасте и вызывает задержку мочи — что и описано в вопросе.", "source": "классическая анатомия (в лекции 0118 указаны только две доли и перешеек)", "confidence": "claude-medium", "moodle_right": ""}, {"key": "d4e058c47fd6", "type": "multichoice", "multiple": false, "text": "Какая часть мужского мочеиспускательного канала следует непосредственно за предстательной частью (pars prostatica)?", "images": [], "options": [{"text": "Губчатая часть (Pars spongiosa)", "images": []}, {"text": "Простатическая маточка (Utriculus prostaticus)", "images": []}, {"text": "Наружное отверстие уретры (Ostium urethrae externum)", "images": []}, {"text": "Ладьевидная ямка (Fossa navicularis)", "images": []}, {"text": "Перепончатая часть (Pars membranacea)", "images": []}, {"text": "Внутреннее отверстие уретры (Ostium urethrae internum)", "images": []}], "rows": [], "correct": [4], "explanation": "Порядок частей уретры в лекции: «1) Простатическая часть, pars prostatica... 2) перепончатая часть, pars membranacea, проходит через мочеполовую диафрагму, длиной 1,5 см; 3) губчатая часть, pars spongiosa».", "source": "0117_Лекция 7 Мочевая система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "067973451726", "type": "multichoice", "multiple": false, "text": "Какие образования составляют основу полового члена?", "images": [], "options": [{"text": "Только губчатое тело (corpus spongiosum penis)", "images": []}, {"text": "Только мочеиспускательный канал", "images": []}, {"text": "Два губчатых и одно пещеристое тело", "images": []}, {"text": "Сеть выносящих канальцев", "images": []}, {"text": "Только одно пещеристое тело", "images": []}, {"text": "Два пещеристых тела и одно губчатое тело полового члена", "images": []}], "rows": [], "correct": [5], "explanation": "«Половой член состоит из двух пещеристых тел, corpora cavernosa penis, и одного губчатого тела, corpus spongiosum penis».", "source": "0118_Лекция 8. Половая система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "e48d070a2dd2", "type": "multichoice", "multiple": false, "text": "Как называется сосудистая сеть, образующаяся при распаде приносящей артериолы внутри почечного тельца?", "images": [], "options": [{"text": "Чудесная венозная сеть (Rete mirabile venosum)", "images": []}, {"text": "Вторичная капиллярная сеть", "images": []}, {"text": "Прямые сосуды (Vasa recta)", "images": []}, {"text": "Перитубулярные капилляры", "images": []}, {"text": "Сосудистый клубочек (Glomerulus)", "images": []}, {"text": "Междольковая артерия", "images": []}], "rows": [], "correct": [4], "explanation": "«От каждой междольковой артерии отходит приносящая клубочковая артериола, которая образует капиллярный клубочек... Такое деление сосудов, когда на артерии вновь образуется артерия, называется чудесной артериальной сетью (rete mirabile)». Сама сеть внутри почечного тельца — сосудистый клубочек, glomerulus; вариант «чудесная ВЕНОЗНАЯ сеть» неверен, так как сеть артериальная.", "source": "0117_Лекция 7 Мочевая система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "92f772faa19a", "type": "multichoice", "multiple": false, "text": "Какая часть мужской уретры является наиболее узкой и фиксированной (помимо наружного отверстия)?", "images": [], "options": [{"text": "Предстательная часть (Pars prostatica)", "images": []}, {"text": "Перепончатая часть (Pars membranacea)", "images": []}, {"text": "Внутреннее отверстие (Ostium internum)", "images": []}, {"text": "Губчатая часть (Pars spongiosa)", "images": []}, {"text": "Ладьевидная ямка (Fossa navicularis)", "images": []}, {"text": "Луковица уретры", "images": []}], "rows": [], "correct": [1], "explanation": "Лекция перечисляет только три расширения уретры (простатическая часть, луковица, ладьевидная ямка), а сужения не называет. По классической анатомии перепончатая часть — самая короткая, узкая и фиксированная (проходит через мочеполовую диафрагму), поэтому она наиболее уязвима при катетеризации.", "source": "классическая анатомия (0117 перечисляет 3 сужения без их названий)", "confidence": "claude-medium", "moodle_right": ""}, {"key": "8fae77573a7b", "type": "multichoice", "multiple": false, "text": "Какой проток является непосредственным продолжением протока придатка яичка и транспортирует сперму в
