Сердечнососудистая система.docx.txt:513 — «добавочная полунепарная (v. hemiazygos accessoria) формируется из 6-7 левых верхних задних межреберных вен, направляется сверху вниз и впадает в полунепарную вену или... в непарную»", "confidence": "claude-high", "moodle_right": ""}, {"key": "62ab89372f3c", "type": "multichoice", "multiple": false, "text": "Какая магистральная ветвь общей подвздошной артерии спускается в полость малого таза и обеспечивает кровоснабжение его стенок и органов?", "images": [], "options": [{"text": "Arteria iliaca interna", "images": []}, {"text": "Arteria iliaca externa", "images": []}, {"text": "Arteria femoralis", "images": []}, {"text": "Arteria obturatoria", "images": []}], "rows": [], "correct": [0], "explanation": "Внутренняя подвздошная артерия, a. iliaca interna, спускается в полость малого таза по его боковой стенке и своими париетальными и висцеральными ветвями кровоснабжает стенки и органы таза. A. iliaca externa уходит на нижнюю конечность.", "source": "0149_Лекция 4.3. Артерии большого круга кровообращения.pdf.txt:250-275 — «Внутренняя подвздошная артерия, a. iliaca interna, спускается по... Таким образом, a. iliaca interna снабжает кровью...»; 0080_Сердечнососудистая система.docx.txt:360", "confidence": "claude-high", "moodle_right": ""}, {"key": "37a3e2b1b976", "type": "multichoice", "multiple": false, "text": "Как называется крупная парная артерия, которая образуется при бифуркации брюшной аорты на уровне четвертого поясничного позвонка и идет до крестцово-подвздошного сустава?", "images": [], "options": [{"text": "Arteria iliaca externa", "images": []}, {"text": "Arteria iliaca interna", "images": []}, {"text": "Arteria iliaca communis", "images": []}, {"text": "Arteria sacralis mediana", "images": []}], "rows": [], "correct": [2], "explanation": "Общая подвздошная артерия, a. iliaca communis, — парная конечная ветвь брюшной аорты: начинается на уровне IV поясничного позвонка (бифуркация аорты) и идет до передней поверхности крестцово-подвздошного сустава, где делится на наружную и внутреннюю.", "source": "скриншот разбора Moodle (part7 №110 — тот же вопрос, ответ Arteria iliaca communis) + 0080_Сердечнососудистая система.docx.txt:355", "confidence": "claude-high", "moodle_right": ""}, {"key": "b89581f1ca69", "type": "multichoice", "multiple": false, "text": "Как называется вена нижней конечности, которая располагается на бедре?", "images": [], "options": [{"text": "Vena poplitea", "images": []}, {"text": "Vena saphena magna", "images": []}, {"text": "Vena iliaca interna", "images": []}, {"text": "Vena femoralis", "images": []}], "rows": [], "correct": [3], "explanation": "Бедренная вена, v. femoralis, — магистральная вена, расположенная именно на бедре: продолжение подколенной вены в приводящем канале, переходит в наружную подвздошную вену в сосудистой лакуне. V. saphena magna идет от стопы через всю конечность и впадает в бедренную, а v. poplitea лежит в подколенной ямке.", "source": "0080_Сердечнососудистая система.docx.txt:584 — «Бедренная вена (v. femoralis) одиночная, является продолжением подколенной вены, проходит в приводящем канале... переходя в наружную подвздошную вену»", "confidence": "claude-high", "moodle_right": ""}, {"key": "c1aee4afa4d7", "type": "multichoice", "multiple": false, "text": "Как называется крупная артерия, которая залегает в подколенной ямке и является непосредственным продолжением бедренной артерии?", "images": [], "options": [{"text": "Arteria tibialis posterior", "images": []}, {"text": "Arteria tibialis anterior", "images": []}, {"text": "Arteria poplitea", "images": []}, {"text": "Arteria fibularis", "images": []}], "rows": [], "correct": [2], "explanation": "Подколенная артерия, a. poplitea, — непосредственное продолжение бедренной артерии после выхода из приводящего канала; залегает глубоко в подколенной ямке и делится на переднюю и заднюю большеберцовые артерии.", "source": "0080_Сердечнососудистая система.docx.txt:445 — «Подколенная артерия (a. poplitea) является непосредственным продолжением бедренной артерии. Расположена в подколенной ямке»; 0149_Лекция 4.3...pdf.txt:368-377", "confidence": "claude-high", "moodle_right": ""}, {"key": "cee03b1ea0ec", "type": "multichoice", "multiple": false, "text": "Как называется постоянная косая подкожная вена, расположенная в передней локтевой области, которая соединяет между собой две главные поверхностные вены руки и часто используется для внутривенных инъекций?", "images": [], "options": [{"text": "Vena cephalica", "images": []}, {"text": "Vena mediana antebrachii", "images": []}, {"text": "Vena mediana cubiti", "images": []}, {"text": "Vena basilica", "images": []}], "rows": [], "correct": [2], "explanation": "", "source": "перенесено из другого теста (тот же вопрос)", "confidence": "moodle", "moodle_right": ""}, {"key": "02ae3de5d520", "type": "multichoice", "multiple": false, "text": "В какую камеру сердца впадают верхняя и нижняя полые вены, а также венечный синус?", "images": [], "options": [{"text": "Atrium sinistrum", "images": []}, {"text": "Ventriculus sinister", "images": []}, {"text": "Atrium dextrum", "images": []}, {"text": "Ventriculus dexter", "images": []}], "rows": [], "correct": [2], "explanation": "", "source": "скриншот разбора Moodle (photo_5330347997285522219)", "confidence": "photo", "moodle_right": ""}, {"key": "542c91957121", "type": "multichoice", "multiple": false, "text": "Какой крупный парный лимфатический ствол формируется из выносящих сосудов лимфатических узлов таза и поясничной области и принимает непосредственное участие в образовании грудного протока?", "images": [], "options": [{"text": "Truncus intestinalis", "images": []}, {"text": "Truncus subclavius", "images": []}, {"text": "Truncus lumbalis", "images": []}, {"text": "Truncus jugularis", "images": []}], "rows": [], "correct": [2], "explanation": "Поясничные стволы, trunci lumbales dexter et sinister, — парные стволы из выносящих сосудов поясничных и подвздошных (тазовых) лимфа <script>
"use strict";
const LS = "dentistry_trainer_v1";
const RU = "абвгдежзиклмнопрстуфхцшщэюя".split("");

// ---------- хранилище: лучшие результаты и ключи, внесённые вручную ----------
function store() {
  try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; }
}
function save(s) {
  try { localStorage.setItem(LS, JSON.stringify(s)); } catch (e) {}
}
function best(cmid) { return (store().best || {})[cmid] || null; }
function setBest(cmid, rec) {
  const s = store(); s.best = s.best || {};
  const old = s.best[cmid];
  if (!old || rec.pct > old.pct) { s.best[cmid] = rec; save(s); return true; }
  return false;
}
function userKeys() { return store().keys || {}; }
function setUserKey(qkey, correct) {
  const s = store(); s.keys = s.keys || {};
  if (correct === null) delete s.keys[qkey]; else s.keys[qkey] = correct;
  save(s);
}
// Откуда взялся правильный ответ — человеческим языком. Ответы Moodle точны,
// разметка Claude по учебнику может расходиться с ключом преподавателя.
function trust(conf) {
  if (conf === "moodle") return { t: "✔ Ответ из Moodle (ключ преподавателя)", cls: "ok" };
  if (conf === "moodle-doubt") return { t: "✔ Ключ преподавателя · есть примечание ниже", cls: "" };
  if (conf === "moodle-wrong") return { t: "⚠ Ключ преподавателя расходится с анатомией — читайте примечание", cls: "warn" };
  if (conf === "photo") return { t: "✔ Ответ из разбора Moodle (скриншот)", cls: "ok" };
  if (conf === "claude-high") return { t: "Ответ Claude, подтверждён материалами курса", cls: "" };
  if (conf === "claude-medium") return { t: "⚠ Ответ Claude по классической анатомии — в материалах курса прямого подтверждения нет", cls: "warn" };
  if (conf === "claude-low") return { t: "⚠ Ответ Claude, есть сомнение — обязательно сверьте с лекцией", cls: "warn" };
  if (conf === "user") return { t: "Ответ отмечен вами", cls: "" };
  if (conf === "low") return { t: "⚠ ответ требует проверки по учебнику", cls: "warn" };
  return null;
}

// Правильные ответы вопроса: из ключа проекта (answers.json) или внесённые женой в браузере.
function keyOf(q) {
  const u = userKeys()[q.key];
  if (u) return { correct: u, explanation: q.explanation || "", source: q.source || "", confidence: "user" };
  if (q.correct != null) return { correct: q.correct, explanation: q.explanation || "", source: q.source || "", confidence: q.confidence || "" };
  return null;
}

// ---------- утилиты ----------
const el = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
// Node.append с несколькими аргументами поддерживается не всюду на мобильных,
// а строки он принимает иначе, чем appendChild. Этот помощник работает везде.
function add(parent) {
  for (let i = 1; i < arguments.length; i++) {
    const x = arguments[i];
    if (x == null) continue;
    parent.appendChild(typeof x === "string" ? document.createTextNode(x) : x);
  }
  return parent;
}
const app = document.getElementById("app");
function clear() { app.textContent = ""; }
function letter(i) { return RU[i] ? RU[i] + ")" : (i + 1) + ")"; }
function mmss(sec) {
  const m = Math.floor(Math.abs(sec) / 60), s = Math.abs(sec) % 60;
  return (sec < 0 ? "-" : "") + m + ":" + String(s).padStart(2, "0");
}
function shuffle(a) { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
function asSet(c) { return new Set(Array.isArray(c) ? c : [c]); }
function sameSet(a, b) { if (a.size !== b.size) return false; for (const x of a) if (!b.has(x)) return false; return true; }

// ---------- экраны со списками тестов ----------
// Главный экран — ТОЛЬКО итоговые: именно эти вопросы будут на экзамене.
// Тренировочные вынесены на отдельную страницу (просьба Нинель, 03.10.2026).

// Карточка одного теста: название, счётчики, кнопки «Учить» и «Экзамен»
function testCard(t) {
  const c = el("div", "card test-card");
  add(c, el("h3", null, t.title));
  const m = el("div", "meta");
  const nk = t.questions.filter(function (q) { return keyOf(q); }).length;
  add(m, el("span", null, t.questions.length ? t.questions.length + " вопр." : "вопросы ещё не собраны"));
  if (t.questions.length && nk < t.questions.length) {
    add(m, el("span", null, "с ответом: " + nk));
  }
  add(m, el("span", null, t.minutes + " мин."));
  const b = best(t.cmid);
  if (b) add(m, el("span", null, "лучший: " + b.pct + "%"));
  add(c, m);
  const row = el("div", "row");
  const learn = el("button", "primary", "Учить");
  const exam = el("button", null, "Экзамен");
  if (!t.questions.length) { learn.disabled = exam.disabled = true; }
  learn.onclick = function () { screenQuiz(t, "learn"); };
  exam.onclick = function () { screenQuiz(t, "exam"); };
  add(row, learn, exam);
  add(c, row);
  return c;
}

function grid(list) {
  const g = el("div", "grid");
  list.forEach(function (t) { add(g, testCard(t)); });
  return g;
}

// Главный экран: итоговые тесты
function screenHome() {

  const tests = window.TESTS || [];
  if (!tests.length) {
    add(app, el("p", "empty", "Нет данных. Запустите: python tools/build_trainer.py"));
    return;
  }
  const finals = tests.filter(function (t) { return t.group === "Итоговые"; });
  const practice = tests.filter(function (t) { return t.group === "Тренировочные"; });
  const n = finals.reduce(function (s, t) { return s + t.questions.length; }, 0);
  const nk = finals.reduce(function (s, t) {
    return s + t.questions.filter(function (q) { return keyOf(q); }).length; }, 0);

  const sum = el("div", "card");
  add(sum, el("h2", null, "Итоговые тесты"));
  add(sum, el("p", "empty", "Эти вопросы будут на экзамене."));
  const sumRow = el("div", "row");
  add(sumRow,
    el("span", "pill", "вопросов: " + n),
    el("span", "pill " + (nk === n ? "ok" : "warn"), "с правильным ответом: " + nk),
    el("span", "pill", "тестов: " + finals.length));
  add(sum, sumRow);
  add(app, sum);

  add(app, grid(finals));

  // Переход к тренировочным — отдельной карточкой, чтобы не путались с экзаменационными
  if (practice.length) {
    const pn = practice.reduce(function (s, t) { return s + t.questions.length; }, 0);
    const c = el("div", "card");
    add(c, el("h3", null, "Тренировочные тесты"));
    add(c, el("p", "empty",
      "Для самопроверки. На экзамене этих вопросов не будет — " +
      practice.length + " тестов, " + pn + " вопросов."));
    const b = el("button", null, "Открыть тренировочные");
    b.onclick = screenPractice;
    const r = el("div", "row");
    add(r, b);
    add(c, r);
    add(app, c);
  }

  homeFooter();
}

    "«Лучший» на карточке — ваш собственный результат на этом устройстве, у каждого он свой.";
  // Сброс результатов: нужен, если тест прогоняли для проверки и в «лучшем» осталcя мусор.

    reset.onclick = function () {
      if (!confirm("Удалить сохранённые результаты прохождений? Вопросы и ответы останутся.")) return;
      const st2 = store();
      delete st2.best;
      save(st2);
      screenHome();
    };

    r.style.marginTop = "10px";
    add(r, reset);
    add(hint, r);
  }
  add(app, hint);

  // Подсказка про офлайн — только в браузере по ссылке и пока не установлено на «Домой».
  const installed = window.matchMedia && window.matchMedia("(display-mode: standalone)").matches
                    || window.navigator.standalone === true;
  if (location.protocol.indexOf("http") === 0 && !installed) {
    const off = el("div", "setkey");
    off.innerHTML = "<b>Чтобы работало без интернета.</b> " +
      "На iPhone: кнопка «Поделиться» внизу Safari → <b>«На экран «Домой»</b> → «Добавить». " +
      "На Android: меню браузера <b>⋮ → «Установить приложение»</b>. " +
      "После этого тренажёр открывается с экрана телефона и работает офлайн — " +
      "вопросы и ответы хранятся прямо в нём.";
    add(app, off);
  }
}

// ---------- экран прохождения ----------
function screenQuiz(test, mode, subset) {
  const order = subset || shuffle(test.questions.map((_, i) => i));
  const st = { test, mode, order, i: 0, picked: new Map(), checked: new Set(), t0: Date.now(),
               left: test.minutes * 60, timer: null };
  if (mode === "exam") {
    st.timer = setInterval(() => {
      st.left--;
      const tv = document.getElementById("timer");
      if (tv) { tv.textContent = mmss(st.left); tv.classList.toggle("low", st.left <= 60); }
      if (st.left <= 0) { clearInterval(st.timer); st.timer = null; finish(st); }
    }, 1000);
  }
  renderQ(st);
}

function stop(st) { if (st.timer) { clearInterval(st.timer); st.timer = null; } }

function renderQ(st) {
  clear();
  const q = st.test.questions[st.order[st.i]];
  const k = keyOf(q);
  const shown = st.checked.has(q.key) && st.mode === "learn";

  const bar = el("div", "bar");
  const left = el("div", "row");
  const back = el("button", "sm", "← К тестам");
  back.onclick = () => { stop(st); screenHome(); };
  add(left, back, el("span", "pill", st.mode === "learn" ? "Учить" : "Экзамен"));
  add(bar, left);
  const right = el("div", "row");
  add(right, el("span", null, (st.i + 1) + " / " + st.order.length));
  if (st.mode === "exam") { const t = el("span", "timer", mmss(st.left)); t.id = "timer"; add(right, t); }
  add(bar, right);
  add(app, bar);

  const pr = el("div", "progress"); const fill = el("i");
  fill.style.width = ((st.i) / st.order.length * 100) + "%"; add(pr, fill); add(app, pr);

  const c = el("div", "card");
  add(c, el("div", "qnum", "Вопрос " + (st.i + 1) + (q.multiple ? " · выберите все верные" : "")));
  add(c, el("p", "qtext", q.text));
  for (const src of q.images || []) { const im = el("img", "qimg"); im.src = src.startsWith("http") ? src : ""; im.alt = ""; add(c, im); }

  const pick = st.picked.get(q.key) || new Set();
  q.options.forEach((o, oi) => {
    const b = el("button", "opt");
    add(b, el("span", "l", letter(oi)));
    const t = el("span", "t", o.text);
    for (const src of o.images || []) { const im = el("img", "qimg"); im.src = src.startsWith("http") ? src : ""; add(t, im); }
    add(b, t);
    if (pick.has(oi)) b.classList.add("chosen");
    if (shown && k) {
      const right = asSet(k.correct).has(oi);
      if (right) { b.classList.add("right"); add(b, el("span", "mark", "✅")); }
      else if (pick.has(oi)) { b.classList.add("wrong"); add(b, el("span", "mark", "❌")); }
    }
    b.onclick = () => {
      if (shown) return;
      const s = st.picked.get(q.key) || new Set();
      if (q.multiple) { s.has(oi) ? s.delete(oi) : s.add(oi); }
      else { s.clear(); s.add(oi); }
      st.picked.set(q.key, s);
      // «Учить»: одиночный выбор проверяется сразу, как только нажала вариант
      if (st.mode === "learn" && !q.multiple && k) st.checked.add(q.key);
      renderQ(st);
    };
    add(c, b);
  });

  // Пояснение — только после проверки в режиме «Учить»
  if (shown && k) {
    const n = el("div", "note");
    const ok = sameSet(asSet(k.correct), pick);
    const h = el("div", null, (ok ? "✅ Верно. " : "❌ Неверно. ") + "Правильный ответ: " +
      [...asSet(k.correct)].sort((a, b) => a - b).map(i => letter(i) + " " + q.options[i].text).join("; "));
    add(n, h);
    if (k.explanation) add(n, el("div", null, k.explanation));
    if (k.source) add(n, el("span", "src", "Источник: " + k.source));
    const tr = trust(k.confidence);
    if (tr) { const s = el("span", "src " + tr.cls, tr.t); add(n, s); }
    add(c, n);
  }
  // Ключа нет — предлагаем отметить правильный вариант
  if (st.mode === "learn" && !k) {
    const n = el("div", "note nokey");
    add(n, el("div", null, "Правильный ответ для этого вопроса пока не отмечен."));
    if (pick.size) {
      const b = el("button", "sm", "Это правильный ответ (" + [...pick].sort().map(letter).join(" ") + ")");
      b.onclick = () => { setUserKey(q.key, [...pick]); st.checked.add(q.key); renderQ(st); };
      add(n, b);
    } else {
      add(n, el("span", "src", "Выберите вариант, который считаете верным, и нажмите «Это правильный ответ»."));
    }
    add(c, n);
  }
  add(app, c);

  const nav = el("div", "nav");
  const prev = el("button", null, "← Назад");
  prev.disabled = st.i === 0;
  prev.onclick = () => { st.i--; renderQ(st); };
  const rightNav = el("div", "row");
  if (st.mode === "learn" && q.multiple && k && !shown) {
    const ch = el("button", "primary", "Проверить");
    ch.disabled = !pick.size;
    ch.onclick = () => { st.checked.add(q.key); renderQ(st); };
    add(rightNav, ch);
  }
  const next = el("button", st.i === st.order.length - 1 ? "primary" : null,
                  st.i === st.order.length - 1 ? "Завершить и посмотреть разбор" : "Далее →");
  next.onclick = () => {
    if (st.i === st.order.length - 1) { stop(st); finish(st); }
    else { st.i++; renderQ(st); }
  };
  add(rightNav, next);
  add(nav, prev, rightNav);
  add(app, nav);
}

// ---------- разбор после теста ----------
function finish(st) {
  stop(st);
  const res = st.order.map(idx => {
    const q = st.test.questions[idx];
    const k = keyOf(q);
    const pick = st.picked.get(q.key) || new Set();
    const graded = !!k;
    const ok = graded && sameSet(asSet(k.correct), pick);
    return { q, k, pick, graded, ok };
  });
  const graded = res.filter(r => r.graded);
  const nOk = graded.filter(r => r.ok).length;
  const pct = graded.length ? Math.round(nOk / graded.length * 100) : 0;
  const secs = Math.round((Date.now() - st.t0) / 1000);
  const isBest = graded.length ? setBest(st.test.cmid, { pct, ok: nOk, of: graded.length, secs, at: Date.now() }) : false;
  screenReview(st, res, { nOk, pct, secs, graded: graded.length, isBest });
}

function screenReview(st, res, sc) {
  clear();
  const bar = el("div", "bar");
  const back = el("button", "sm", "← К тестам");
  back.onclick = screenHome;
  add(bar, back, el("span", "pill", st.test.title));
  add(app, bar);

  const head = el("div", "card");
  const score = el("div", "score");
  add(score, 
    document.createTextNode(sc.graded ? sc.nOk + " / " + sc.graded : "—"),
    el("small", null, sc.graded ? "  · " + sc.pct + "%" : " нет отмеченных правильных ответов"));
  add(head, score);
  const m = el("div", "meta");
  add(m, el("span", null, "время: " + mmss(sc.secs)));
  add(m, el("span", null, "вопросов: " + res.length));
  const ungraded = res.length - sc.graded;
  if (ungraded) add(m, el("span", null, "без ключа: " + ungraded));
  const b = best(st.test.cmid);
  if (b) add(m, el("span", null, "лучший результат: " + b.pct + "%"));
  if (sc.isBest) add(m, el("span", null, "🏅 новый лучший результат"));
  add(head, m);

  const tools = el("div", "row noprint");
  const onlyBad = el("label", "chk");
  const cb = el("input"); cb.type = "checkbox";
  add(onlyBad, cb, document.createTextNode("только ошибки"));
  add(tools, onlyBad);
  const wrongIdx = res.map((r, i) => r.graded && !r.ok ? st.order[i] : -1).filter(i => i >= 0);
  const again = el("button", "sm", "Прорешать ошибки заново (" + wrongIdx.length + ")");
  again.disabled = !wrongIdx.length;
  again.onclick = () => screenQuiz(st.test, "learn", wrongIdx);
  const retry = el("button", "sm", "Пройти тест заново");
  retry.onclick = () => screenQuiz(st.test, st.mode);
  add(tools, again, retry);
  add(head, tools);
  add(app, head);

  const list = el("div", "card");
  res.forEach((r, n) => {
    const d = el("div", "rev-q");
    if (r.graded && r.ok) d.dataset.ok = "1";
    const h = el("div", "rev-head");
    add(h, el("span", "ico", r.graded ? (r.ok ? "✅" : "❌") : "•"));
    add(h, el("span", "qnum", "Вопрос " + (n + 1)));
    add(d, h);
    add(d, el("p", "qtext", r.q.text));
    for (const src of r.q.images || []) { const im = el("img", "qimg"); im.src = src.startsWith("http") ? src : ""; add(d, im); }

    const mine = [...r.pick].sort((a, b) => a - b);
    const lineMine = el("div", "ans-line");
    add(lineMine, 
      el("b", null, "Ваш ответ: "),
      document.createTextNode(mine.length ? mine.map(i => letter(i) + " " + r.q.options[i].text).join("; ") : "не отвечено"));
    add(d, lineMine);
    if (r.k) {
      const lineRight = el("div", "ans-line");
      add(lineRight, 
        el("b", null, "Правильный ответ: "),
        document.createTextNode([...asSet(r.k.correct)].sort((a, b) => a - b)
          .map(i => letter(i) + " " + r.q.options[i].text).join("; ")));
      add(d, lineRight);
      const tr2 = trust(r.k.confidence);
      if (r.k.explanation || r.k.source || tr2) {
        const n2 = el("div", "note" + (tr2 && tr2.cls === "warn" ? " nokey" : ""));
        if (r.k.explanation) add(n2, el("div", null, r.k.explanation));
        if (r.k.source) add(n2, el("span", "src", "Источник: " + r.k.source));
        if (tr2) add(n2, el("span", "src " + tr2.cls, tr2.t));
        add(d, n2);
      }
    } else {
      add(d, el("div", "note nokey", "Правильный ответ не отмечен — пройдите этот вопрос в режиме «Учить» и отметьте верный вариант."));
    }
    add(list, d);
  });
  add(app, list);
  cb.onchange = () => {
    list.querySelectorAll('.rev-q[data-ok="1"]').forEach(x => x.classList.toggle("hidden", cb.checked));
  };
}

// ---------- раздел «Вопросы / Ответы»: оглавление, тема, печать ----------
// Два уровня: сначала список разделов (тренировочные / итоговые), внутри —
// вопрос и сразу правильный ответ, чтобы можно было просто читать.
// В каждом разделе своя кнопка печати: печатается только он, не все 900 вопросов.

function qaCount(t) {
  return t.questions.filter(function (q) { return keyOf(q); }).length;
}

// Оглавление разделов
function screenQA() {
  clear();
  const bar = el("div", "bar noprint");
  const back = el("button", "sm", "← К тестам");
  back.onclick = screenHome;
  add(bar, back, el("span", "pill", "вопросы и ответы для чтения и печати"));
  add(app, bar);

  const tests = (window.TESTS || []).filter(function (t) { return t.questions.length; });
  const total = tests.reduce(function (n, t) { return n + t.questions.length; }, 0);
  const withKey = tests.reduce(function (n, t) { return n + qaCount(t); }, 0);

  const head = el("div", "card");
  add(head, el("h2", null, "Вопросы и ответы"));
  add(head, el("p", "empty",
    "Выберите раздел — внутри каждый вопрос сразу с правильным ответом. " +
    "Там же кнопка «Печать»: сохранить в PDF или распечатать на А4."));
  const row = el("div", "row");
  add(row, el("span", "pill", "всего вопросов: " + total),
           el("span", "pill " + (withKey === total ? "ok" : "warn"), "с ответом: " + withKey));
  add(head, row);
  const all = el("button", "sm");
  all.textContent = "Открыть всё одним списком (" + total + ")";
  all.onclick = function () { screenQAList(null); };
  const rowAll = el("div", "row");
  rowAll.style.marginTop = "12px";
  add(rowAll, all);
  add(head, rowAll);
  add(app, head);

  ["Тренировочные", "Итоговые"].forEach(function (group) {
    const list = tests.filter(function (t) { return t.group === group; });
    if (!list.length) return;
    const n = list.reduce(function (s, t) { return s + t.questions.length; }, 0);
    add(app, el("h2", "group", group + " — " + n + " вопросов"));
    const grid = el("div", "grid");
    list.forEach(function (t) {
      const c = el("div", "card test-card");
      add(c, el("h3", null, t.title));
      const m = el("div", "meta");
      add(m, el("span", null, t.questions.length + " вопр."));
      const nk = qaCount(t);
      add(m, el("span", null, nk === t.questions.length ? "все с ответами" : "с ответом: " + nk));
      add(c, m);
      const b = el("button", "primary", "Открыть");
      b.onclick = function () { screenQAList(t.cmid); };
      const pr = el("button", null, "Сразу печать");
      pr.onclick = function () { screenQAList(t.cmid, true); };
      const r = el("div", "row");
      add(r, b, pr);
      add(c, r);
      add(grid, c);
    });
    add(app, grid);
  });
}

// Один раздел (или всё сразу, если cmid = null)
function screenQAList(cmid, autoPrint) {
  clear();
  const tests = (window.TESTS || []).filter(function (t) {
    return t.questions.length && (cmid === null || t.cmid === cmid);
  });
  const title = cmid === null ? "Все вопросы и ответы" : (tests[0] ? tests[0].title : "");

  const bar = el("div", "bar noprint");
  const back = el("button", "sm", "← К разделам");
  back.onclick = screenQA;
  const go = el("button", "sm primary", "Печать / Сохранить в PDF");
  go.onclick = function () { window.print(); };
  add(bar, back, go);
  add(app, bar);

  // шапка — она же заголовок на печати
  const head = el("div", "card");
  add(head, el("h2", null, title));
  const n = tests.reduce(function (s, t) { return s + t.questions.length; }, 0);
  const meta = el("div", "meta");
  add(meta, el("span", null, "вопросов: " + n));
  add(meta, el("span", null, "Анатомия · Реавиз"));
  add(head, meta);
  add(app, head);

  const hint = el("div", "setkey noprint");
  hint.innerHTML = "В окне печати выберите <b>«Сохранить как PDF»</b>, чтобы получить файл, " +
    "или принтер — чтобы распечатать на А4. Варианты ответов на печати скрыты, " +
    "остаются только вопрос и правильный ответ.";
  add(app, hint);

  tests.forEach(function (t) {
    const c = el("div", "card");
    if (cmid === null) add(c, el("h2", "group", t.title));
    t.questions.forEach(function (q, i) {
      const k = keyOf(q);
      const d = el("div", "rev-q");
      add(d, el("p", "qtext", (i + 1) + ". " + q.text));
      if (k) {
        const line = el("div", "ans-line");
        add(line, el("b", null, "Ответ: "),
            document.createTextNode([...asSet(k.correct)].sort(function (a, b) { return a - b; })
              .map(function (j) { return q.options[j] ? q.options[j].text : "?"; }).join("; ")));
        add(d, line);
        if (k.explanation) add(d, el("div", "ans-line expl", k.explanation));
      } else {
        add(d, el("div", "ans-line", "Ответ: ___________________"));
      }
      add(c, d);
    });
    add(app, c);
  });

  window.scrollTo(0, 0);
  if (autoPrint) setTimeout(function () { window.print(); }, 400);
}

// ---------- запуск ----------
// Ошибку показываем на самой странице: в просмотрщиках Telegram/почты консоли нет,
// и без этого экран просто остаётся пустым, непонятно почему.
function fatal(msg) {
  const d = document.getElementById("app") || document.body;
  d.textContent = "";
  const c = el("div", "card");
  add(c, el("h3", null, "Не удалось запустить тренажёр"));
  add(c, el("p", null, String(msg).slice(0, 400)));
  add(c, el("p", "empty", "Откройте файл в обычном браузере (Safari или Chrome), " +
    "а не во встроенном просмотрщике Telegram: кнопка «Поделиться» → «Открыть в Safari»."));
  add(d, c);
}
window.onerror = function (m, src, line) { fatal(m + " (строка " + line + ")"); };

// Проверка перед запуском: если данные не подгрузились, объяснить человеку, а не молчать.
if (typeof window.TESTS === "undefined") {
  fatal("Файл открылся без данных о вопросах. Похоже, скачалась только часть файла — " +
        "попросите прислать его заново и дождитесь полной загрузки.");
}

try {
  const bp = document.getElementById("btn-print");
  if (bp) bp.onclick = screenQA;
  const bt = document.getElementById("btn-theme");
  if (bt) bt.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : cur === "light" ? "" : "dark";
    if (next) document.documentElement.setAttribute("data-theme", next);
    else document.documentElement.removeAttribute("data-theme");
  };
  screenHome();
} catch (e) {
  fatal((e && e.message) || e);
}

// Офлайн-режим: service worker кеширует страницу, и после первого открытия
// тренажёр работает без интернета. Работает только по http(s) — при открытии
// файла с диска (file://) просто пропускаем, там интернет и не нужен.
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
