(Pars testicularis)", "images": []}, {"text": "Мошоночная часть (Pars scrotalis)", "images": []}, {"text": "Ампула семявыносящего протока (Ampulla ductus deferentis)", "images": []}, {"text": "Тазовая часть (Pars pelvica)", "images": []}, {"text": "Паховая часть (Pars inguinalis)", "images": []}], "rows": [], "correct": [3], "explanation": "«Достигнув мочевого пузыря, проток загибается ко дну мочевого пузыря и подходит к предстательной железе. В нижнем своем отделе он заметно расширяется в виде ампулы семявыносящего протока, ampulla ductus deferentis».", "source": "0118_Лекция 8. Половая система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "5ee84158b471", "type": "multichoice", "multiple": false, "text": "В каком анатомическом образовании проходит мужская уретра в области полового члена? Как называется структура, образующаяся на месте лопнувшего зрелого фолликула после овуляции? { ~Первичный фолликул ~Атретический фолликул ~Белое тело (corpus albicans) ~Графов пузырек =Желтое тело (corpus luteum) ~Желтое тело беременности (corpus luteum graviditatis) }", "images": [], "options": [{"text": "В отдельном фиброзном канале под уретрой", "images": []}, {"text": "Внутри обоих пещеристых тел", "images": []}, {"text": "Между пещеристыми телами", "images": []}, {"text": "Внутри губчатого тела полового члена", "images": []}, {"text": "В толще фасции полового члена", "images": []}, {"text": "В толще кожи", "images": []}], "rows": [], "correct": [3], "explanation": "Вопрос содержит склейку двух заданий (во втором, в фигурных скобках, ответ помечен как желтое тело), но приведённые варианты относятся к первому вопросу — где проходит уретра в половом члене. Лекция: «Внутри губчатого тела проходит мочеиспускательный канал, который открывается на головке полового члена». Если на экране окажется список про фолликул — правильный ответ «Желтое тело (corpus luteum)».", "source": "0118_Лекция 8. Половая система.pdf.txt", "confidence": "claude-medium", "moodle_right": ""}, {"key": "d4846c32faf8", "type": "multichoice", "multiple": false, "text": "Какая структура следует непосредственно за дном мочевого пузыря (fundus vesicae) и мочепузырным треугольником на пути оттока мочи?", "images": [], "options": [{"text": "Тело пузыря (Corpus vesicae)", "images": []}, {"text": "Внутреннее отверстие мочеиспускательного канала (Ostium urethrae internum)", "images": []}, {"text": "Срединная пупочная связка (Lig. umbilicale medianum)", "images": []}, {"text": "Верхушка пузыря (Apex vesicae)", "images": []}, {"text": "Наружное отверстие уретры", "images": []}, {"text": "Устья мочеточников (Ostia ureterum)", "images": []}], "rows": [], "correct": [1], "explanation": "«Мочепузырный треугольник по бокам ограничен отверстиями мочеточников... а спереди внутренним отверстием мочеиспускательного канала, ostium urethrae internum» — именно через него моча покидает пузырь, переходя в шейку и уретру.", "source": "0117_Лекция 7 Мочевая система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "cfd2c66cbe95", "type": "multichoice", "multiple": false, "text": "Какое событие в яичнике соответствует середине менструального цикла (примерно 14-й день при 28-дневном цикле)?", "images": [], "options": [{"text": "Начало роста примордиальных фолликулов", "images": []}, {"text": "Максимальное развитие белого тела", "images": []}, {"text": "Начало менструального кровотечения", "images": []}, {"text": "Полная атрофия желтого тела", "images": []}, {"text": "Имплантация зародыша", "images": []}, {"text": "Овуляция", "images": []}], "rows": [], "correct": [5], "explanation": "«Каждые 28-30 дней в фолликуле созревает яйцеклетка... Созревающий фолликул (графов пузырек) продвигается к поверхности яичника и лопается... это процесс овуляции». Конкретная дата 14-го дня в лекции не указана, но классически овуляция приходится на середину 28-дневного цикла.", "source": "0118_Лекция 8. Половая система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "5a390e1902b6", "type": "multichoice", "multiple": false, "text": "Какая часть мужского мочеиспускательного канала является самой длинной и следует за перепончатой частью?", "images": [], "options": [{"text": "Внутреннее отверстие уретры (Ostium urethrae internum)", "images": []}, {"text": "Внутристеночная часть (Pars intramuralis)", "images": []}, {"text": "Промежуточная часть", "images": []}, {"text": "Предстательная часть (Pars prostatica)", "images": []}, {"text": "Губчатая часть (Pars spongiosa)", "images": []}, {"text": "Перепончатая часть (Pars membranacea)", "images": []}], "rows": [], "correct": [4], "explanation": "Перепончатая часть — 1,5 см, простатическая — 2,5 см, а «губчатая часть, pars spongiosa, проходит через губчатое тело полового члена на всем его протяжении» (около 15 см), то есть самая длинная, и следует она сразу за перепончатой.", "source": "0117_Лекция 7 Мочевая система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "9980497c9003", "type": "multichoice", "multiple": false, "text": "Какая часть шейки матки выступает в просвет влагалища?", "images": [], "options": [{"text": "Канал шейки матки (Canalis cervicis uteri)", "images": []}, {"text": "Надвлагалищная часть (Portio supravaginalis)", "images": []}, {"text": "Пальмовидные складки (Plicae palmatae)", "images": []}, {"text": "Задняя губа (Labium posterius)", "images": []}, {"text": "Влагалищная часть (Portio vaginalis)", "images": []}, {"text": "Перешеек (Isthmus uteri)", "images": []}], "rows": [], "correct": [4], "explanation": "«Шейка матки делится на надвлагалищную часть, portio supravaginalis cervicis, и влагалищную часть, portio vaginalis cervicis» — именно последняя выступает в просвет влагалища (и поэтому не покрыта брюшиной).", "source": "0118_Лекция 8. Половая система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "fffa70ea00c6", "type": "multichoice", "multiple": false, "text": "С каким протоком сливается выделительный проток семенного пузырька (ductus excretorius) для образования семявыбрасывающего протока?", "images": [], "options": [{"text": "С протоком придатка яичка (Ductus epididymidis)", "images": []}, {"text": "С семявыбрасывающим протоком (Ductus ejaculatorius)", "images": []}, {"text": "С мочеточником (Ureter)", "images": []}, {"text": "С протоком бульбоуретральной железы", "images": []}, {"text": "С семявыносящим протоком (Ductus deferens)", "images": []}, {"text": "С протоком простаты (Ductulus prostaticus)", "images": []}], "rows": [], "correct": [4], "explanation": "«Нижний заостренный конец семенного пузырька переходит в узкий выделительный проток, ductus excretorius, который соединяется под острым углом с ductus deferens той же стороны, образуя вместе с ним семявыбрасывающий проток, ductus ejaculatorius».", "source": "0118_Лекция 8. Половая система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}]}, {"cmid": "29148", "folder": "06_tsns_i_organy_chuvstv", "title": "Тестирование по ЦНС и органам чувств", "minutes": 20, "group": "Тренировочные", "questions": [{"key": "4c1a0209f03f", "type": "multichoice", "multiple": false, "text": "Определите функциональную принадлежность языкоглоточного нерва (IX пара), иннервирующего мышцы глотки, околоушную железу и заднюю треть языка.", "images": [], "options": [{"text": "Чувствительный нерв", "images": []}, {"text": "Двигательный нерв", "images": []}, {"text": "Исключительно соматический нерв", "images": []}, {"text": "Смешанный нерв", "images": []}], "rows": [], "correct": [3], "explanation": "Языкоглоточный нерв смешанный: содержит двигательные волокна (шилоглоточная мышца), чувствительные (задняя треть языка, глотка, барабанная полость) и парасимпатические (околоушная железа). Материал прямо говорит: «Языкоглоточный нерв (n. glossopharyngeus) - нерв третьей жаберной дуги, смешанный... В составе нерва 3 вида нервных волокон».", "source": "0087_Черепные нервы, шейное сплетение.docx.txt:266", "confidence": "claude-high", "moodle_right": ""}, {"key": "3249c571ff87", "type": "multichoice", "multiple": false, "text": "Каким термином обозначается крупная извилина, расположенная в лобной доле кпереди от центральной борозды и содержащая корковый конец двигательного анализатора?", "images": [], "options": [{"text": "Gyrus cinguli", "images": []}, {"text": "Gyrus postcentralis", "images": []}, {"text": "Gyrus precentralis", "images": []}, {"text": "Gyrus frontalis superior", "images": []}], "rows": [], "correct": [2], "explanation": "Кпереди от центральной борозды в лобной доле лежит предцентральная извилина — корковый конец двигательного анализатора. Материал: «Указанные борозды делят лобную долю на 4 извилины: предцентральную (gyrus precentralis)...», и далее «пучки заканчиваются в ядрах кожного и двигательного анализаторов коры (постцентральная и предцентральная извилины)».", "source": "0084_Центральная нервная система в печать.docx.txt:221,348", "confidence": "claude-high", "moodle_right": ""}, {"key": "35ad779f4a52", "type": "multichoice", "multiple": false, "text": "Как называется самая нижняя часть ствола головного мозга, являющаяся непосредственным продолжением спинного мозга?", "images": [], "options": [{"text": "Pons", "images": []}, {"text": "Mesencephalon", "images": []}, {"text": "Medulla oblongata", "images": []}, {"text": "Diencephalon", "images": []}], "rows": [], "correct": [2], "explanation": "Продолговатый мозг — самая нижняя часть ствола. Материал: «Продолговатый мозг (medulla oblongata) представляет собой отдел мозгового ствола длиной в среднем 25 мм, который является непосредственным продолжением спинного мозга».", "source": "0084_Центральная нервная система в печать.docx.txt:81", "confidence": "claude-high", "moodle_right": ""}, {"key": "eb59c7f8b66e", "type": "multichoice", "multiple": false, "text": "Как называются структуры, образованные аксонами двигательных нейронов, которые выходят из переднелатеральной борозды спинного мозга?", "images": [], "options": [{"text": "Cornua anteriora", "images": []}, {"text": "Radices posteriores", "images": []}, {"text": "Radices anteriores", "images": []}, {"text": "Funiculi laterales", "images": []}], "rows": [], "correct": [2], "explanation": "Передние корешки — это аксоны двигательных клеток передних рогов, выходящие из переднелатеральной борозды. Материал: «Передний корешок (radix anterior) образован преимущественно аксонами двигательных клеток передних рогов спинного мозга... Передний корешок выходит из передней боковой борозды спинного мозга и выполняет двигательные функции».", "source": "0084_Центральная нервная система в печать.docx.txt:40", "confidence": "claude-high", "moodle_right": ""}, {"key": "8692b9000317", "type": "multichoice", "multiple": false, "text": "Укажите латинское название отдела головного мозга, который включает в себя таламус, эпиталамус, метаталамус и гипоталамус.", "images": [], "options": [{"text": "Telencephalon", "images": []}, {"text": "Metencephalon", "images": []}, {"text": "Mesencephalon", "images": []}, {"text": "Diencephalon", "images": []}], "rows": [], "correct": [3], "explanation": "Таламус, эпиталамус, метаталамус и гипоталамус — отделы промежуточного мозга. Материал последовательно описывает их в разделе «Промежуточный мозг (diencephalon)»: «различают более «молодые» отделы промежуточного мозга (таламус, метаталамус, эпиталамус) и относительно «старый» гипоталамус».", "source": "0084_Центральная нервная система в печать.docx.txt:179-180", "confidence": "claude-high", "moodle_right": ""}, {"key": "59e4ff090c23", "type": "multichoice", "multiple": false, "text": "Какое анатомическое образование сосудистой оболочки отвечает за процесс аккомодации благодаря изменению натяжения ресничного пояска (цинновой связки)?", "images": [], "options": [{"text": "Iris", "images": []}, {"text": "Cornea", "images": []}, {"text": "Choroidea", "images": []}, {"text": "Corpus ciliare", "images": []}], "rows": [], "correct": [3], "explanation": "Аккомодацию обеспечивает ресничное тело (corpus ciliare) за счёт ресничной мышцы, меняющей натяжение ресничного пояска. Материал: «Этой мышцей ресничное тело выполняет вторую важную функцию - аккомодационную... При их сокращении ресничное тело подтягивается вперед и натяжение ресничного пояска уменьшается».", "source": "0083_Учение об органах чувств.docx.txt:34-35", "confidence": "claude-high", "moodle_right": ""}, {"key": "965044e7e501", "type": "multichoice", "multiple": false, "text": "Укажите латинское название двигательного ядра отводящего нерва (VI пара), которое проецируется в области лицевого холмика (colliculus facialis) ромбовидной ямки.", "images": [], "options": [{"text": "Nucleus nervi abducentis", "images": []}, {"text": "Nucleus motorius nervi trigemini", "images": []}, {"text": "Nucleus nervi facialis", "images": []}, {"text": "Nucleus salivatorius superior", "images": []}], "rows": [], "correct": [0], "explanation": "Ядро отводящего нерва (nucleus nervi abducentis) лежит в покрышке моста и проецируется на лицевой холмик ромбовидной ямки, где его огибает колено лицевого нерва. Материал подтверждает локализацию ядра в мосту («10 - ядро отводящего нерва») и наличие лицевого бугорка на схеме проекции ядер на ромбовидную ямку («2 - лицевой бугорок»).", "source": "0084_Центральная нервная система в печать.docx.txt:114,145", "confidence": "claude-high", "moodle_right": ""}, {"key": "a3462926a48a", "type": "multichoice", "multiple": false, "text": "Как называется пространство ядра глаза, ограниченное задней поверхностью радужки спереди и передней поверхностью хрусталика сзади?", "images": [], "options": [{"text": "Spatium perichoroideale", "images": []}, {"text": "Camera posterior bulbi", "images": []}, {"text": "Camera anterior bulbi", "images": []}, {"text": "Sinus venosus sclerae", "images": []}], "rows": [], "correct": [1], "explanation": "Задняя камера глаза ограничена спереди задней поверхностью радужки, сзади — хрусталиком. Материал: «Сзади от радужки расположен хрусталик, который вместе с ней ограничивает заднюю камеру глазного яблока (camera posterior bulbi)».", "source": "0083_Учение об органах чувств.docx.txt:28", "confidence": "claude-high", "moodle_right": ""}, {"key": "bb5499a439fd", "type": "multichoice", "multiple": false, "text": "Какая жидкость внутреннего уха первой приходит в движение в лестнице преддверия (scala vestibuli) под действием колебаний толчка стремени?", "images": [], "options": [{"text": "Humor aquosus", "images": []}, {"text": "Liquor cerebrospinalis", "images": []}, {"text": "Endolympha", "images": []}, {"text": "Perilympha", "images": []}], "rows": [], "correct": [3], "explanation": "Лестница преддверия относится к перилимфатическому пространству, поэтому первой приходит в движение перилимфа. Материал: «Они передаются цепочке слуховых косточек и через основание стремени в окне преддверия - перилимфе лестницы преддверия».", "source": "0083_Учение об органах чувств.docx.txt:155", "confidence": "claude-high", "moodle_right": ""}, {"key": "cdb2e661e6df", "type": "multichoice", "multiple": false, "text": "Какая двояковыпуклая прозрачная линза входит в состав светопреломляющего ядра глаза и способна менять свою кривизну?", "images": [], "options": [{"text": "Humor aquosus", "images": []}, {"text": "Cornea", "images": []}, {"text": "Corpus vitreum", "images": []}, {"text": "Lens", "images": []}], "rows": [], "correct": [3], "explanation": "Двояковыпуклая прозрачная линза, меняющая кривизну при аккомодации, — хрусталик (lens). Материал описывает именно изменение кривизны хрусталика ресничной мышцей: «аккомодационную - изменение кривизны хрусталика... Хрусталик в силу своей эластичности принимает более округлую форму». Роговица преломляет, но кривизну не меняет; стекловидное тело и влага — не линзы.", "source": "0083_Учение об органах чувств.docx.txt:35", "confidence": "claude-high", "moodle_right": ""}, {"key": "4efa7d58f83c", "type": "multichoice", "multiple": false, "text": "Каким термином обозначается внутренняя чувствительная оболочка глазного яблока, содержащая фоторецепторы?", "images": [], "options": [{"text": "Cornea", "images": []}, {"text": "Retina", "images": []}, {"text": "Choroidea", "images": []}, {"text": "Sclera", "images": []}], "rows": [], "correct": [1], "explanation": "Внутренняя чувствительная оболочка — сетчатка. Материал: «Внутренняя оболочка глазного яблока (tun. interna bulbi) состоит из сетчатки (retina)... В нервной части находятся светочувствительные клетки - фоторецепторы, которые имеют вид палочек и колбочек».", "source": "0083_Учение об органах чувств.docx.txt:37", "confidence": "claude-high", "moodle_right": ""}, {"key": "b22653a8ae3e", "type": "multichoice", "multiple": false, "text": "Укажите правильный последовательный путь передачи звуковых колебаний по цепи слуховых косточек среднего уха.", "images": [], "options": [{"text": "Stapes -> incus -> malleus", "images": []}, {"text": "Malleus -> stapes -> incus", "images": []}, {"text": "Malleus -> incus -> stapes", "images": []}, {"text": "Incus -> malleus -> stapes", "images": []}], "rows": [], "correct": [2], "explanation": "Цепь идёт от барабанной перепонки к окну преддверия: молоточек — наковальня — стремя. Материал: «Головка молоточка соединяется с телом наковальни. Рукоятка молоточка срастается с барабанной перепонкой. Основание стремени укреплено подвижно в окружности отверстия преддверия».", "source": "0083_Учение об органах чувств.docx.txt:112", "confidence": "claude-high", "moodle_right": ""}, {"key": "cff36d2fd725", "type": "multichoice", "multiple": false, "text": "В каких анатомических образованиях перепончатого лабиринта расположены ампулярные гребешки (cristae ampullares), воспринимающие угловые ускорения и вращательные движения?", "images": [], "options": [{"text": "Ductus cochlearis", "images": []}, {"text": "Canalis reuniens", "images": []}, {"text": "Ductus semicirculares", "images": []}, {"text": "Utriculus et sacculus", "images": []}], "rows": [], "correct": [2], "explanation": "Ампулярные гребешки лежат в ампулах полукружных протоков и реагируют на угловые ускорения. Материал: «Полукружные протоки (ductus semicirculares)... Волосковые чувствительные клетки расположены на ампулярных гребешках (cristae ampullares), которые... находятся в каждой ампуле... При поворотах головы или ускоренном угловом вращении». В мешочках (utriculus et sacculus) расположены пятна (maculae), а не гребешки.", "source": "0083_Учение об органах чувств.docx.txt:145", "confidence": "claude-high", "moodle_right": ""}, {"key": "7204700c7d0d", "type": "multichoice", "multiple": false, "text": "К какому функциональному типу относится подъязычный нерв (XII пара), управляющий движениями мышц языка?", "images": [], "options": [{"text": "Двигательный нерв", "images": []}, {"text": "Вегетативный нерв", "images": []}, {"text": "Смешанный нерв", "images": []}, {"text": "Чувствительный нерв", "images": []}], "rows": [], "correct": [0], "explanation": "XII пара — чисто двигательный нерв мышц языка. Материал: «XII - подъязычный нерв: двигательный (мышцы языка)».", "source": "0087_Черепные нервы, шейное сплетение.docx.txt:21", "confidence": "claude-high", "moodle_right": ""}, {"key": "b6716b95c8e8", "type": "multichoice", "multiple": false, "text": "Какая из слуховых косточек среднего уха своей основой (базисом) закрывает окно преддверия (fenestra vestibuli)?", "images": [], "options": [{"text": "Stapes", "images": []}, {"text": "Malleus", "images": []}, {"text": "Incus", "images": []}, {"text": "Os lenticulare", "images": []}], "rows": [], "correct": [0], "explanation": "Основание стремени закрывает окно преддверия. Материал: «Окно преддверия закрыто основанием стремени, окно улитки - вторичной барабанной перепонкой».", "source": "0083_Учение об органах чувств.docx.txt:110", "confidence": "claude-high", "moodle_right": ""}, {"key": "87c1c4f925d7", "type": "multichoice", "multiple": false, "text": "Через какое анатомическое образование на сетчатке выходит зрительный нерв, из-за чего в этой зоне полностью отсутствуют фоторецепторы («слепое пятно»)?", "images": [], "options": [{"text": "Macula lutea", "images": []}, {"text": "Fovea centralis", "images": []}, {"text": "Discus nervi optici", "images": []}, {"text": "Ora serrata", "images": []}], "rows": [], "correct": [2], "explanation": "Диск зрительного нерва — место выхода нерва, фоторецепторы там отсутствуют («слепое пятно»). Материал: «Место выхода этого нерва из зрительной части сетчатки - это хорошо выраженное овальное возвышение - диск зрительного нерва (discus nn. optici)... Палочки и колбочки в области диска отсутствуют».", "source": "0083_Учение об органах чувств.docx.txt:37", "confidence": "claude-high", "moodle_right": ""}, {"key": "a1ad98bec14c", "type": "multichoice", "multiple": false, "text": "Через какое окно медиальной стенки барабанной полости основание стремени (stapes) передает механические колебания на жидкости внутреннего уха?", "images": [], "options": [{"text": "Apertura tympanica", "images": []}, {"text": "Porus acusticus internus", "images": []}, {"text": "Fenestra vestibuli", "images": []}, {"text": "Fenestra cochleae", "images": []}], "rows": [], "correct": [2], "explanation": "Стремя передаёт колебания через окно преддверия (fenestra vestibuli) на медиальной (лабиринтной) стенке барабанной полости. Материал: «Лабиринтная стенка... На этой стенке имеется 2 отверстия: окно преддверия (fenestra vestibuli) и окно улитки (fenestra cochleae). Окно преддверия закрыто основанием стремени». Окно улитки затянуто вторичной барабанной перепонкой и служит выходом колебаний.", "source": "0083_Учение об органах чувств.docx.txt:110", "confidence": "claude-high", "moodle_right": ""}, {"key": "5d7c73e3c0b0", "type": "multichoice", "multiple": false, "text": "Какое ядро продолговатого мозга является общим чувствительным ядром для IX (языкоглоточного) и X (блуждающего) пар черепных нервов, куда поступают вкусовые и висцерочувствительные импульсы?", "images": [], "options": [{"text": "Nucleus spinalis nervi trigemini", "images": []}, {"text": "Nucleus salivatorius inferior", "images": []}, {"text": "Nucleus ambiguus", "images": []}, {"text": "Nucleus solitarius", "images": []}], "rows": [], "correct": [3], "explanation": "Ядро одиночного пути (nucleus solitarius, ядро одиночного пучка) — общее чувствительное ядро для VII, IX и X пар, принимает вкусовые и висцерочувствительные импульсы. Материал относит его к ядрам продолговатого мозга («4 - ядро одиночного пути») и к ядрам черепных нервов на схеме («21 - ядро одиночного пучка»). Nucleus ambiguus — двигательное (двойное) ядро IX и X, а не чувствительное.", "source": "0084_Центральная нервная система в печать.docx.txt:105; 0087_Черепные нервы, шейное сплетение.docx.txt:29", "confidence": "claude-high", "moodle_right": ""}, {"key": "f57bd806cd6e", "type": "multichoice", "multiple": false, "text": "В полушариях какого отдела головного мозга расположены боковые желудочки (первый и второй)?", "images": [], "options": [{"text": "Telencephalon", "images": []}, {"text": "Mesencephalon", "images": []}, {"text": "Metencephalon", "images": []}, {"text": "Diencephalon", "images": []}], "rows": [], "correct": [0], "explanation": "Боковые желудочки — полости конечного мозга, лежащие в толще его полушарий. Материал: «Полостями конечного мозга являются боковые желудочки (ventriculi laterales). Они расположены в толще полушарий».", "source": "0084_Центральная нервная система в печать.docx.txt:304", "confidence": "claude-high", "moodle_right": ""}, {"key": "639a75548a09", "type": "multichoice", "multiple": false, "text": "Укажите латинское название парасимпатического (добавочного) ядра III пары черепных нервов, обеспечивающего иннервацию мышцы, суживающей зрачок (m. sphincter pupillae).", "images": [], "options": [{"text": "Nucleus nervi oculomotorii", "images": []}, {"text": "Nucleus accessorius nervi oculomotorii", "images": []}, {"text": "Nucleus mesencephalicus nervi trigemini", "images": []}, {"text": "Nucleus nervi trochlearis", "images": []}], "rows": [], "correct": [1], "explanation": "Парасимпатическое ядро III пары — добавочное ядро глазодвигательного нерва (ядро Якубовича-Эдингера-Вестфаля). Материал: «Мезэнцефалическое парасимпатическое ядро - добавочное ядро глазодвигательного нерва (nucleus accessories n. oculomotorii)... Преганглионарные парасимпатические волокна идут из этого ядра... к ресничному узлу», а от узла короткие ресничные нервы «иннервируют сфинктер зрачка и ресничную мышцу».", "source": "0087_Черепные нервы, шейное сплетение.docx.txt:389,397", "confidence": "claude-high", "moodle_right": ""}, {"key": "97c4f917fd28", "type": "multichoice", "multiple": false, "text": "Какова функция отводящего нерва (VI пара), отвечающего за поворот глазного яблока кнаружи?", "images": [], "options": [{"text": "Парасимпатический нерв", "images": []}, {"text": "Чувствительный нерв", "images": []}, {"text": "Двигательный нерв", "images": []}, {"text": "Смешанный нерв", "images": []}], "rows": [], "correct": [2], "explanation": "VI пара — чисто двигательный нерв латеральной прямой мышцы глаза, которая поворачивает глазное яблоко кнаружи. Материал: «VI - отводящий нерв: двигательный (латеральная прямая мышца глаза)» и «Иннервирует наружную прямую мышцу глаза».", "source": "0087_Черепные нервы, шейное сплетение.docx.txt:21,184", "confidence": "claude-high", "moodle_right": ""}, {"key": "d8965a913e22", "type": "multichoice", "multiple": false, "text": "Через какое анатомическое образование водянистая влага (humor aquosus) оттекает из передней камеры глаза в венозную систему?", "images": [], "options": [{"text": "Processus ciliares", "images": []}, {"text": "Pupilla", "images": []}, {"text": "Sinus venosus sclerae", "images": []}, {"text": "Foramen caecum", "images": []}], "rows": [], "correct": [2], "explanation": "Отток водянистой влаги из передней камеры идёт через пространства радужно-роговичного угла в венозный синус склеры (синус Шлемма). Материал: «Из передней камеры через пространства радужно-роговичного угла она оттекает в венозный синус склеры, далее - в венозное сплетение склеры и передние ресничные вены».", "source": "0083_Учение об органах чувств.docx.txt:39", "confidence": "claude-high", "moodle_right": ""}, {"key": "7018cd4dac61", "type": "multichoice", "multiple": false, "text": "В какую полость (камеру) глазного яблока попадает свет непосредственно после прохождения через роговицу?", "images": [], "options": [{"text": "Corpus vitreum", "images": []}, {"text": "Camera anterior bulbi", "images": []}, {"text": "Sinus venosus sclerae", "images": []}, {"text": "Camera posterior bulbi", "images": []}], "rows": [], "correct": [1], "explanation": "Сразу за роговицей лежит передняя камера глаза. Материал: «Между передней поверхностью радужки и роговицей находится передняя камера глазного яблока (camera anterior bulbi)». Дальше свет идёт через зрачок в заднюю камеру, затем хрусталик и стекловидное тело.", "source": "0083_Учение об органах чувств.docx.txt:28", "confidence": "claude-high", "moodle_right": ""}, {"key": "c5d3ef3e3697", "type": "multichoice", "multiple": false, "text": "Каким латинским термином обозначаются корешки спинномозговых нервов, которые состоят из центральных отростков чувствительных узлов и входят в заднелатеральную борозду?", "images": [], "options": [{"text": "Radices posteriores", "images": []}, {"text": "Radices anteriores", "images": []}, {"text": "Funiculi posteriores", "images": []}, {"text": "Cornua posteriora", "images": []}], "rows": [], "correct": [0], "explanation": "Задние корешки — центральные отростки (аксоны) клеток чувствительных спинномозговых узлов, вступающие в заднелатеральную борозду. Материал: «Задний корешок (radix posterior) составляют аксоны чувствительных клеток спинномозговых узлов... Задний корешок вступает в боковую заднюю борозду и является чувствительным».", "source": "0084_Центральная нервная система в печать.docx.txt:40", "confidence": "claude-high", "moodle_right": ""}, {"key": "5ddc6f2b04a8", "type": "multichoice", "multiple": false, "text": "Как называется место на сетчатке, расположенное латеральнее диска зрительного нерва, которое является зоной наилучшего видения и содержит наибольшую концентрацию колбочек?", "images": [], "options": [{"text": "Macula lutea", "images": []}, {"text": "Ora serrata", "images": []}, {"text": "Discus nervi optici", "images": []}, {"text": "Excavatio disci", "images": []}], "rows": [], "correct": [0], "explanation": "Жёлтое пятно (macula lutea) лежит кнаружи (латеральнее) диска зрительного нерва и является зоной наилучшего видения. Материал: «На 4 мм кнаружи от диска зрительного нерва расположено желтое пятно (macula lutea)... содержит большое количество колбочек (палочки отсутствуют) и является местом наилучшего восприятия световых раздражений». Fovea centralis — её центральная ямка, но в вариантах её нет, а термин вопроса («место... содержит наибольшую концентрацию колбочек») соответствует macula lutea.", "source": "0083_Учение об органах чувств.docx.txt:37", "confidence": "claude-high", "moodle_right": ""}, {"key": "3fb8ff21f2af", "type": "multichoice", "multiple": false, "text": "Как называется внутренняя (чувствительная) оболочка глаза, содержащая фоторецепторы (палочки и колбочки)?", "images": [], "options": [{"text": "Retina", "images": []}, {"text": "Cornea", "images": []}, {"text": "Choroidea", "images": []}, {"text": "Sclera", "images": []}], "rows": [], "correct": [0], "explanation": "Внутренняя чувствительная оболочка с палочками и колбочками — сетчатка (retina). Материал: «Внутренняя оболочка глазного яблока (tun. interna bulbi) состоит из сетчатки (retina)... фоторецепторы, которые имеют вид палочек и колбочек». Дубль вопроса 4efa7d58f83c, но с другим порядком вариантов.", "source": "0083_Учение об органах чувств.docx.txt:37", "confidence": "claude-high", "moodle_right": ""}, {"key": "4c920a5892fb", "type": "multichoice", "multiple": false, "text": "Как называется хорошо заметная продольная борозда, проходящая по вентральной поверхности моста по срединной линии?", "images": [], "options": [{"text": "Fissura mediana anterior", "images": []}, {"text": "Sulcus bulbopontinus", "images": []}, {"text": "Sulcus basilaris", "images": []}, {"text": "Sulcus intermedius anterior", "images": []}], "rows": [], "correct": [2], "explanation": "По срединной линии вентральной (передней) поверхности моста проходит базилярная борозда, в которой лежит базилярная артерия. Материал: «Посередине передней поверхности моста расположена базилярная борозда (sul. basilaris)». Fissura mediana anterior — срединная щель продолговатого и спинного мозга, sulcus bulbopontinus — поперечная борозда на границе моста и продолговатого мозга.", "source": "0084_Центральная нервная система в печать.docx.txt:102", "confidence": "claude-high", "moodle_right": ""}, {"key": "024998b4f53a", "type": "multichoice", "multiple": false, "text": "Укажите латинское название прозрачной передней части фиброзной оболочки, которая не имеет сосудов и является мощной светопреломляющей средой.", "images": [], "options": [{"text": "Sclera", "images": []}, {"text": "Retina", "images": []}, {"text": "Cornea", "images": []}, {"text": "Iris", "images": []}], "rows": [], "correct": [2], "explanation": "Передняя прозрачная бессосудистая часть фиброзной оболочки — роговица. Материал: «Фиброзная оболочка глазного яблока (tun. fibrosa bulbi) наружная... состоит из роговицы, занимающей переднюю треть глазного яблока, и склеры, расположенной на остальных двух третях». Роговица — главная светопреломляющая среда глаза (около 40 дптр).", "source": "0083_Учение об органах чувств.docx.txt:18", "confidence": "claude-high", "moodle_right": ""}, {"key": "33a957566a2f", "type": "multichoice", "multiple": false, "text": "Укажите латинское название борозды продолговатого мозга, из которой выходят корешки подъязычного нерва (XII пара).", "images": [], "options": [{"text": "Fissura mediana anterior", "images": []}, {"text": "Sulcus anterolateralis", "images": []}, {"text": "Sulcus posterolateralis", "images": []}, {"text": "Sulcus bulbopontinus", "images": []}], "rows": [], "correct": [1], "explanation": "Корешки XII пары выходят из переднелатеральной борозды между пирамидой и оливой. Материал: «Из передней латеральной борозды между пирамидой и оливой выходят корешки подъязычного нерва. Позади оливы из задней латеральной борозды выходят корешки языкоглоточного, блуждающего и добавочного черепных нервов».", "source": "0084_Центральная нервная система в печать.docx.txt:83", "confidence": "claude-high", "moodle_right": ""}, {"key": "65a168881705", "type": "multichoice", "multiple": false, "text": "Укажите латинское название самой крупной, преимущественно чувствительной части промежуточного мозга, которая представляет собой парное скопление серого вещества.", "images": [], "options": [{"text": "Epithalamus", "images": []}, {"text": "Metathalamus", "images": []}, {"text": "Thalamus", "images": []}, {"text": "Hypothalamus", "images": []}], "rows": [], "correct": [2], "explanation": "Таламус — парное массивное скопление серого вещества, коллектор чувствительных путей, самая крупная часть промежуточного мозга. Материал: «Таламус (thalamus) представляет собой парное массивное образование яйцевидной формы... Таламус представляет собой наиболее крупное скопление серого вещества... является коллектором чувствительных путей».", "source": "0084_Центральная нервная система в печать.docx.txt:181-182", "confidence": "claude-high", "moodle_right": ""}]}, {"cmid": "29147", "folder": "07_serdtse_i_angiologiya", "title": "Тестирование по сердцу и общей ангиологии", "minutes": 20, "group": "Тренировочные", "questions": [{"key": "a09937a0c067", "type": "multichoice", "multiple": false, "text": "Как по-латыни называется левое ушко сердца, расположенное на его передней поверхности рядом с легочным стволом?", "images": [], "options": [{"text": "Auricula sinistra", "images": []}, {"text": "Atrium sinistrum", "images": []}, {"text": "Auricula dextra", "images": []}, {"text": "Ventriculus sinister", "images": []}], "rows": [], "correct": [0], "explanation": "Левое предсердие кпереди продолжается в добавочную полость — левое ушко, auricula sinistra, которое направлено к основанию легочного ствола. Atrium sinistrum — это сама камера, а не ушко.", "source": "0148_Лекция 4.2 Сердце. Круги кровообращения..pdf.txt:151 — «Кпереди оно продолжается в добавочную полость — левое ушко, auricula sinistra, которое направлено к основанию легочного ствола»", "confidence": "claude-high", "moodle_right": ""}, {"key": "363775fe75d4", "type": "multichoice", "multiple": false, "text": "Какие ветви грудной аорты несут артериальную кровь к легким?", "images": [], "options": [{"text": "Rami mediastinales", "images": []}, {"text": "Arteriae pulmonales", "images": []}, {"text": "Rami pericardiaci", "images": []}, {"text": "Rami bronchiales", "images": []}], "rows": [], "correct": [3], "explanation": "Артериальную (питающую) кровь к бронхам и тканям легких несут бронхиальные ветви грудной части аорты, rr. bronchiales. Aa. pulmonales несут венозную кровь из правого желудочка (малый круг), поэтому они не подходят.", "source": "0149_Лекция 4.3. Артерии большого круга кровообращения.pdf.txt:104 — «Висцеральные ветви грудной части аорты: a) Бронхиальные ветви, rr. bronchiales»; 0080_Сердечнососудистая система.docx.txt:309 — «Бронхиальные ветви (rr. bronchiales)... снабжая кровью бронхи и легкие»", "confidence": "claude-high", "moodle_right": ""}, {"key": "40fc14c72934", "type": "multichoice", "multiple": false, "text": "Как называется главная артерия плеча, которая является продолжением подмышечной артерии?", "images": [], "options": [{"text": "Arteria collateralis ulnaris superior", "images": []}, {"text": "Arteria radialis", "images": []}, {"text": "Arteria profunda brachii", "images": []}, {"text": "Arteria brachialis", "images": []}], "rows": [], "correct": [3], "explanation": "Плечевая артерия, a. brachialis, — прямое продолжение подмышечной артерии от нижнего края большой грудной мышцы; идет в sulcus bicipitalis medialis до локтевой ямки, где делится на лучевую и локтевую. A. profunda brachii и a. collateralis ulnaris superior — её ветви.", "source": "0080_Сердечнососудистая система.docx.txt:395 — «Плечевая артерия (a. brachialis) является продолжением подмышечной артерии от нижнего края большой грудной мышцы»", "confidence": "claude-high", "moodle_right": ""}, {"key": "cf511d8be09c", "type": "multichoice", "multiple": false, "text": "Какая крупная магистральная артерия является непосредственным продолжением наружной подвздошной артерии после её выхода из сосудистой лакуны на бедро?", "images": [], "options": [{"text": "Arteria iliaca interna", "images": []}, {"text": "Arteria poplitea", "images": []}, {"text": "Arteria profunda femoris", "images": []}, {"text": "Arteria femoralis", "images": []}], "rows": [], "correct": [3], "explanation": "", "source": "перенесено из другого теста (тот же вопрос)", "confidence": "moodle", "moodle_right": ""}, {"key": "a12523065ad6", "type": "multichoice", "multiple": false, "text": "Из какого отдела сердца берет начало восходящая часть аорты, дающая начало большому кругу кровообращения?", "images": [], "options": [{"text": "Ventriculus sinister", "images": []}, {"text": "Atrium dextrum", "images": []}, {"text": "Ventriculus dexter", "images": []}, {"text": "Atrium sinistrum", "images": []}], "rows": [], "correct": [0], "explanation": "", "source": "перенесено из другого теста (тот же вопрос)", "confidence": "moodle", "moodle_right": ""}, {"key": "e9b1666c8180", "type": "multichoice", "multiple": false, "text": "Какое анатомическое образование представляет собой правый лимфатический проток, собирающий лимфу от правой половины головы, шеи, правой руки и правой половины грудной клетки?", "images": [], "options": [{"text": "Ductus thoracicus", "images": []}, {"text": "Truncus bronchomediastinalis dexter", "images": []}, {"text": "Truncus jugularis dexter", "images": []}, {"text": "Ductus lymphaticus dexter", "images": []}], "rows": [], "correct": [3], "explanation": "", "source": "перенесено из другого теста (тот же вопрос)", "confidence": "moodle", "moodle_right": ""}, {"key": "c3ee98d6cabc", "type": "multichoice", "multiple": false, "text": "Стенки каких камер сердца характеризуются наличием сосочковых мышц, соединенных со створками клапанов сухожильными хордами?", "images": [], "options": [{"text": "Ventriculi cordis", "images": []}, {"text": "Auriculae atriorum", "images": []}, {"text": "Sinus venarum cavarum", "images": []}, {"text": "Atria cordis", "images": []}], "rows": [], "correct": [0], "explanation": "Сосочковые мышцы (mm. papillares), от верхушек которых к створкам атриовентрикулярных клапанов идут сухожильные хорды, образованы внутренним слоем миокарда ЖЕЛУДОЧКОВ. В предсердиях и ушках вместо них гребенчатые мышцы.", "source": "0080_Сердечнососудистая система.docx.txt:191, 196 — «створок... сухожильных хорд и сосочковых мышц, образованных внутренним слоем миокарда желудочков»; «Сухожильные хорды... идущие в виде нитей от краев створок к верхушкам сосочковых мышц»", "confidence": "claude-high", "moodle_right": ""}, {"key": "67986cccb9d7", "type": "multichoice", "multiple": false, "text": "В какой общий венозный коллектор, расположенный на диафрагмальной поверхности сердца, впадает большинство собственных вен миокарда?", "images": [], "options": [{"text": "Vena cava superior", "images": []}, {"text": "Vena cordis magna", "images": []}, {"text": "Sinus coronarius", "images": []}, {"text": "Vena cava inferior", "images": []}], "rows": [], "correct": [2], "explanation": "", "source": "перенесено из другого теста (тот же вопрос)", "confidence": "moodle", "moodle_right": ""}, {"key": "cc3137d6863b", "type": "multichoice", "multiple": false, "text": "Какая крупная артерия отходит от дуги аорты второй по счету и направляется на шею для кровоснабжения левой половины головы и шеи?", "images": [], "options": [{"text": "Arteria subclavia sinistra", "images": []}, {"text": "Arteria carotis communis dextra", "images": []}, {"text": "Arteria carotis communis sinistra", "images": []}, {"text": "Truncus brachiocephalicus", "images": []}], "rows": [], "correct": [2], "explanation": "", "source": "скриншот разбора Moodle (photo_5330347997285522218)", "confidence": "photo", "moodle_right": ""}, {"key": "25cb3c967020", "type": "multichoice", "multiple": false, "text": "Укажите название непарного крупного артериального ствола, который отходит от брюшной аорты сразу под диафрагмой и делится на три ветви: селезеночную, общую печеночную и левую желудочную?", "images": [], "options": [{"text": "Truncus coeliacus", "images": []}, {"text": "Arteria mesentericа superior", "images": []}, {"text": "Arteria iliaca communis", "images": []}, {"text": "Arteria mesentericа inferior", "images": []}], "rows": [], "correct": [0], "explanation": "Чревный ствол, truncus coeliacus, — непарная висцеральная ветвь, отходящая от вентральной поверхности брюшной аорты на уровне XII грудного позвонка (сразу под диафрагмой) и делящаяся на левую желудочную, общую печеночную и селезеночную артерии.", "source": "0149_Лекция 4.3. Артерии большого круга кровообращения.pdf.txt:140,155-160 — «Чревный ствол, truncus coeliacus... разделяется на три артерии: левую желудочную, общую печеночную и селезеночную»", "confidence": "claude-high", "moodle_right": ""}, {"key": "8016b81d2af5", "type": "multichoice", "multiple": false, "text": "Какая ветвь отходит от дуги аорты первой по счету (справа налево)?", "images": [], "options": [{"text": "Arteria carotis communis sinistra", "images": []}, {"text": "Truncus brachiocephalicus", "images": []}, {"text": "Arteria subclavia sinistra", "images": []}, {"text": "Arteria coronaria dextra", "images": []}], "rows": [], "correct": [1], "explanation": "От дуги аорты справа налево отходят: 1) truncus brachiocephalicus, 2) a. carotis communis sinistra, 3) a. subclavia sinistra. Венечные артерии отходят не от дуги, а от восходящей аорты (bulbus aortae).", "source": "скриншот разбора Moodle (part8 №26: «вторая по счету» = a. carotis communis sinistra, значит первая — truncus brachiocephalicus) + 0149_Лекция 4.3. Артерии большого круга кровообращения.pdf.txt:28,66", "confidence": "claude-high", "moodle_right": ""}, {"key": "91e19a419b81", "type": "multichoice", "multiple": false, "text": "В какой венозный сосуд брюшной полости оттекает кровь от желчного пузыря, желудка и поджелудочной железы перед тем, как пройти барьерную очистку?", "images": [], "options": [{"text": "Vena portae hepatis", "images": []}, {"text": "Vena cava inferior", "images": []}, {"text": "Vena lumbalis", "images": []}, {"text": "Vena phrenica inferior", "images": []}], "rows": [], "correct": [0], "explanation": "", "source": "перенесено из другого теста (тот же вопрос)", "confidence": "moodle", "moodle_right": ""}, {"key": "4076ee8a66a2", "type": "multichoice", "multiple": false, "text": "Какая крупная артерия ложится в венечную борозду, огибает левый край сердца и отдает ветви к стенкам левого предсердия и левого желудочка?", "images": [], "options": [{"text": "Ramus marginalis dexter", "images": []}, {"text": "Ramus circumflexus", "images": []}, {"text": "Arteria coronaria dextra", "images": []}, {"text": "Ramus interventricularis posterior", "images": []}], "rows": [], "correct": [1], "explanation": "Огибающая ветвь левой венечной артерии, r. circumflexus, идет по венечной борозде налево, проходит под левым ушком, огибает левый край сердца и отдает ветви к стенке левого предсердия и левого желудочка.", "source": "0148_Лекция 4.2 Сердце. Круги кровообращения..pdf.txt:379-383 — «огибающую ветвь, r. circumflexus, которая сначала идет по венечной борозде налево, проходит под левым ушком... отдавая по пути многочисленные мышечные ветви к стенке левого предсердия и левого желудочка»", "confidence": "claude-high", "moodle_right": ""}, {"key": "bd69e6100d16", "type": "multichoice", "multiple": false, "text": "Как называется крупный парный венозный сосуд, который образуется при слиянии внутренней яремной и подключичной вен позади грудино-ключичного сустава?", "images": [], "options": [{"text": "Vena jugularis interna", "images": []}, {"text": "Vena brachiocephalica", "images": []}, {"text": "Vena subclavia", "images": []}, {"text": "Vena cava superior", "images": []}], "rows": [], "correct": [1], "explanation": "Плечеголовная вена, v. brachiocephalica (парная), образуется слиянием v. subclavia и v. jugularis interna; правая проходит почти вертикально позади грудино-ключичного сустава. V. cava superior — непарная, поэтому не подходит.", "source": "0150_Лекция 4.4. Вены большого круга кровообращения.pdf.txt:66-74 — «Плечеголовные вены, vv. brachiocephalicae (правая и левая)... образуется путем слияния подключичной и внутренней яремной вен... позади грудино-ключичного сустава»", "confidence": "claude-high", "moodle_right": ""}, {"key": "665ba4401a7e", "type": "multichoice", "multiple": false, "text": "Какая артерия предплечья проходит в лучевой борозде и в ее нижней третьей части часто используется для определения пульса, так как прилежит к лучевой кости?", "images": [], "options": [{"text": "Arteria radialis", "images": []}, {"text": "Arteria interossea communis", "images": []}, {"text": "Arteria ulnaris", "images": []}, {"text": "Arteria profunda brachii", "images": []}], "rows": [], "correct": [0], "explanation": "", "source": "перенесено из другого теста (тот же вопрос)", "confidence": "moodle", "moodle_right": ""}, {"key": "b9be9ec6f1bd", "type": "multichoice", "multiple": false, "text": "Слияние каких двух крупных венозных сосудов брюшной полости является главным источником формирования воротной вены?", "images": [], "options": [{"text": "Vena mesenterica superior et vena splenica", "images": []}, {"text": "Vena cava inferior et vena iliaca communis", "images": []}, {"text": "Vena mesenterica inferior et vena renalis", "images": []}, {"text": "Vena hepatica et vena phrenica inferior", "images": []}], "rows": [], "correct": [0], "explanation": "Воротная вена формируется позади головки поджелудочной железы при слиянии двух главных корней — верхней брыжеечной вены (v. mesenterica superior) и селезеночной вены (v. splenica/lienalis). Нижняя брыжеечная вена является корнем лишь в 1/3 случаев.", "source": "0150_Лекция 4.4. Вены большого круга кровообращения.pdf.txt:114-118 — «формируется позади головки поджелудочной железы после слияния двух наиболее значительных ее корней — 1. верхней брыжеечной вены... 2. селезеночной вены»", "confidence": "claude-high", "moodle_right": ""}, {"key": "fd010e5f7a0f", "type": "multichoice", "multiple": false, "text": "Какой магистральный венозный сосуд собирает кровь от непарных органов брюшной полости (желудка, кишечника, селезенки) и несет ее в печень?", "images": [], "options": [{"text": "Vena cava inferior", "images": []}, {"text": "Vena splenica", "images": []}, {"text": "Vena renalis", "images": []}, {"text": "Vena portae", "images": []}], "rows": [], "correct": [3], "explanation": "", "source": "скриншот разбора Moodle (photo_5330347997285522216)", "confidence": "photo", "moodle_right": ""}, {"key": "cf2770cb02f6", "type": "multichoice", "multiple": false, "text": "Какая структура (заслонка) частично прикрывает отверстие венечного синуса в месте его впадения в правое предсердие?", "images": [], "options": [{"text": "Valvula foraminis ovalis", "images": []}, {"text": "Cuspis anterior", "images": []}, {"text": "Valvula venae cavae inferioris", "images": []}, {"text": "Valvula sinus coronarii", "images": []}], "rows": [], "correct": [3], "explanation": "Устье венечного синуса в правом предсердии частично прикрыто заслонкой венечного синуса — valvula sinus coronarii (заслонка Тебезия). Valvula venae cavae inferioris (заслонка Евстахия) прикрывает отверстие нижней полой вены.", "source": "0080_Сердечнососудистая система.docx.txt:181 — «7 - устье венечного синуса; 8 - заслонка венечного синуса; 9 - заслонка нижней полой вены»", "confidence": "claude-high", "moodle_right": ""}, {"key": "a0be3547e781", "type": "multichoice", "multiple": false, "text": "Как называется участок аорты, расположенный в заднем средостении грудной полости?", "images": [], "options": [{"text": "Arcus aortae", "images": []}, {"text": "Aorta abdominalis", "images": []}, {"text": "Aorta ascendens", "images": []}, {"text": "Aorta thoracica", "images": []}], "rows": [], "correct": [3], "explanation": "Грудная часть аорты (pars thoracica aortae, aorta thoracica) лежит в заднем средостении, слева от тел V–VIII и спереди тел IX–XII грудных позвонков. Восходящая аорта и дуга относятся к верхнему/переднему средостению.", "source": "0149_Лекция 4.3. Артерии большого круга кровообращения.pdf.txt:83-89 — «Грудная часть аорты, pars thoracica aortae... лежит в заднем средостении»", "confidence": "claude-high", "moodle_right": ""}, {"key": "4465d95f569c", "type": "multichoice", "multiple": false, "text": "Какая крупная глубокая вена залегает в одноименной ямке позади коленного сустава?", "images": [], "options": [{"text": "Vena femoralis", "images": []}, {"text": "Vena iliaca externa", "images": []}, {"text": "Vena saphena magna", "images": []}, {"text": "Vena poplitea", "images": []}], "rows": [], "correct": [3], "explanation": "", "source": "перенесено из другого теста (тот же вопрос)", "confidence": "moodle", "moodle_right": ""}, {"key": "a874d085d08d", "type": "multichoice", "multiple": false, "text": "Миокард какой камеры сердца имеет наибольшую толщину, что связано с высокой гидравлической нагрузкой?", "images": [], "options": [{"text": "Atrium sinistrum", "images": []}, {"text": "Ventriculus sinister", "images": []}, {"text": "Ventriculus dexter", "images": []}, {"text": "Atrium dextrum", "images": []}], "rows": [], "correct": [1], "explanation": "", "source": "скриншот разбора Moodle (photo_5330347997285522204)", "confidence": "photo", "moodle_right": ""}, {"key": "c5b86deee8d5", "type": "multichoice", "multiple": false, "text": "Какая вена собирает кровь от верхних отделов левой стенки грудной полости, идет сверху вниз по левой стороне позвоночника и впадает в полунепарную вену (или непосредственно в непарную вену)?", "images": [], "options": [{"text": "Vena azygos", "images": []}, {"text": "Vena hemiazygos", "images": []}, {"text": "Vena brachiocephalica sinistra", "images": []}, {"text": "Vena hemiazygos accessoria", "images": []}], "rows": [], "correct": [3], "explanation": "Добавочная полунепарная вена, v. hemiazygos accessoria, формируется из 6–7 левых ВЕРХНИХ задних межреберных вен, идет сверху вниз по левой стороне позвоночника и впадает в полунепарную вену или, переходя вправо, — в непарную. Это ровно формулировка вопроса; сама v. hemiazygos формируется из левой восходящей поясничной вены (нижние отделы).", "source": "0080_Сердечнососудистая система.docx.txt:513 — «добавочная полунепарная (v. hemiazygos accessoria) формируется из 6-7 левых верхних задних межреберных вен, направляется сверху вниз и впадает в полунепарную вену или... в непарную»", "confidence": "claude-high", "moodle_right": ""}, {"key": "62ab89372f3c", "type": "multichoice", "multiple": false, "text": "Какая магистральная ветвь общей подвздошной артерии спускается в полость малого таза и обеспечивает кровоснабжение его стенок и органов?", "images": [], "options": [{"text": "Arteria iliaca interna", "images": []}, {"text": "Arteria iliaca externa", "images": []}, {"text": "Arteria femoralis", "images": []}, {"text": "Arteria obturatoria", "images": []}], "rows": [], "correct": [0], "explanation": "Внутренняя подвздошная артерия, a. iliaca interna, спускается в полость малого таза по его боковой стенке и своими париетальными и висцеральными ветвями кровоснабжает стенки и органы таза. A. iliaca externa уходит на нижнюю конечность.", "source": "0149_Лекция 4.3. Артерии большого круга кровообращения.pdf.txt:250-275 — «Внутренняя подвздошная артерия, a. iliaca interna, спускается по... Таким образом, a. iliaca interna снабжает кровью...»; 0080_Сердечнососудистая система.docx.txt:360", "confidence": "claude-high", "moodle_right": ""}, {"key": "37a3e2b1b976", "type": "multichoice", "multiple": false, "text": "Как называется крупная парная артерия, которая образуется при бифуркации брюшной аорты на уровне четвертого поясничного позвонка и идет до крестцово-подвздошного сустава?", "images": [], "options": [{"text": "Arteria iliaca externa", "images": []}, {"text": "Arteria iliaca interna", "images": []}, {"text": "Arteria iliaca communis", "images": []}, {"text": "Arteria sacralis mediana", "images": []}], "rows": [], "correct": [2], "explanation": "Общая подвздошная артерия, a. iliaca communis, — парная конечная ветвь брюшной аорты: начинается на уровне IV поясничного позвонка (бифуркация аорты) и идет до передней поверхности крестцово-подвздошного сустава, где делится на наружную и внутреннюю.", "source": "скриншот разбора Moodle (part7 №110 — тот же вопрос, ответ Arteria iliaca communis) + 0080_Сердечнососудистая система.docx.txt:355", "confidence": "claude-high", "moodle_right": ""}, {"key": "b89581f1ca69", "type": "multichoice", "multiple": false, "text": "Как называется вена нижней конечности, которая располагается на бедре?", "images": [], "options": [{"text": "Vena poplitea", "images": []}, {"text": "Vena saphena magna", "images": []}, {"text": "Vena iliaca interna", "images": []}, {"text": "Vena femoralis", "images": []}], "rows": [], "correct": [3], "explanation": "Бедренная вена, v. femoralis, — магистральная вена, расположенная именно на бедре: продолжение подколенной вены в приводящем канале, переходит в наружную подвздошную вену в сосудистой лакуне. V. saphena magna идет от стопы через всю конечность и впадает в бедренную, а v. poplitea лежит в подколенной ямке.", "source": "0080_Сердечнососудистая система.docx.txt:584 — «Бедренная вена (v. femoralis) одиночная, является продолжением подколенной вены, про <script>
"use strict";
const LS = "dentistry_trainer_v1";
const RU = "абвгдежзиклмнопрстуфхцшщэюя".split("");

// ---------- хранилище: лучшие результаты и ключи, внесённые вручную ----------
function store() {
  try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; }
}
function save(s) {
  try { localStorage.setItem(LS, JSON.stringify(s)); } catch (e) {}
}
function best(cmid) { return (store().best || {})[cmid] || null; }
function setBest(cmid, rec) {
  const s = store(); s.best = s.best || {};
  const old = s.best[cmid];
  if (!old || rec.pct > old.pct) { s.best[cmid] = rec; save(s); return true; }
  return false;
}
function userKeys() { return store().keys || {}; }
function setUserKey(qkey, correct) {
  const s = store(); s.keys = s.keys || {};
  if (correct === null) delete s.keys[qkey]; else s.keys[qkey] = correct;
  save(s);
}
// Откуда взялся правильный ответ — человеческим языком. Ответы Moodle точны,
// разметка Claude по учебнику может расходиться с ключом преподавателя.
function trust(conf) {
  if (conf === "moodle") return { t: "✔ Ответ из Moodle (ключ преподавателя)", cls: "ok" };
  if (conf === "photo") return { t: "✔ Ответ из разбора Moodle (скриншот)", cls: "ok" };
  if (conf === "claude-high") return { t: "Ответ Claude, подтверждён материалами курса", cls: "" };
  if (conf === "claude-medium") return { t: "⚠ Ответ Claude по классической анатомии — в материалах курса прямого подтверждения нет", cls: "warn" };
  if (conf === "claude-low") return { t: "⚠ Ответ Claude, есть сомнение — обязательно сверьте с лекцией", cls: "warn" };
  if (conf === "user") return { t: "Ответ отмечен вами", cls: "" };
  if (conf === "low") return { t: "⚠ ответ требует проверки по учебнику", cls: "warn" };
  return null;
}

// Правильные ответы вопроса: из ключа проекта (answers.json) или внесённые женой в браузере.
function keyOf(q) {
  const u = userKeys()[q.key];
  if (u) return { correct: u, explanation: q.explanation || "", source: q.source || "", confidence: "user" };
  if (q.correct != null) return { correct: q.correct, explanation: q.explanation || "", source: q.source || "", confidence: q.confidence || "" };
  return null;
}

// ---------- утилиты ----------
const el = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
// Node.append с несколькими аргументами поддерживается не всюду на мобильных,
// а строки он принимает иначе, чем appendChild. Этот помощник работает везде.
function add(parent) {
  for (let i = 1; i < arguments.length; i++) {
    const x = arguments[i];
    if (x == null) continue;
    parent.appendChild(typeof x === "string" ? document.createTextNode(x) : x);
  }
  return parent;
}
const app = document.getElementById("app");
function clear() { app.textContent = ""; }
function letter(i) { return RU[i] ? RU[i] + ")" : (i + 1) + ")"; }
function mmss(sec) {
  const m = Math.floor(Math.abs(sec) / 60), s = Math.abs(sec) % 60;
  return (sec < 0 ? "-" : "") + m + ":" + String(s).padStart(2, "0");
}
function shuffle(a) { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
function asSet(c) { return new Set(Array.isArray(c) ? c : [c]); }
function sameSet(a, b) { if (a.size !== b.size) return false; for (const x of a) if (!b.has(x)) return false; return true; }

// ---------- экран со списком тестов ----------
function screenHome() {
  clear();
  location.hash = "";
  const tests = window.TESTS || [];
  if (!tests.length) { add(app, el("p", "empty", "Нет данных. Запустите: python tools/build_trainer.py")); return; }
  const withKey = tests.reduce((n, t) => n + t.questions.filter(q => keyOf(q)).length, 0);
  const total = tests.reduce((n, t) => n + t.questions.length, 0);
  const sum = el("div", "card");
  const sumRow = el("div", "row");
  add(sumRow, 
    el("span", "pill", "вопросов: " + total),
    el("span", "pill " + (withKey === total ? "ok" : "warn"), "с правильным ответом: " + withKey),
    el("span", "pill", "тестов: " + tests.length));
  add(sum, sumRow);
  add(app, sum);

  for (const group of ["Тренировочные", "Итоговые"]) {
    const list = tests.filter(t => t.group === group);
    if (!list.length) continue;
    add(app, el("h2", "group", group));
    const grid = el("div", "grid");
    for (const t of list) {
      const c = el("div", "card test-card");
      add(c, el("h3", null, t.title));
      const m = el("div", "meta");
      const nk = t.questions.filter(q => keyOf(q)).length;
      add(m, el("span", null, t.questions.length ? t.questions.length + " вопр." : "вопросы ещё не собраны"));
      if (t.questions.length) add(m, el("span", null, "ключ: " + nk + "/" + t.questions.length));
      add(m, el("span", null, t.minutes + " мин."));
      const b = best(t.cmid);
      if (b) add(m, el("span", null, "лучший: " + b.pct + "%"));
      add(c, m);
      const row = el("div", "row");
      const learn = el("button", "primary", "Учить");
      const exam = el("button", null, "Экзамен");
      if (!t.questions.length) { learn.disabled = exam.disabled = true; }
      learn.onclick = () => screenQuiz(t, "learn");
      exam.onclick = () => screenQuiz(t, "exam");
      add(row, learn, exam);
      add(c, row);
      add(grid, c);
    }
    add(app, grid);
  }
  const hint = el("div", "setkey");
  hint.innerHTML = "<b>Режим «Учить»</b> — сразу показывает, верно или нет, правильный ответ и пояснение. " +
    "<b>«Экзамен»</b> — таймер как в Moodle, ответы только в конце. " +
    "Где правильный ответ ещё не отмечен, в режиме «Учить» есть кнопка <b>«Это правильный ответ»</b> — отметка сохранится в браузере.";
  add(app, hint);
}

// ---------- экран прохождения ----------
function screenQuiz(test, mode, subset) {
  const order = subset || shuffle(test.questions.map((_, i) => i));
  const st = { test, mode, order, i: 0, picked: new Map(), checked: new Set(), t0: Date.now(),
               left: test.minutes * 60, timer: null };
  if (mode === "exam") {
    st.timer = setInterval(() => {
      st.left--;
      const tv = document.getElementById("timer");
      if (tv) { tv.textContent = mmss(st.left); tv.classList.toggle("low", st.left <= 60); }
      if (st.left <= 0) { clearInterval(st.timer); st.timer = null; finish(st); }
    }, 1000);
  }
  renderQ(st);
}

function stop(st) { if (st.timer) { clearInterval(st.timer); st.timer = null; } }

function renderQ(st) {
  clear();
  const q = st.test.questions[st.order[st.i]];
  const k = keyOf(q);
  const shown = st.checked.has(q.key) && st.mode === "learn";

  const bar = el("div", "bar");
  const left = el("div", "row");
  const back = el("button", "sm", "← К тестам");
  back.onclick = () => { stop(st); screenHome(); };
  add(left, back, el("span", "pill", st.mode === "learn" ? "Учить" : "Экзамен"));
  add(bar, left);
  const right = el("div", "row");
  add(right, el("span", null, (st.i + 1) + " / " + st.order.length));
  if (st.mode === "exam") { const t = el("span", "timer", mmss(st.left)); t.id = "timer"; add(right, t); }
  add(bar, right);
  add(app, bar);

  const pr = el("div", "progress"); const fill = el("i");
  fill.style.width = ((st.i) / st.order.length * 100) + "%"; add(pr, fill); add(app, pr);

  const c = el("div", "card");
  add(c, el("div", "qnum", "Вопрос " + (st.i + 1) + (q.multiple ? " · выберите все верные" : "")));
  add(c, el("p", "qtext", q.text));
  for (const src of q.images || []) { const im = el("img", "qimg"); im.src = src.startsWith("http") ? src : ""; im.alt = ""; add(c, im); }

  const pick = st.picked.get(q.key) || new Set();
  q.options.forEach((o, oi) => {
    const b = el("button", "opt");
    add(b, el("span", "l", letter(oi)));
    const t = el("span", "t", o.text);
    for (const src of o.images || []) { const im = el("img", "qimg"); im.src = src.startsWith("http") ? src : ""; add(t, im); }
    add(b, t);
    if (pick.has(oi)) b.classList.add("chosen");
    if (shown && k) {
      const right = asSet(k.correct).has(oi);
      if (right) { b.classList.add("right"); add(b, el("span", "mark", "✅")); }
      else if (pick.has(oi)) { b.classList.add("wrong"); add(b, el("span", "mark", "❌")); }
    }
    b.onclick = () => {
      if (shown) return;
      const s = st.picked.get(q.key) || new Set();
      if (q.multiple) { s.has(oi) ? s.delete(oi) : s.add(oi); }
      else { s.clear(); s.add(oi); }
      st.picked.set(q.key, s);
      // «Учить»: одиночный выбор проверяется сразу, как только нажала вариант
      if (st.mode === "learn" && !q.multiple && k) st.checked.add(q.key);
      renderQ(st);
    };
    add(c, b);
  });

  // Пояснение — только после проверки в режиме «Учить»
  if (shown && k) {
    const n = el("div", "note");
    const ok = sameSet(asSet(k.correct), pick);
    const h = el("div", null, (ok ? "✅ Верно. " : "❌ Неверно. ") + "Правильный ответ: " +
      [...asSet(k.correct)].sort((a, b) => a - b).map(i => letter(i) + " " + q.options[i].text).join("; "));
    add(n, h);
    if (k.explanation) add(n, el("div", null, k.explanation));
    if (k.source) add(n, el("span", "src", "Источник: " + k.source));
    const tr = trust(k.confidence);
    if (tr) { const s = el("span", "src " + tr.cls, tr.t); add(n, s); }
    add(c, n);
  }
  // Ключа нет — предлагаем отметить правильный вариант
  if (st.mode === "learn" && !k) {
    const n = el("div", "note nokey");
    add(n, el("div", null, "Правильный ответ для этого вопроса пока не отмечен."));
    if (pick.size) {
      const b = el("button", "sm", "Это правильный ответ (" + [...pick].sort().map(letter).join(" ") + ")");
      b.onclick = () => { setUserKey(q.key, [...pick]); st.checked.add(q.key); renderQ(st); };
      add(n, b);
    } else {
      add(n, el("span", "src", "Выберите вариант, который считаете верным, и нажмите «Это правильный ответ»."));
    }
    add(c, n);
  }
  add(app, c);

  const nav = el("div", "nav");
  const prev = el("button", null, "← Назад");
  prev.disabled = st.i === 0;
  prev.onclick = () => { st.i--; renderQ(st); };
  const rightNav = el("div", "row");
  if (st.mode === "learn" && q.multiple && k && !shown) {
    const ch = el("button", "primary", "Проверить");
    ch.disabled = !pick.size;
    ch.onclick = () => { st.checked.add(q.key); renderQ(st); };
    add(rightNav, ch);
  }
  const next = el("button", st.i === st.order.length - 1 ? "primary" : null,
                  st.i === st.order.length - 1 ? "Завершить и посмотреть разбор" : "Далее →");
  next.onclick = () => {
    if (st.i === st.order.length - 1) { stop(st); finish(st); }
    else { st.i++; renderQ(st); }
  };
  add(rightNav, next);
  add(nav, prev, rightNav);
  add(app, nav);
}

// ---------- разбор после теста ----------
function finish(st) {
  stop(st);
  const res = st.order.map(idx => {
    const q = st.test.questions[idx];
    const k = keyOf(q);
    const pick = st.picked.get(q.key) || new Set();
    const graded = !!k;
    const ok = graded && sameSet(asSet(k.correct), pick);
    return { q, k, pick, graded, ok };
  });
  const graded = res.filter(r => r.graded);
  const nOk = graded.filter(r => r.ok).length;
  const pct = graded.length ? Math.round(nOk / graded.length * 100) : 0;
  const secs = Math.round((Date.now() - st.t0) / 1000);
  const isBest = graded.length ? setBest(st.test.cmid, { pct, ok: nOk, of: graded.length, secs, at: Date.now() }) : false;
  screenReview(st, res, { nOk, pct, secs, graded: graded.length, isBest });
}

function screenReview(st, res, sc) {
  clear();
  const bar = el("div", "bar");
  const back = el("button", "sm", "← К тестам");
  back.onclick = screenHome;
  add(bar, back, el("span", "pill", st.test.title));
  add(app, bar);

  const head = el("div", "card");
  const score = el("div", "score");
  add(score, 
    document.createTextNode(sc.graded ? sc.nOk + " / " + sc.graded : "—"),
    el("small", null, sc.graded ? "  · " + sc.pct + "%" : " нет отмеченных правильных ответов"));
  add(head, score);
  const m = el("div", "meta");
  add(m, el("span", null, "время: " + mmss(sc.secs)));
  add(m, el("span", null, "вопросов: " + res.length));
  const ungraded = res.length - sc.graded;
  if (ungraded) add(m, el("span", null, "без ключа: " + ungraded));
  const b = best(st.test.cmid);
  if (b) add(m, el("span", null, "лучший результат: " + b.pct + "%"));
  if (sc.isBest) add(m, el("span", null, "🏅 новый лучший результат"));
  add(head, m);

  const tools = el("div", "row noprint");
  const onlyBad = el("label", "chk");
  const cb = el("input"); cb.type = "checkbox";
  add(onlyBad, cb, document.createTextNode("только ошибки"));
  add(tools, onlyBad);
  const wrongIdx = res.map((r, i) => r.graded && !r.ok ? st.order[i] : -1).filter(i => i >= 0);
  const again = el("button", "sm", "Прорешать ошибки заново (" + wrongIdx.length + ")");
  again.disabled = !wrongIdx.length;
  again.onclick = () => screenQuiz(st.test, "learn", wrongIdx);
  const retry = el("button", "sm", "Пройти тест заново");
  retry.onclick = () => screenQuiz(st.test, st.mode);
  add(tools, again, retry);
  add(head, tools);
  add(app, head);

  const list = el("div", "card");
  res.forEach((r, n) => {
    const d = el("div", "rev-q");
    if (r.graded && r.ok) d.dataset.ok = "1";
    const h = el("div", "rev-head");
    add(h, el("span", "ico", r.graded ? (r.ok ? "✅" : "❌") : "•"));
    add(h, el("span", "qnum", "Вопрос " + (n + 1)));
    add(d, h);
    add(d, el("p", "qtext", r.q.text));
    for (const src of r.q.images || []) { const im = el("img", "qimg"); im.src = src.startsWith("http") ? src : ""; add(d, im); }

    const mine = [...r.pick].sort((a, b) => a - b);
    const lineMine = el("div", "ans-line");
    add(lineMine, 
      el("b", null, "Ваш ответ: "),
      document.createTextNode(mine.length ? mine.map(i => letter(i) + " " + r.q.options[i].text).join("; ") : "не отвечено"));
    add(d, lineMine);
    if (r.k) {
      const lineRight = el("div", "ans-line");
      add(lineRight, 
        el("b", null, "Правильный ответ: "),
        document.createTextNode([...asSet(r.k.correct)].sort((a, b) => a - b)
          .map(i => letter(i) + " " + r.q.options[i].text).join("; ")));
      add(d, lineRight);
      const tr2 = trust(r.k.confidence);
      if (r.k.explanation || r.k.source || tr2) {
        const n2 = el("div", "note" + (tr2 && tr2.cls === "warn" ? " nokey" : ""));
        if (r.k.explanation) add(n2, el("div", null, r.k.explanation));
        if (r.k.source) add(n2, el("span", "src", "Источник: " + r.k.source));
        if (tr2) add(n2, el("span", "src " + tr2.cls, tr2.t));
        add(d, n2);
      }
    } else {
      add(d, el("div", "note nokey", "Правильный ответ не отмечен — пройдите этот вопрос в режиме «Учить» и отметьте верный вариант."));
    }
    add(list, d);
  });
  add(app, list);
  cb.onchange = () => {
    list.querySelectorAll('.rev-q[data-ok="1"]').forEach(x => x.classList.toggle("hidden", cb.checked));
  };
}

// ---------- печать ключа «вопрос → правильный ответ» ----------
function screenPrint() {
  clear();
  const bar = el("div", "bar noprint");
  const back = el("button", "sm", "← К тестам"); back.onclick = screenHome;
  const go = el("button", "sm primary", "Печать");
  go.onclick = () => window.print();
  add(bar, back, go, el("span", "pill", "ключ: вопрос → правильный ответ"));
  add(app, bar);
  for (const t of window.TESTS || []) {
    if (!t.questions.length) continue;
    const c = el("div", "card");
    add(c, el("h2", "group", t.title));
    t.questions.forEach((q, i) => {
      const k = keyOf(q);
      const d = el("div", "rev-q");
      add(d, el("p", "qtext", (i + 1) + ". " + q.text));
      if (k) {
        const line = el("div", "ans-line");
        add(line, 
          el("b", null, "Ответ: "),
          document.createTextNode([...asSet(k.correct)].sort((a, b) => a - b)
            .map(j => letter(j) + " " + q.options[j].text).join("; ")));
        add(d, line);
        if (k.explanation) add(d, el("div", "ans-line", k.explanation));
      } else {
        add(d, el("div", "ans-line", "Ответ: ___________________"));
      }
      add(c, d);
    });
    add(app, c);
  }
}

// ---------- запуск ----------
// Ошибку показываем на самой странице: в просмотрщиках Telegram/почты консоли нет,
// и без этого экран просто остаётся пустым, непонятно почему.
function fatal(msg) {
  const d = document.getElementById("app") || document.body;
  d.textContent = "";
  const c = el("div", "card");
  add(c, el("h3", null, "Не удалось запустить тренажёр"));
  add(c, el("p", null, String(msg).slice(0, 400)));
  add(c, el("p", "empty", "Откройте файл в обычном браузере (Safari или Chrome), " +
    "а не во встроенном просмотрщике Telegram: кнопка «Поделиться» → «Открыть в Safari»."));
  add(d, c);
}
window.onerror = function (m, src, line) { fatal(m + " (строка " + line + ")"); };

// Проверка перед запуском: если данные не подгрузились, объяснить человеку, а не молчать.
if (typeof window.TESTS === "undefined") {
  fatal("Файл открылся без данных о вопросах. Похоже, скачалась только часть файла — " +
        "попросите прислать его заново и дождитесь полной загрузки.");
}

try {
  const bp = document.getElementById("btn-print");
  if (bp) bp.onclick = screenPrint;
  const bt = document.getElementById("btn-theme");
  if (bt) bt.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : cur === "light" ? "" : "dark";
    if (next) document.documentElement.setAttribute("data-theme", next);
    else document.documentElement.removeAttribute("data-theme");
  };
  screenHome();
} catch (e) {
  fatal((e && e.message) || e);
}
</script>
</body>
</html>
