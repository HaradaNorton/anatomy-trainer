<style>
:root {
  color-scheme: light;  /* не давать телефону в ночном режиме перекрашивать страницу */
  --bg: #f6f5f2; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1db;
  --accent: #2f5d8a; --accent-ink: #ffffff; --ok: #1f7a4d; --ok-bg: #e5f4ec; --bad: #b3261e; --bad-bg: #fbe9e7;
  --warn: #8a5a00; --warn-bg: #fff3d6; --sel: #e8eef6;
}
/* Тёмная тема отключена намеренно: учить удобнее по светлому,
   а телефон в ночном режиме делал страницу тёмной без спроса. */
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 80px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
header.top h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
header.top .sub { color: var(--muted); font-size: 14px; }
button, .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 14px;
  border-radius: 8px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.sm { padding: 5px 10px; font-size: 14px; }
button:disabled { opacity: .45; cursor: not-allowed; }
h2.group { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 26px 0 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.test-card h3 { font-size: 16px; margin: 0 0 6px; line-height: 1.3; }
.meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--sel); color: var(--ink); }
.pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.timer { font-variant-numeric: tabular-nums; font-weight: 600; }
.timer.low { color: var(--bad); }
.progress { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 16px; }
.progress > i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.qnum { color: var(--muted); font-size: 14px; margin-bottom: 6px; }
.qtext { font-size: 18px; font-weight: 500; margin: 0 0 14px; }
.qimg { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); margin: 6px 0 12px; background: #fff; }
.opt { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 8px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--card); }
.opt .l { font-weight: 600; color: var(--muted); min-width: 1.4em; }
.opt .t { flex: 1; }
.opt.chosen { background: var(--sel); border-color: var(--accent); }
.opt.right { background: var(--ok-bg); border-color: var(--ok); }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
.opt .mark { font-weight: 700; }
.opt.right .mark { color: var(--ok); } .opt.wrong .mark { color: var(--bad); }
.note { border-left: 3px solid var(--accent); background: var(--sel); border-radius: 0 8px 8px 0; padding: 10px 14px; margin: 12px 0 0; font-size: 15px; }
.note .src { display: block; color: var(--muted); font-size: 13px; margin-top: 6px; }
.note .src.ok { color: var(--ok); font-weight: 500; }
.note .src.warn { color: var(--warn); font-weight: 500; }
.note.nokey { border-color: var(--warn); background: var(--warn-bg); }
.nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.score { font-size: 42px; font-weight: 700; letter-spacing: -0.02em; }
.score small { font-size: 18px; font-weight: 500; color: var(--muted); }
.rev-q { border-top: 1px solid var(--line); padding: 18px 0; }
.rev-q:first-of-type { border-top: 0; }
.rev-head { display: flex; gap: 8px; align-items: baseline; margin-bottom: 8px; }
.rev-head .ico { font-size: 18px; }
.ans-line { margin: 4px 0; font-size: 15px; }
.ans-line b { font-weight: 600; }
.hidden { display: none !important; }
.setkey { border: 1px dashed var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 12px; font-size: 14px; color: var(--muted); }
.setkey b { color: var(--ink); }
label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); cursor: pointer; }
.empty { color: var(--muted); font-style: italic; }
.ans-line.expl { color: var(--muted); font-size: 14px; }
@page { margin: 14mm 12mm; }
@media print {
  body { background: #fff; font-size: 11pt; }
  .noprint, header.top, .nav, .progress, .bar, .setkey, .row, .meta { display: none !important; }
  .card { border: 0; box-shadow: none; padding: 0; margin: 0 0 6mm; background: none; }
  /* вопрос не должен разрываться между страницами PDF */
  .rev-q { border: 0; box-shadow: none; padding: 0 0 3mm; margin: 0; break-inside: avoid; page-break-inside: avoid; }
  .wrap { max-width: none; padding: 0; }
  h2.group { break-before: page; page-break-before: always; font-size: 13pt; color: #000;
             border-bottom: 1px solid #999; padding-bottom: 2mm; margin: 0 0 4mm; }
  .card:first-of-type h2.group, .card h2:first-child { break-before: auto; page-break-before: auto; }
  .qtext { font-size: 11pt; font-weight: 600; margin: 0 0 1mm; color: #000; }
  .ans-line { font-size: 11pt; margin: 0; color: #000; }
  .ans-line.expl { font-size: 9.5pt; color: #555; }
  .note { border-left: 2px solid #999; background: none; padding: 1mm 0 1mm 3mm; margin: 1mm 0 0; font-size: 9.5pt; }
  .opt { border: 0; padding: 2px 0; margin: 0; background: none !important; }
  .opt:not(.right) { display: none; }
  .print-key { display: block !important; }
}
.print-key { display: none; }
</style>

<script>
window.TESTS = [{"cmid": "27824", "folder": "01_kraniologiya", "title": "Тестирование по краниологии", "minutes": 20, "group": "Тренировочные", "questions": [{"key": "0bf331949b10", "type": "multichoice", "multiple": false, "text": "Укажите структуры, образующие нижнюю стенку полости носа", "images": [], "options": [{"text": "небный отросток верхней челюсти, горизонтальная пластинка небной кости", "images": []}, {"text": "носовая часть лобной кости, решетчатая пластинка решетчатой кости, носовые кости", "images": []}, {"text": "лобный отросток и носовая поверхность тела верхней челюсти, слезная кость, лабиринт решетчатой кости, перпендикулярная пластинка небной кости, медиальная пластинка крыловидного отростка клиновидной кости", "images": []}, {"text": "перпендикулярная пластинка решетчатой кости, сошник", "images": []}], "rows": [], "correct": [0], "explanation": "Нижнюю стенку (дно) полости носа формирует верхняя поверхность костного нёба, то есть нёбные отростки верхних челюстей и горизонтальные пластинки нёбных костей. Материалы курса дословно: «Нижнюю стенку, или дно полости носа, формирует верхняя поверхность костного нёба»; на рисунке нижней стенки подписаны «1 - нёбный отросток верхней челюсти ... 5 - горизонтальная пластинка нёбной кости».", "source": "материалы курса", "confidence": "claude-high", "moodle_right": ""}, {"key": "cdc5ce71e3ff", "type": "multichoice", "multiple": false, "text": "Между малым крылом и большим крылом клиновидной кости располагается", "images": [], "options": [{"text": "canalis opticus", "images": []}, {"text": "foramen rotundum", "images": []}, {"text": "fissura orbitalis superior", "images": []}, {"text": "fossa pterygoidea", "images": []}], "rows": [], "correct": [2], "explanation": "Между малым и большим крыльями клиновидной кости лежит верхняя глазничная щель. Ключ Moodle: «Какое щелевидное образование, расположенное между малыми и большими крыльями клиновидной кости, соединяет среднюю черепную ямку с глазницей?» — Правильный ответ: fissura orbitalis superior. Canalis opticus проходит в малом крыле, foramen rotundum — в большом, fossa pterygoidea — между пластинками крыловидного отростка.", "source": "ключ Moodle из итогового теста", "confidence": "claude-high", "moodle_right": ""}, {"key": "e6f870e0e43b", "type": "multichoice", "multiple": false, "text": "Основными частями клиновидной кости являются", "images": [], "options": [{"text": "ala minor, ala major, сorpus, processus pterygoidei", "images": []}, {"text": "сorpus, ala major, ala major, processus zygomaticus", "images": []}, {"text": "сorpus, processus pterygoidei, processus zygomaticus", "images": []}, {"text": "processus alveolaris, processus palatinus, сorpus", "images": []}, {"text": "clivus, ala minor, ala major, processus pterygoidei", "images": []}, {"text": "sinus sphenoidalis, processus pterygoidei, ala major", "images": []}, {"text": "fossa hypophysialis, processus frontalis, processus zygomaticus", "images": []}], "rows": [], "correct": [0], "explanation": "Материалы курса дословно: «В кости выделяют 4 части: тело и 3 пары отростков, из которых 2 пары направлены латерально и носят название малых и больших крыльев. Третья пара отростков (крыловидные) обращена книзу» — то есть corpus, ala minor, ala major, processus pterygoidei. Clivus и sinus sphenoidalis — не части, а образования кости; processus zygomaticus у клиновидной кости отсутствует.", "source": "материалы курса", "confidence": "claude-high", "moodle_right": ""}, {"key": "16a78d469704", "type": "multichoice", "multiple": false, "text": "Укажите структуры, расположенные на медиальной стенке глазницы", "images": [], "options": [{"text": "fissura orbitalis superior", "images": []}, {"text": "canalis infraorbitalis", "images": []}, {"text": "foramen ethmoidale anterius et posterius", "images": []}, {"text": "fossa glandulae lacrimalis", "images": []}, {"text": "foramen zygomaticoorbitale", "images": []}, {"text": "foramen zygomaticofaciale", "images": []}, {"text": "fissura orbitalis inferior", "images": []}], "rows": [], "correct": [2], "explanation": "На медиальной стенке глазницы лежат переднее и заднее решётчатые отверстия. Ключ Moodle: «Через какие парные отверстия на медиальной стенке глазницы осуществляется ее сообщение с ячейками решётчатого лабиринта и полостью носа?» — Правильный ответ: foramina ethmoidalia anterius et posterius. Fissura orbitalis superior и fossa glandulae lacrimalis относятся к верхней стенке, foramina zygomatica и fissura orbitalis inferior — к латеральной и нижней.", "source": "ключ Moodle из итогового теста", "confidence": "claude-high", "moodle_right": ""}, {"key": "275f0a64eeea", "type": "multichoice", "multiple": false, "text": "В какой фазе открывания рта происходит выход discus articularis и caput mandibulae на суставной бугорок, и в каких этажах сустава это движение осуществляется?", "images": [], "options": [{"text": "равномерно во всех фазах", "images": []}, {"text": "в третьей фазе в верхнем этаже", "images": []}, {"text": "во второй фазе одновременно в обоих этажах сустава", "images": []}, {"text": "в первой фазе в обоих этажах", "images": []}, {"text": "в первой фазе только в нижнем этаже", "images": []}, {"text": "только в нижнем этаже во всех фазах", "images": []}], "rows": [], "correct": [1], "explanation": "Опускание нижней челюсти идёт в три фазы: ротация головки в нижнем этаже, затем скольжение диска вместе с головкой по скату суставного бугорка в верхнем этаже, затем максимальное опускание. Выход discus articularis и caput mandibulae на суставной бугорок — это третья фаза, и совершается она в верхнем этаже. Материалы курса: «При значительном движении вокруг фронтальной оси в верхнем этаже сустава происходит скольжение головки вместе с диском по ямке и скату бугорка вниз и вперед».", "source": "материалы курса + классическая анатомия", "confidence": "claude-medium", "moodle_right": ""}, {"key": "b4e7fb0018a8", "type": "multichoice", "multiple": false, "text": "Какие кости ограничивают полость рта спереди и с боков?", "images": [], "options": [{"text": "Processus pterygoideus и нёбная кость, processus alveolaris maxillae", "images": []}, {"text": "Только верхняя челюсть полностью", "images": []}, {"text": "Corpus maxillae, processus alveolaris maxillae и альвеолярные отростки нижней челюсти, нёбные отростки верхних челюстей и горизонтальные пластины нёбных костей", "images": []}, {"text": "Vomer и решетчатая кость, альвеолярные отростки нижней челюсти, нёбные отростки верхних челюстей и горизонтальные пластины нёбных костей", "images": []}, {"text": "Клиновидная кость и её крыловидные отростки, corpus maxillae, processus alveolaris maxillae", "images": []}], "rows": [], "correct": [2], "explanation": "Спереди и с боков полость рта ограничивают тела и альвеолярные отростки верхних челюстей вместе с альвеолярной частью нижней челюсти, сверху — костное нёбо (нёбные отростки верхних челюстей и горизонтальные пластинки нёбных костей). Только этот вариант содержит corpus maxillae и альвеолярные отростки обеих челюстей без лишних структур: vomer и решётчатая кость относятся к полости носа, а крыловидные отростки ограничивают полость рта сзади, а не спереди и с боков.", "source": "материалы курса + классическая анатомия", "confidence": "claude-medium", "moodle_right": ""}, {"key": "804474f625c7", "type": "multichoice", "multiple": false, "text": "Укажите структуры, образующие медиальную стенку подвисочной ямки", "images": [], "options": [{"text": "скуловой дугой и ветвью нижней челюсти", "images": []}, {"text": "височной поверхностью скуловой кости", "images": []}, {"text": "латеральной пластинкой крыловидного отростка клиновидной кости", "images": []}, {"text": "скуловой дугой", "images": []}, {"text": "теменной, лобной костями, чешуей височной кости и большим крылом клиновидной кости", "images": []}, {"text": "бугром верхней челюсти", "images": []}, {"text": "височной костью и большим крылом клиновидной кости", "images": []}], "rows": [], "correct": [2], "explanation": "Ключ Moodle: «Какая костная структура ограничивает подвисочную ямку (fossa infratemporalis) с медиальной стороны?» — Правильный ответ: lamina lateralis processus pterygoidei. Латеральная пластинка крыловидного отростка обращена в подвисочную ямку и образует её медиальную стенку; скуловая дуга и ветвь нижней челюсти — латеральная стенка, бугор верхней челюсти — передняя, большое крыло клиновидной кости — верхняя.", "source": "ключ Moodle из итогового теста", "confidence": "claude-high", "moodle_right": ""}, {"key": "4a8037c2ff1d", "type": "multichoice", "multiple": false, "text": "Укажите структуры, расположенные на передней поверхности тела верхней челюсти", "images": [], "options": [{"text": "tuber maxillae", "images": []}, {"text": "processus frontalis", "images": []}, {"text": "sulcus infraorbitalis", "images": []}, {"text": "hiatus maxillaris", "images": []}, {"text": "juga alveolaria", "images": []}, {"text": "foramen infraorbitale", "images": []}, {"text": "alveoli dentales", "images": []}], "rows": [], "correct": [5], "explanation": "Материалы курса о передней поверхности верхней челюсти: «Ниже подглазничного края находится подглазничное отверстие (foramen infraorbitale), через которое выходят одноименные сосуды и нервы». Tuber maxillae лежит на подвисочной поверхности, hiatus maxillaris — на носовой, sulcus infraorbitalis — на глазничной, а juga alveolaria и alveoli dentales принадлежат альвеолярному отростку, а не передней поверхности тела.", "source": "материалы курса", "confidence": "claude-high", "moodle_right": ""}, {"key": "a7d510f5b862", "type": "multichoice", "multiple": false, "text": "Укажите шов, расположенный между двумя теменными костями черепа", "images": [], "options": [{"text": "sutura squamosa", "images": []}, {"text": "sutura sagittalis", "images": []}, {"text": "sutura coronalis", "images": []}, {"text": "sutura lambdoidea", "images": []}], "rows": [], "correct": [1], "explanation": "Материалы курса дословно: «соединения теменных костей между собой образуют сагиттальный шов (sutura sagittalis)». Венечный шов — между лобной и теменными костями, ламбдовидный — между затылочной и теменными, чешуйчатый — между чешуёй височной и теменной костью.", "source": "материалы курса", "confidence": "claude-high", "moodle_right": ""}, {"key": "bb45c45d5578", "type": "multichoice", "multiple": false, "text": "Местом начала сонного канала на височной кости является", "images": [], "options": [{"text": "hiatus canalis n. Petrosi majoris", "images": []}, {"text": "apertura externa canalis carotici", "images": []}, {"text": "fissura tympanosquamosa", "images": []}, {"text": "meatus acusticus internus", "images": []}, {"text": "hiatus canalis nervi petrosi minoris", "images": []}, {"text": "apertura interna canalis carotici", "images": []}, {"text": "meatus acusticus externus", "images": []}], "rows": [], "correct": [1], "explanation": "Материалы курса: «Впереди от яремной ямки определяется широкое отверстие, ведущее в сонный канал (canalis caroticus). Это наружная апертура сонного канала (apertura externa canalis carotici)». Канал начинается наружной апертурой на нижней поверхности пирамиды и заканчивается внутренней апертурой у верхушки пирамиды близ рваного отверстия.", "source": "материалы курса", "confidence": "claude-high", "moodle_right": ""}, {"key": "141486131288", "type": "multichoice", "multiple": false, "text": "Укажите отросток верхней челюсти, который является продолжением ее тела книзу", "images": [], "options": [{"text": "processus zygomaticus", "images": []}, {"text": "processus pterygoidei", "images": []}, {"text": "processus palatinus", "images": []}, {"text": "tuber maxillae", "images": []}, {"text": "processus alveolaris", "images": []}, {"text": "processus frontalis", "images": []}, {"text": "foramen infraorbitale", "images": []}], "rows": [], "correct": [4], "explanation": "Материалы курса дословно об альвеолярном отростке: «Он является как бы продолжением тела верхней челюсти книзу и представляет собой дугообразно изогнутый костный валик, выпуклостью обращенный кпереди». Processus pterygoidei принадлежит клиновидной кости, нёбный отросток направлен медиально, лобный — вверх, скуловой — латерально.", "source": "материалы курса", "confidence": "claude-high", "moodle_right": ""}, {"key": "5bb47a666760", "type": "multichoice", "multiple": false, "text": "Выберите одно правильное утверждение", "images": [], "options": [{"text": "Lamina cribrosa решетчатой кости содержит foramen rotundum", "images": []}, {"text": "Fossa hypophysialis расположена в задней части турецкого седла", "images": []}, {"text": "Impressiones digitatae находятся на внутренней поверхности крыши черепа вдоль сагиттального шва", "images": []}, {"text": "Sulcus sinus sigmoidei располагается на внутренней поверхности височных костей и сосцевидного угла теменной кости", "images": []}, {"text": "Crista frontalis находится на внутренней поверхности затылочной кости", "images": []}, {"text": "Sulcus prechiasmaticus поперечно расположен на дне средней черепной ямки", "images": []}], "rows": [], "correct": [3], "explanation": "Материалы курса о теменной кости: «В области сосцевидного угла проходит борозда сигмовидного синуса», и о височной: «На внутренней поверхности сосцевидного отростка имеется S-образно искривленная борозда сигмовидного синуса» — утверждение верно. Остальные ложны: в lamina cribrosa нет foramen rotundum (оно в большом крыле клиновидной кости); fossa hypophysialis лежит на дне, а не в задней части турецкого седла; вдоль сагиттального шва идёт борозда верхнего сагиттального синуса, а не impressiones digitatae; crista frontalis — на лобной, а не затылочной кости; sulcus prechiasmaticus расположен на клиновидной кости кпереди от турецкого седла, у границы с передней черепной ямкой.", "source": "материалы курса", "confidence": "claude-high", "moodle_right": ""}, {"key": "56f9e2e6feff", "type": "multichoice", "multiple": false, "text": "Какое движение нижней челюсти происходит вокруг фронтальной оси, и какие фазы оно включает при максимальном выполнении?", "images": [], "options": [{"text": "laterotrusion dextra — движение вправо, ротация в нижнем этаже, скольжение диска и головки по tuberculum articulare, максимальное опускание", "images": []}, {"text": "protrusio с одновременной rotatione", "images": []}, {"text": "depressio mandibulae в трёх фазах: ротация в нижнем этаже, скольжение диска и головки по tuberculum articulare, максимальное опускание", "images": []}, {"text": "rotatio dextrorsa — ротация в правую сторону", "images": []}, {"text": "translatio mandibulae — смещение вперёд, скольжение диска и головки по tuberculum articulare", "images": []}, {"text": "elevatio mandibulae в обратном порядке", "images": []}], "rows": [], "correct": [2], "explanation": "Вокруг фронтальной (поперечной) оси происходит опускание и поднимание нижней челюсти — depressio mandibulae. Материалы курса: «вокруг фронтальной оси — опускание и поднимание нижней челюсти». При максимальном опускании выделяют три фазы: ротация в нижнем этаже, скольжение диска с головкой по tuberculum articulare, максимальное опускание. Laterotrusio и rotatio совершаются вокруг вертикальной оси, protrusio/translatio — сагиттальное смещение вперёд.", "source": "материалы курса + классическая анатомия", "confidence": "claude-high", "moodle_right": ""}, {"key": "1ebb5a2615e3", "type": "multichoice", "multiple": false, "text": "К костям мозгового отдела черепа относятся", "images": [], "options": [{"text": "os parietale, os ethmoidale, os occipitale", "images": []}, {"text": "os frontale, os temporale, mandibula", "images": []}, {"text": "mandibula, os zygomaticum, os ethmoidale", "images": []}, {"text": "maxilla, vomer, concha nasalis inferior", "images": []}], "rows": [], "correct": [0], "explanation": "К мозговому отделу черепа относятся лобная, теменные, затылочная, клиновидная, решётчатая и височные кости — в этом варианте все три структуры (os parietale, os ethmoidale, os occipitale) мозговые. В остальных вариантах присутствуют кости лицевого отдела: mandibula, os zygomaticum, maxilla, vomer, concha nasalis inferior.", "source": "материалы курса + классическая анатомия", "confidence": "claude-high", "moodle_right": ""}, {"key": "74fbc6014ddb", "type": "multichoice", "multiple": false, "text": "Укажите структуры, расположенные на глазничной поверхности тела верхней челюсти", "images": [], "options": [{"text": "processus frontalis", "images": []}, {"text": "alveoli dentales", "images": []}, {"text": "hiatus maxillaris", "images": []}, {"text": "foramen infraorbitale", "images": []}, {"text": "sulcus infraorbitalis", "images": []}, {"text": "tuber maxillae", "images": []}, {"text": "juga alveolaria", "images": []}], "rows": [], "correct": [4], "explanation": "Материалы курса о глазничной поверхности: «От середины заднего края глазничной поверхности тянется вперед подглазничная борозда (sulcus infraorbitalis), которая переходит в одноименный канал, открывающийся подглазничным отверстием». Само foramen infraorbitale открывается уже на передней поверхности, hiatus maxillaris — на носовой, tuber maxillae — на подвисочной, alveoli dentales и juga alveolaria — на альвеолярном отростке.", "source": "материалы курса", "confidence": "claude-high", "moodle_right": ""}, {"key": "9ff2783a7bfb", "type": "multichoice", "multiple": false, "text": "Укажите структуры, образующие верхнюю стенку полости носа", "images": [], "options": [{"text": "носовая часть лобной кости, решетчатая пластинка решетчатой кости, носовые кости", "images": []}, {"text": "небный отросток верхней челюсти, горизонтальная пластинка небной кости", "images": []}, {"text": "лобный отросток и носовая поверхность тела верхней челюсти, слезная кость, лабиринт решетчатой кости, перпендикулярная пластинка небной кости, медиальная пластинка крыловидного отростка клиновидной кости", "images": []}, {"text": "перпендикулярная пластинка решетчатой кости, сошник", "images": []}], "rows": [], "correct": [0], "explanation": "Материалы курса дословно: «Верхнюю стенку, или крышу полости носа, образуют внутренняя поверхность носовых костей, носовая часть лобной кости, решётчатая пластинка решётчатой кости и тело клиновидной кости». Третий вариант описывает латеральную стенку, четвёртый — перегородку носа, первый в списке — дно.", "source": "материалы курса", "confidence": "claude-high", "moodle_right": ""}, {"key": "51d5070fd967", "type": "multichoice", "multiple": false, "text": "Ближе к верхушке пирамиды расположена", "images": [], "options": [{"text": "fossula petrosa", "images": []}, {"text": "processus mastoideus", "images": []}, {"text": "apertura interna canalis carotici", "images": []}, {"text": "processus styloideus", "images": []}, {"text": "apertura inferior canaliculi tympanici", "images": []}, {"text": "foramen stylomastoideum", "images": []}, {"text": "fossa jugularis", "images": []}], "rows": [], "correct": [2], "explanation": "Ключ Moodle: «Какое анатомическое образование находится на верхушке пирамиды височной кости вблизи рваного отверстия (foramen lacerum)?» — Правильный ответ: apertura interna canalis carotici. Внутренняя апертура сонного канала открывается именно у верхушки пирамиды, тогда как fossa jugularis, fossula petrosa, processus styloideus и processus mastoideus лежат в задней части нижней поверхности пирамиды, то есть ближе к её основанию.", "source": "ключ Moodle из итогового теста", "confidence": "claude-high", "moodle_right": ""}, {"key": "fb8a2d828508", "type": "multichoice", "multiple": false, "text": "Какие два анатомических отверстия располагаются в большом крыле клиновидной кости на наружном основании черепа?", "images": [], "options": [{"text": "Foramen lacerum и foramen ovale", "images": []}, {"text": "Foramen rotundum и foramen opticus", "images": []}, {"text": "Foramen ovale и foramen spinosum", "images": []}, {"text": "Foramen stylomastoideum и foramen mastoideum", "images": []}, {"text": "Foramen magnum и foramen jugulare", "images": []}, {"text": "Foramen infraorbitale и foramen zygomaticofaciale", "images": []}], "rows": [], "correct": [2], "explanation": "На наружном основании черепа в большом крыле клиновидной кости видны овальное и остистое отверстия; на рисунке наружного основания в материалах курса подписаны «6 - овальное отверстие; 7 - остистое отверстие». Ключ Moodle подтверждает оба: foramen ovale — выход n. mandibularis из средней черепной ямки в подвисочную, foramen spinosum — вход a. meningea media. Foramen rotundum ведёт в крыловидно-нёбную ямку и на наружном основании не просматривается, а foramen lacerum образовано клиновидной, височной и затылочной костями.", "source": "ключ Moodle из итогового теста + материалы курса", "confidence": "claude-high", "moodle_right": ""}, {"key": "0ec9d84ce66d", "type": "multichoice", "multiple": false, "text": "Какая костная линия на большом крыле клиновидной кости разграничивает височную ямку от подвисочной ямки?", "images": [], "options": [{"text": "Linea temporalis superior", "images": []}, {"text": "Crista galli", "images": []}, {"text": "Linea nuchalis inferior", "images": []}, {"text": "Sulcus infratemporalis", "images": []}, {"text": "Crista infratemporalis", "images": []}], "rows": [], "correct": [4], "explanation": "Ключ Moodle: «Какое анатомическое образование большого крыла клиновидной кости (ala major ossis sphenoidalis) разграничивает между собой височную и подвисочную ямки?» — Правильный ответ: crista infratemporalis. Linea temporalis лежит на теменной кости и ограничивает височную ямку сверху, crista galli — на решётчатой, linea nuchalis inferior — на затылочной.", "source": "ключ Moodle из итогового теста", "confidence": "claude-high", "moodle_right": ""}, {"key": "1e8dcdd43f3a", "type": "multichoice", "multiple": false, "text": "Какое парное костное образование располагается на латеральной стенке полости носа и образует верхний носовой ход?", "images": [], "options": [{"text": "Concha nasalis inferior", "images": []}, {"text": "Processus uncinatus", "images": []}, {"text": "Concha nasalis media", "images": []}, {"text": "Concha nasalis suprema", "images": []}, {"text": "Concha nasalis superior и concha nasalis media", "images": []}], "rows": [], "correct": [4], "explanation": "Материалы курса: «Верхний носовой ход расположен между верхней и средней раковинами». Вопрос просит парные костные образования латеральной стенки, образующие верхний носовой ход, — это обе ограничивающие его раковины: concha nasalis superior и concha nasalis media (обе относятся к лабиринту решётчатой кости). Concha nasalis suprema — непостоянная четвёртая раковина.", "source": "материалы курса", "confidence": "claude-medium", "moodle_right": ""}, {"key": "06e1e547002a", "type": "multichoice", "multiple": false, "text": "Укажите анатомические образования, расположенные на нижней поверхности латеральных частей затылочной кости", "images": [], "options": [{"text": "protuberantia occipitalis interna", "images": []}, {"text": "crista occipitalis externa", "images": []}, {"text": "sulcus sinus petrosi inferioris", "images": []}, {"text": "condylus occipitalis", "images": []}, {"text": "incisura jugularis", "images": []}, {"text": "linea nuchalis superior", "images": []}, {"text": "tuberculum pharyngeum", "images": []}], "rows": [], "correct": [3], "explanation": "Материалы курса о латеральной части затылочной кости: «а на нижней поверхности - затылочный мыщелок (condylus occipitalis), которым череп соединяется с I шейным позвонком». Protuberantia occipitalis interna и sulcus sinus petrosi inferioris лежат на внутренней поверхности, crista occipitalis externa и linea nuchalis superior — на наружной поверхности чешуи, tuberculum pharyngeum — на базилярной части, incisura jugularis — на латеральном крае.", "source": "материалы курса", "confidence": "claude-high", "moodle_right": ""}, {"key": "f60b287e0c75", "type": "multichoice", "multiple": false, "text": "На сосцевидном отростке височной кости находятся", "images": [], "options": [{"text": "apertura interna canalis carotici", "images": []}, {"text": "fossula petrosa", "images": []}, {"text": "processus styloideus", "images": []}, {"text": "fossa jugularis", "images": []}, {"text": "impressio trigemini", "images": []}, {"text": "sulcus sinus petrosi inferioris", "images": []}, {"text": "sulcus arteriae occipitalis", "images": []}], "rows": [], "correct": [6], "explanation": "Материалы курса: «Кнутри от верхушки сосцевидного отростка находятся 2 параллельно расположенные борозды. Медиально проходит борозда затылочной артерии (sulcus a. occipitalis)». Processus styloideus, fossa jugularis, fossula petrosa и apertura interna canalis carotici расположены на нижней поверхности пирамиды, impressio trigemini — на передней поверхности пирамиды, sulcus sinus petrosi inferioris — вдоль заднего края пирамиды.", "source": "материалы курса", "confidence": "claude-high", "moodle_right": ""}, {"key": "3e77b1b63eaa", "type": "multichoice", "multiple": false, "text": "Между какими структурами располагается fissura orbitalis superior?", "images": [], "options": [{"text": "Между медиальной пластинкой и латеральной пластинкой клиновидной кости", "images": []}, {"text": "Между пирамидой височной кости и затылочной костью", "images": []}, {"text": "Между малым крылом и телом клиновидной кости", "images": []}, {"text": "Между лобной костью и нёбной костью", "images": []}, {"text": "Между верхней челюстью и скуловой костью", "images": []}, {"text": "Между большим и малым крыльями клиновидной кости", "images": []}], "rows": [], "correct": [5], "explanation": "Ключ Moodle: «Какое щелевидное образование, расположенное между малыми и большими крыльями клиновидной кости, соединяет среднюю черепную ямку с глазницей?» — Правильный ответ: fissura orbitalis superior. Значит щель лежит между большим и малым крыльями клиновидной кости. Промежуток между малым крылом и телом — это место зрительного канала.", "source": "ключ Moodle из итогового теста", "confidence": "claude-high", "moodle_right": ""}, {"key": "22f715606e88", "type": "multichoice", "multiple": false, "text": "Крыловидно-небная ямка сообщается со средней черепной ямкой через", "images": [], "options": [{"text": "foramen sphenopalatinum", "images": []}, {"text": "canalis pterygoideus", "images": []}, {"text": "canalis palatinus major", "images": []}, {"text": "foramen rotundum", "images": []}, {"text": "fissura pterygomaxillaris", "images": []}, {"text": "crista infratemporalis", "images": []}, {"text": "fissura orbitalis inferior", "images": []}], "rows": [], "correct": [3], "explanation": "Ключ Moodle содержит дословно тот же вопрос: «Через какое отверстие крыловидно-нёбная ямка (fossa pterygopalatina) сообщается со средней черепной ямкой (fossa cranii media)?» — Правильный ответ: foramen rotundum (в нём проходит n. maxillaris). Foramen sphenopalatinum ведёт в полость носа, canalis pterygoideus — к рваному отверстию, canalis palatinus major — в полость рта, fissura pterygomaxillaris — в подвисочную ямку, fissura orbitalis inferior — в глазницу.", "source": "ключ Moodle из итогового теста", "confidence": "claude-high", "moodle_right": ""}, {"key": "f701d3c63ef4", "type": "multichoice", "multiple": false, "text": "На какой кости располагается fossa mandibularis для прикрепления мыщелка нижней челюсти?", "images": [], "options": [{"text": "На ветви нижней челюсти", "images": []}, {"text": "На височной кости в переднем отделе пирамиды", "images": []}, {"text": "На верхней челюсти", "images": []}, {"text": "На нёбной кости", "images": []}, {"text": "На затылочной кости", "images": []}, {"text": "На теменной кости", "images": []}], "rows": [], "correct": [1], "explanation": "Нижнечелюстная ямка находится на височной кости, на нижней поверхности основания скулового отростка, кнаружи от пирамиды. Материалы курса: «Кнаружи от пирамиды височной кости видна нижнечелюстная ямка, а кпереди от нее - суставной бугорок». С ней сочленяется головка мыщелкового отростка нижней челюсти.", "source": "материалы курса", "confidence": "claude-high", "moodle_right": ""}, {"key": "69882456dd27", "type": "multichoice", "multiple": false, "text": "Укажите образование, расположенное у нижнего края тела нижней челюсти с обеих сторон от срединной линии", "images": [], "options": [{"text": "fossa digastrica", "images": []}, {"text": "linea mylohyoidea", "images": []}, {"text": "fovea sublingualis", "images": []}, {"text": "protuberantia mentalis", "images": []}, {"text": "foramen mentale", "images": []}, {"text": "tuberositas pterygoidea", "images": []}, {"text": "fovea submandibularis", "images": []}], "rows": [], "correct": [0], "explanation": "Материалы курса: «Ниже и латеральнее подбородочной ости определяется двубрюшная ямка (fossa digastrica), в которой начинается двубрюшная мышца» — она парная и лежит у нижнего края тела по обе стороны от срединной линии. Fovea sublingualis расположена над двубрюшной ямкой, fovea submandibularis — под челюстно-подъязычной линией на уровне 5-7-го зуба, foramen mentale — на уровне 5-го зуба, а protuberantia mentalis лежит по срединной линии, а не по бокам от неё.", "source": "материалы курса", "confidence": "claude-high", "moodle_right": ""}, {"key": "9c5ccbd33d27", "type": "multichoice", "multiple": false, "text": "Какой углубленный костный участок располагается на дне средней черепной ямки и служит ложем для гипофиза?", "images": [], "options": [{"text": "Tuberculum sellae только", "images": []}, {"text": "Fossa interpeduncularis", "images": []}, {"text": "Sulcus caroticus", "images": []}, {"text": "Sella turcica с fossa hypophysialis", "images": []}, {"text": "Sulcus prechiasmaticus", "images": []}, {"text": "Impressiones digitatae", "images": []}], "rows": [], "correct": [3], "explanation": "Ключ Moodle: «Какая анатомическая ямка располагается на дне турецкого седла (sella turcica) и служит вместилищем для железы внутренней секреции?» — fossa hypophysialis; и «Какое костное образование составляет центральную часть средней черепной ямки?» — sella turcica. Вопрос спрашивает углублённый участок дна средней ямки, служащий ложем гипофиза, — это турецкое седло с гипофизарной ямкой.", "source": "ключ Moodle из итогового теста", "confidence": "claude-high", "moodle_right": ""}, {"key": "8bbad2e6b61e", "type": "multichoice", "multiple": false, "text": "Зрительный канал располагается на", "images": [], "options": [{"text": "ala major os sphenoidale", "images": []}, {"text": "corpus os sphenoidale", "images": []}, {"text": "processus pterygoideus os sphenoidale", "images": []}, {"text": "ala minor os sphenoidale", "images": []}], "rows": [], "correct": [3], "explanation": "Зрительный канал пронизывает основание (корень) малого крыла клиновидной кости у места его соединения с телом и продолжает предперекрестную борозду. Ключ Moodle подтверждает ход канала: «Через какой парный канал, продолжающийся из предперекрестной борозды (sulcus prechiasmaticus), выходит зрительный нерв?» — canalis opticus. В большом крыле лежат foramen rotundum, ovale и spinosum, поэтому ala minor, а не ala major.", "source": "материалы курса + классическая анатомия", "confidence": "claude-medium", "moodle_right": ""}, {"key": "c8d7975014d8", "type": "multichoice", "multiple": false, "text": "Укажите отверстие, расположенное на теле нижней челюсти на уровне второго малого коренного зуба", "images": [], "options": [{"text": "foramen mentale", "images": []}, {"text": "foramen zygomaticotemporale", "images": []}, {"text": "foramen infraorbitale", "images": []}, {"text": "foramen mandibulae", "images": []}, {"text": "alveoli dentales", "images": []}, {"text": "fovea pterygoidea", "images": []}, {"text": "foramen spinosum", "images": []}], "rows": [], "correct": [0], "explanation": "Материалы курса: «Кнаружи от каждого бугорка расположено подбородочное отверстие (foramen mentale) — выходное отверстие канала нижней челюсти... Наиболее часто это отверстие расположено на уровне 5-го зуба». Пятый зуб и есть второй малый коренной (второй премоляр). Foramen mandibulae лежит на внутренней поверхности ветви, а не на теле; foramen infraorbitale — на верхней челюсти.", "source": "материалы курса", "confidence": "claude-high", "moodle_right": ""}, {"key": "cf1f493af288", "type": "multichoice", "multiple": false, "text": "Какие парные костные раковины ограничивают средний носовой ход?", "images": [], "options": [{"text": "Concha nasalis inferior и processus uncinatus", "images": []}, {"text": "Concha nasalis media и сoncha nasalis inferior", "images": []}, {"text": "Concha nasalis superior и сoncha nasalis media", "images": []}, {"text": "Concha nasalis superior и верхняя стенка полости носа", "images": []}], "rows": [], "correct": [1], "explanation": "Материалы курса дословно: «Средний носовой ход лежит между нижней и средней раковинами». Значит его ограничивают concha nasalis media и concha nasalis inferior. Верхняя и средняя раковины ограничивают верхний носовой ход.", "source": "материалы курса", "confidence": "claude-high", "moodle_right": ""}]}, {"cmid": "27876", "folder": "02_myshtsy_golovy_i_shei", "title": "Тестирование по мышцам головы и шеи", "minutes": 20, "group": "Тренировочные", "questions": [{"key": "3f0df8c33948", "type": "multichoice", "multiple": false, "text": "Назовите мышцу, которая начинается от челюстно-подъязычной линии нижней челюсти", "images": [], "options": [{"text": "platysma", "images": []}, {"text": "m. sternothyroideus", "images": []}, {"text": "m. sternocleidomastoideus", "images": []}, {"text": "m. mylohyoideus", "images": []}, {"text": "m. sternohyoideus", "images": []}, {"text": "m. digastricus", "images": []}, {"text": "m. omohyoideus", "images": []}, {"text": "m. rectus capitis posterior major", "images": []}, {"text": "mm. scaleni anterior, medius et posterior", "images": []}, {"text": "m. rectus capitis anterior", "images": []}], "rows": [], "correct": [3], "explanation": "", "source": "скриншот разбора Moodle (photo_...498)", "confidence": "photo", "moodle_right": ""}, {"key": "936464d47713", "type": "multichoice", "multiple": false, "text": "Определите клетчаточное пространство шеи, которое располагается между внутришейной фасцией (№ 4) и предпозвоночной пластинкой собственной фасции шеи (№ 5). Распространяется от основания черепа и сообщается с клетчаткой заднего средостения. Верхний отдел пространства носит название «заглоточное пространство», spatium retropharyngeale", "images": [], "options": [{"text": "spatium submandibulare", "images": []}, {"text": "spatium interscalenum", "images": []}, {"text": "spatium retroviscerale", "images": []}, {"text": "spatium previscerale", "images": []}, {"text": "spatium antescalenum", "images": []}, {"text": "spatium prevertebrale", "images": []}, {"text": "spatium interaponeuroticum cervicale laterale", "images": []}, {"text": "spatium interaponeuroticum suprasternale", "images": []}], "rows": [], "correct": [2], "explanation": "Внутришейная фасция (fascia endocervicalis) имеет париетальную и висцеральную пластинки, между которыми выделяют передний отдел — spatium previscerale и задний — spatium retroviscerale; задний сообщается с задним средостением, а вверху продолжается в заглоточное пространство. Источник прямо указывает: «задний - позадивисцеральное пространство (spatium retroviscerale). Эти пространства сообщаются, соответственно, с передним и задним средостением».", "source": "0074_Мышцы и фасции шеи.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "4621ad1de728", "type": "multichoice", "multiple": false, "text": "Назовите мышцу, которая опускает угол рта", "images": [], "options": [{"text": "m. orbicularis oculi", "images": []}, {"text": "m. depressor anguli oris", "images": []}, {"text": "m. buccinator", "images": []}, {"text": "m. levator labii superioris", "images": []}, {"text": "m. corrugator supercilii", "images": []}, {"text": "m. orbicularis oris", "images": []}, {"text": "m. procerus", "images": []}, {"text": "m. levator anguli oris", "images": []}, {"text": "m. depressor labii inferioris", "images": []}, {"text": "m. occipitofrontalis", "images": []}], "rows": [], "correct": [1], "explanation": "«Мышца, опускающая угол рта (m. depressor angulus oris), начинается от передней поверхности основания нижней челюсти… Функция: опускает угол рта». Антагонист — m. levator anguli oris (тянет угол рта кверху).", "source": "0073_Мышцы и фасции лица.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "be102184cfbe", "type": "multichoice", "multiple": false, "text": "Какая мышца начинается от facies infratemporalis alae majoris и facies externa laminae lateralis processus pterygoideus и прикрепляется к fovea pterygoidea mandibulae?", "images": [], "options": [{"text": "m. buccinator", "images": []}, {"text": "m. temporalis", "images": []}, {"text": "m. pterygoideus lateralis", "images": []}, {"text": "m. mylohyoideus", "images": []}, {"text": "m. pterygoideus medialis", "images": []}, {"text": "m. masseter", "images": []}], "rows": [], "correct": [2], "explanation": "", "source": "перенесено из другого теста (тот же вопрос)", "confidence": "moodle", "moodle_right": ""}, {"key": "0dfcd996b7e4", "type": "multichoice", "multiple": false, "text": "Какая мышца осуществляет жевательные движения, смещая боковые стенки щеки внутрь рта?", "images": [], "options": [{"text": "m. risorius", "images": []}, {"text": "m. orbicularis oris", "images": []}, {"text": "m. mentalis", "images": []}, {"text": "m. buccinator", "images": []}, {"text": "m. levator labii superioris", "images": []}, {"text": "m. depressor labii inferioris", "images": []}], "rows": [], "correct": [3], "explanation": "Щечная мышца (m. buccinator) лежит в толще щеки: «при двустороннем сокращении прижимает щеки к зубам и растягивает ротовую щель». Именно она при жевании смещает боковые стенки щеки внутрь рта, подавая пищевой комок под зубы.", "source": "0073_Мышцы и фасции лица.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "529bad6bf94e", "type": "multichoice", "multiple": false, "text": "Назовите мышцу, которая поднимает угол рта", "images": [], "options": [{"text": "m. levator anguli oris", "images": []}, {"text": "m. depressor labii inferioris", "images": []}, {"text": "m. occipitofrontalis", "images": []}, {"text": "m. levator labii superioris", "images": []}, {"text": "m. orbicularis oris", "images": []}, {"text": "m. corrugator supercilii", "images": []}, {"text": "m. orbicularis oculi", "images": []}, {"text": "m. buccinator", "images": []}, {"text": "m. procerus", "images": []}, {"text": "m. depressor anguli oris", "images": []}], "rows": [], "correct": [0], "explanation": "", "source": "перенесено из другого теста (тот же вопрос)", "confidence": "moodle", "moodle_right": ""}, {"key": "af946c6bdfe1", "type": "multichoice", "multiple": false, "text": "Определите фасцию, которая состоит из двух листков — висцерального, который, охватывая каждый органовы, образует для них капсулу, и париетального, который охватывает все органы шеи в совокупности и образует влагалище для важных сосудов — a. carotis communis et v. jugularis interna", "images": [], "options": [{"text": "lamina profunda fasciae cervicalis propriae", "images": []}, {"text": "fascia endocervicalis", "images": []}, {"text": "fascia prevertebralis", "images": []}, {"text": "fascia cervicalis superficialis", "images": []}, {"text": "lamina superficialis fasciae cervicalis propriae", "images": []}], "rows": [], "correct": [1], "explanation": "«Внутришейная фасция (fascia endocervicalis) выстилает органы шеи. В ней различают две пластинки: пристеночную (париетальную), которая… образует влагалище для общей сонной артерии и внутренней яремной вены, и висцеральную, образующую фасциальные влагалища для органов шеи» — полное совпадение с описанием в вопросе.", "source": "0074_Мышцы и фасции шеи.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "24b3081aed25", "type": "multichoice", "multiple": false, "text": "Назовите мышцу, которая поднимает бровь", "images": [], "options": [{"text": "m. occipitofrontalis", "images": []}, {"text": "m. orbicularis oculi", "images": []}, {"text": "m. procerus", "images": []}, {"text": "m. orbicularis oris", "images": []}, {"text": "m. corrugator supercilii", "images": []}, {"text": "m. levator labii superioris", "images": []}], "rows": [], "correct": [0], "explanation": "Лобное брюшко (venter frontalis) затылочно-лобной мышцы (m. occipitofrontalis) «начинается от сухожильного шлема и прикрепляется к коже лица в области бровей», поднимая брови и собирая кожу лба в поперечные складки. Остальные варианты бровь либо опускают (procerus, corrugator), либо не связаны с бровью.", "source": "0073_Мышцы и фасции лица.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "ec51ae50c0d4", "type": "multichoice", "multiple": false, "text": "Какие мышцы входят в состав m. occipitofrontalis и какое действие они производят?", "images": [], "options": [{"text": "только venter frontalis, поднимает брови", "images": []}, {"text": "venter frontalis и venter occipitalis (соединённые galea aponeurotica), поднимает брови и тянет скальп назад", "images": []}, {"text": "только апоневроз, натягивает кожу головы", "images": []}, {"text": "m. platysma и m. sternocleidomastoideus, оттягивает скальп", "images": []}, {"text": "м. epicranius и m. scaleni, поворачивает голову", "images": []}, {"text": "только venter occipitalis, запрокидывает голову", "images": []}], "rows": [], "correct": [1], "explanation": "«Шлем является апоневрозом затылочно-лобной мышцы (m. occipitofrontalis), состоящей из двух брюшек»: venter frontalis (к коже бровей — поднимает брови) и venter occipitalis (от верхней выйной линии к сухожильному шлему — тянет шлем/скальп назад). Вариант с одним только брюшком или с platysma неверен.", "source": "0073_Мышцы и фасции лица.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "99c09014bab6" es": []}, {"text": "смещение челюсти в сторону", "images": []}], "rows": [], "correct": [3], "explanation": "", "source": "перенесено из другого теста (тот же вопрос)", "confidence": "moodle", "moodle_right": ""}, {"key": "b99c0f0f679a", "type": "multichoice", "multiple": false, "text": "Какие границы имеет spatium submandibulare?", "images": [], "options": [{"text": "только платизма", "images": []}, {"text": "lamina superficialis и profunda f. cervicalis propria, corpus mandibulae, gl. submandibularis, a. et v. facialis", "images": []}, {"text": "только m. buccinator", "images": []}, {"text": "только mandibula сверху", "images": []}, {"text": "только corpus adiposum buccae снизу", "images": []}, {"text": "только m. mylohyoideus", "images": []}], "rows": [], "correct": [1], "explanation": "Поднижнечелюстное клетчаточное пространство ограничено расщеплением собственной фасции шеи (lamina superficialis и lamina profunda f. cervicalis propria), которое над подъязычной костью образует влагалище поднижнечелюстной слюнной железы, и телом нижней челюсти; в пространстве лежат gl. submandibularis и a. et v. facialis. В материалах курса описано само фасциальное влагалище железы, но термин spatium submandibulare и перечень границ не даны — остальные варианты заведомо неполны (одна структура).", "source": "0074_Мышцы и фасции шеи.docx.txt + классическая топографическая анатомия", "confidence": "claude-medium", "moodle_right": ""}, {"key": "5f7f24c42855", "type": "multichoice", "multiple": false, "text": "Назовите мышцу, которая закрывает ротовую щель", "images": [], "options": [{"text": "m. mentalis", "images": []}, {"text": "m. sternohyoideus", "images": []}, {"text": "m. stylohyoideus", "images": []}, {"text": "m. risorius", "images": []}, {"text": "m. masseter", "images": []}, {"text": "m. buccinator", "images": []}, {"text": "m. pterygoideus lateralis", "images": []}, {"text": "m. hyoglossus", "images": []}, {"text": "m. orbicularis oris", "images": []}, {"text": "m. depressor labii inferioris", "images": []}], "rows": [], "correct": [8], "explanation": "«Круговая мышца рта (m. orbicularis oris) располагается вокруг ротового отверстия в толще губ… Функция: закрывает рот, вытягивает губы вперёд». Мышца расположена циркулярно, поэтому суживает (закрывает) отверстие.", "source": "0073_Мышцы и фасции лица.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "af7b4f6178f8", "type": "multichoice", "multiple": false, "text": "Назовите мышцу, которая, воздействуя на височно-нижнечелюстной сустав, опускает нижнюю челюсть", "images": [], "options": [{"text": "m. corrugator supercilii", "images": []}, {"text": "m. orbicularis oris", "images": []}, {"text": "m. temporalis", "images": []}, {"text": "m. pterygoideus medidlis", "images": []}, {"text": "m. mentalis", "images": []}, {"text": "m. masseter", "images": []}, {"text": "m. pterygoideus lateralis", "images": []}, {"text": "m. digastricus", "images": []}, {"text": "m. hyoglossus", "images": []}, {"text": "m. levator anguli oris", "images": []}], "rows": [], "correct": [6], "explanation": "", "source": "скриншот разбора Moodle (photo_...504)", "confidence": "photo", "moodle_right": ""}, {"key": "6e0ad32deb80", "type": "multichoice", "multiple": false, "text": "Назовите мышцу, которая вызывает смещение брови вниз и медиально", "images": [], "options": [{"text": "m. depressor anguli oris", "images": []}, {"text": "m. orbicularis oculi", "images": []}, {"text": "m. occipitofrontalis", "images": []}, {"text": "m. procerus", "images": []}, {"text": "m. corrugator supercilii", "images": []}, {"text": "m. orbicularis oris", "images": []}], "rows": [], "correct": [4], "explanation": "«Мышца, сморщивающая бровь (m. corrugator supercilii)… идет наискось по направлению книзу и медиально; прикрепляется к коже бровей. Функция: сморщивает брови, образует продольные складки между ними» — то есть смещает бровь вниз и медиально. M. procerus опускает кожу надпереносья (поперечные складки), а не бровь.", "source": "0073_Мышцы и фасции лица.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "5e96db6cd72a", "type": "multichoice", "multiple": false, "text": "Назовите мышцу, которая осуществляет движение в атланто-затылочном суставе", "images": [], "options": [{"text": "m. omohyoideus", "images": []}, {"text": "m. mylohyoideus", "images": []}, {"text": "m. sternocleidomastoideus", "images": []}, {"text": "mm. scaleni anterior, medius et posterior", "images": []}, {"text": "m. sternothyroideus", "images": []}, {"text": "m. rectus capitis anterior", "images": []}, {"text": "platysma", "images": []}, {"text": "m. obliquus capitis inferior", "images": []}, {"text": "m. sternohyoideus", "images": []}, {"text": "m. digastricus", "images": []}], "rows": [], "correct": [5], "explanation": "«Передняя прямая мышца головы (m. rectus capitis anterior)… начинается от поперечного отростка атланта, прикрепляется к базилярной части затылочной кости. Функция: наклоняет голову вперёд» — то есть действует именно в атланто-затылочном суставе. M. obliquus capitis inferior перекидывается между атлантом и осевым позвонком, то есть работает в атлантоосевом (не атланто-затылочном) суставе.", "source": "0074_Мышцы и фасции шеи.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "e783ae88ab05", "type": "multichoice", "multiple": false, "text": "Какая мышца начинается от facies posterior manubrium sterni и прикрепляется к corpus ossis hyoidei?", "images": [], "options": [{"text": "m. sternohyoideus", "images": []}, {"text": "m. digastricus", "images": []}, {"text": "m. omohyoideus", "images": []}, {"text": "m. mylohyoideus", "images": []}, {"text": "m. sternothyroideus", "images": []}, {"text": "m. thyrohyoideus", "images": []}], "rows": [], "correct": [0], "explanation": "«Грудино-подъязычная мышца (m. sternohyoideus) начинается от внутренней поверхности рукоятки грудины, грудинного конца ключицы, идет вверх; прикрепляется к нижнему краю тела подъязычно  interaponeuroticum suprasternale", "images": []}, {"text": "spatium interscalenum", "images": []}, {"text": "spatium interaponeuroticum cervicale laterale", "images": []}, {"text": "spatium submandibulare", "images": []}, {"text": "spatium prevertebrale", "images": []}, {"text": "spatium previscerale", "images": []}, {"text": "spatium retroviscerale", "images": []}], "rows": [], "correct": [1], "explanation": "", "source": "перенесено из другого теста (тот же вопрос)", "confidence": "moodle", "moodle_right": ""}, {"key": "339563c19120", "type": "multichoice", "multiple": false, "text": "Назовите мышцу, которая при сокращении с одной стороны наклоняет голову в эту же сторону и одновременно поворачивает ее в противоположную; при сокращении обеих мышц, голова запрокидывается", "images": [], "options": [{"text": "platysma", "images": []}, {"text": "m. digastricus", "images": []}, {"text": "m. mylohyoideus", "images": []}, {"text": "m. rectus capitis anterior", "images": []}, {"text": "mm. scaleni anterior, medius et posterior", "images": []}, {"text": "m. sternocleidomastoideus", "images": []}, {"text": "m. omohyoideus", "images": []}, {"text": "m. sternohyoideus", "images": []}, {"text": "m. rectus capitis posterior major", "images": []}, {"text": "m. sternothyroideus", "images": []}], "rows": [], "correct": [5], "explanation": "", "source": "перенесено из другого теста (тот же вопрос)", "confidence": "moodle", "moodle_right": ""}, {"key": "deff81584a3c", "type": "multichoice", "multiple": false, "text": "Какие две части образуют m. digastricus?", "images": [], "options": [{"text": "pars superficialis и pars profunda", "images": []}, {"text": "venter anterior и venter posterior", "images": []}, {"text": "pars anterior и pars posterior", "images": []}, {"text": "caput longum и caput breve", "images": []}, {"text": "pars medialis и pars lateralis", "images": []}, {"text": "caput superiorum и caput inferiorum", "images": []}], "rows": [], "correct": [1], "explanation": "", "source": "перенесено из другого теста (тот же вопрос)", "confidence": "moodle", "moodle_right": ""}, {"key": "bb117b758b89", "type": "multichoice", "multiple": false, "text": "Определите клетчаточное пространство шеи, которое располагается в области бокового треугольника шеи между поверхностной (№ 2) и предпозвоночной (№ 5) пластинками собственной фасции шеи. Книзу пространство сообщается с клетчаткой подмышечной впадины", "images": [], "options": [{"text": "spatium retroviscerale", "images": []}, {"text": "spatium prevertebrale", "images": []}, {"text": "spatium previscerale", "images": []}, {"text": "spatium interscalenum", "images": []}, {"text": "spatium submandibulare", "images": []}, {"text": "spatium interaponeuroticum suprasternale", "images": []}, {"text": "spatium antescalenum", "images": []}, {"text": "spatium interaponeuroticum cervicale laterale", "images": []}], "rows": [], "correct": [7], "explanation": "В боковом треугольнике шеи между поверхностной (2-й) и предпозвоночной (5-й) пластинками собственной фасции шеи залегает латеральное межапоневротическое пространство — spatium interaponeuroticum cervicale laterale, которое книзу по ходу сосудисто-нервного пучка продолжается в клетчатку подмышечной впадины. Все остальные варианты закрыты ключом Moodle итогового теста по мышцам головы и шеи: spatium prevertebrale — между предпозвоночной пластинкой и шейными позвонками; spatium retroviscerale — между внутришейной и предпозвоночной фасциями с выходом в заднее средостение; spatium previscerale — между листками внутришейной фасции; spatium interaponeuroticum suprasternale — над яремной вырезкой грудины («карман Грубера»); spatium submandibulare — содержит поднижнечелюстную железу. Spatium antescalenum и spatium interscalenum — межмышечные щели лестничных мышц, а не межфасциальные пространства бокового треугольника.", "source": "ключ Moodle из итогового теста (исключением остальных вариантов) + классическая топографическая анатомия", "confidence": "claude-medium", "moodle_right": ""}, {"key": "a6256ca6491e", "type": "multichoice", "multiple": false, "text": "Определите промежуток, который спереди ограничивают — m. scalenus anterior, сзади — m. scalenus medius и снизу — I ребро. Этот промежуток имеет треугольную форму и содержит подключичную артерию и плечевое сплетение", "images": [], "options": [{"text": "spatium interaponeuroticum cervicale laterale", "images": []}, {"text": "spatium interaponeuroticum suprasternale", "images": []}, {"text": "spatium previscerale", "images": []}, {"text": "spatium submandibulare", "images": []}, {"text": "spatium interscalenum", "images": []}, {"text": "spatium prevertebrale", "images": []}, {"text": "spatium antescalenum", "images": []}, {"text": "spatium retroviscerale", "images": []}], "rows": [], "correct": [4], "explanation": "", "source": "перенесено из другого теста (тот же вопрос)", "confidence": "moodle", "moodle_right": ""}]}, {"cmid": "27934", "folder": "03_pishchevaritelnaya", "title": "Тестирование по пищеварительной системе", "minutes": 10, "group": "Тренировочные", "questions": [{"key": "3affad848e36", "type": "multichoice", "multiple": false, "text": "Где открываются протоки малых подъязычных желез (ductus sublinguales minores)?", "images": [], "options": [{"text": "В Fossa tonsillaris", "images": []}, {"text": "В Foramen caecum языка", "images": []}, {"text": "В преддверии рта на уровне верхних моляров", "images": []}, {"text": "Вдоль Plica sublingualis", "images": []}, {"text": "На нижней поверхности языка", "images": []}, {"text": "На Caruncula sublingualis", "images": []}], "rows": [], "correct": [3], "explanation": "Дословно по источнику: «от отдельных долек железы… берут начало малые подъязычные протоки (ductus sublinguales minores) (18-20), которые открываются самостоятельно в полость рта вдоль подъязычной складки». На caruncula sublingualis (подъязычном сосочке) открываются большой подъязычный и поднижнечелюстной протоки — это другой вариант.", "source": "0064_Анатомия полости рта и зубов.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "ee078d42b3b4", "type": "multichoice", "multiple": false, "text": "Какой отдел прямой кишки следует непосредственно за сигмовидной кишкой?", "images": [], "options": [{"text": "Промежностный изгиб", "images": []}, {"text": "Сфинктер заднего прохода", "images": []}, {"text": "Заднепроходное отверстие (Anus)", "images": []}, {"text": "Морганиевы столбы", "images": []}, {"text": "Анальный канал (Canalis analis)", "images": []}, {"text": "Надампулярная часть и Ампула прямой кишки (Ampulla recti)", "images": []}], "rows": [], "correct": [5], "explanation": "Сразу за сигмовидной кишкой начинается прямая кишка, в которой различают надампулярную часть и ампулу (ampulla recti), а ниже — заднепроходный канал (canalis analis), заканчивающийся anus. Остальные варианты — более дистальные отделы и структуры.", "source": "0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "c54f0b7d3954", "type": "multichoice", "multiple": false, "text": "Какой участок тонкой кишки начинается сразу за привратником?", "images": [], "options": [{"text": "duodenum", "images": []}, {"text": "colon ascendens", "images": []}, {"text": "ileum", "images": []}, {"text": "intestinum crassum", "images": []}, {"text": "caecum", "images": []}, {"text": "jejunum", "images": []}], "rows": [], "correct": [0], "explanation": "Тонкая кишка начинается двенадцатиперстной кишкой (duodenum), которая следует сразу за привратником желудка; jejunum и ileum идут далее. Варианты colon ascendens, caecum, intestinum crassum относятся к толстой кишке.", "source": "0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "9567f0ee6bd2", "type": "multichoice", "multiple": false, "text": "Какое образование глотки содержит трубную миндалину (tonsilla tubaria)?", "images": [], "options": [{"text": "Трубный валик (Torus tubarius)", "images": []}, {"text": "Небная миндалина (Tonsilla palatina)", "images": []}, {"text": "Крыловидно-нижнечелюстной шов (Raphe pterygomandibularis)", "images": []}, {"text": "Грушевидный карман (Recessus piriformis)", "images": []}, {"text": "Ямка надгортанника (Vallecula epiglottica)", "images": []}, {"text": "Глоточный карман (Recessus pharyngeus)", "images": []}], "rows": [], "correct": [0], "explanation": "«На боковых стенках носовой части глотки… находится парное… глоточное отверстие слуховой трубы, которое сзади и сверху ограничено трубным валиком (torus tubarius)». Именно в области трубного валика, вокруг устья трубы, лежит скопление лимфоидной ткани — трубная миндалина (tonsilla tubaria), одна из шести миндалин кольца Пирогова–Вальдейера.", "source": "0064_Анатомия полости рта и зубов.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "f2da005191cc", "type": "multichoice", "multiple": false, "text": "Какой отдел толстой кишки следует непосредственно за слепой кишкой?", "images": [], "options": [{"text": "Сигмовидная ободочная кишка (Colon sigmoideum)", "images": []}, {"text": "Восходящая ободочная кишка (Colon ascendens)", "images": []}, {"text": "Поперечная ободочная кишка (Colon transversum)", "images": []}, {"text": "Нисходящая ободочная кишка (Colon descendens)", "images": []}, {"text": "Червеобразный отросток (Appendix vermiformis)", "images": []}, {"text": "Прямая кишка (Rectum)", "images": []}], "rows": [], "correct": [1], "explanation": "Порядок отделов толстой кишки: caecum → colon ascendens → colon transversum → colon descendens → colon sigmoideum → rectum. Appendix vermiformis — отросток самой слепой кишки, а не следующий за ней отдел.", "source": "0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "d8e42be49955", "type": "multichoice", "multiple": false, "text": "Через какое отверстие диафрагмы пищевод проникает из грудной полости в брюшную?", "images": [], "options": [{"text": "Аортальное отверстие (Hiatus aorticus)", "images": []}, {"text": "Отверстие нижней полой вены (Foramen venae cavae)", "images": []}, {"text": "Пищеводное отверстие (Hiatus oesophageus)", "images": []}, {"text": "Грудино-реберный треугольник (Trigonum sternocostale)", "images": []}, {"text": "Пояснично-реберный треугольник (Trigonum lumbocostale)", "images": []}, {"text": "Медиальная дугообразная связка (Lig. arcuatum mediale)", "images": []}], "rows": [], "correct": [2], "explanation": "Пищевод переходит в брюшную полость через пищеводное отверстие диафрагмы (hiatus oesophageus) на уровне X–XI грудного позвонка: «Брюшная часть (pars abdominalis) пищевода… расположена между пищеводным отверстием диафрагмы на уровне X-XI грудного позвонка и входом в желудок». Через hiatus aorticus проходит аорта, через foramen venae cavae — нижняя полая вена.", "source": "0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "4203d6039fc9", "type": "multichoice", "multiple": false, "text": "Какой отдел тонкой кишки следует непосредственно за привратником желудка (pylorus)?", "images": [], "options": [{"text": "Тощая кишка (Jejunum)", "images": []}, {"text": "Слепая кишка (Caecum)", "images": []}, {"text": "Горизонтальная часть дуоденум", "images": []}, {"text": "Подвздошная кишка (Ileum)", "images": []}, {"text": "Верхняя часть двенадцатиперстной кишки (Pars superior duodeni)", "images": []}, {"text": "Нисходящая часть дуоденум", "images": []}], "rows": [], "correct": [4], "explanation": "Сразу за привратником (pylorus) следует верхняя часть двенадцатиперстной кишки (pars superior duodeni), образующая ампулу/«луковицу»; горизонтальная и нисходящая части лежат дальше по ходу duodenum. Вопрос требует именно конкретный отдел, а не кишку в целом.", "source": "классическая анатомия (Сапин, Международная анатомическая терминология)", "confidence": "claude-medium", "moodle_right": ""}, {"key": "b42930ceb93b", "type": "multichoice", "multiple": false, "text": "Какой отдел кишечника следует непосредственно за двенадцатиперстной кишкой (duodenum)?", "images": [], "options": [{"text": "Appendix vermiformis", "images": []}, {"text": "Ileum", "images": []}, {"text": "Jejunum", "images": []}, {"text": "Colon sigmoideum", "images": []}, {"text": "Caecum", "images": []}, {"text": "Colon ascendens", "images": []}], "rows": [], "correct": [2], "explanation": "За двенадцатиперстной кишкой следует тощая кишка (jejunum): «Тощая кишка (jejunum) и подвздошная кишка (ileum) образуют ряд петель…», причём jejunum начинается от двенадцатиперстно-тощекишечного изгиба (flexura duodenojejunalis). Ileum идёт после jejunum.", "source": "0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "4d101494fc02", "type": "multichoice", "multiple": false, "text": "Сколько продольных мышечных лент (taeniae coli) имеется у ободочной кишки?", "images": [], "options": [{"text": "Пять лент", "images": []}, {"text": "Одна лента", "images": []}, {"text": "Две ленты", "images": []}, {"text": "Шесть лент", "images": []}, {"text": "Четыре ленты", "images": []}, {"text": "Три ленты", "images": []}], "rows": [], "correct": [5], "explanation": "«Ленты ободочной кишки (taenia coli)… появляются в связи с неравномерным распределением продольных мышечных пучков, собранных в виде полос только в трех местах… Различают сальниковую ленту (taenia omentalis)…» — всего три ленты: свободная, сальниковая и брыжеечная.", "source": "0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "e853f00208f2", "type": "multichoice", "multiple": false, "text": "На уровне какого зуба открывается проток околоушной слюнной железы (ductus parotideus) в преддверии рта?", "images": [], "options": [{"text": "Третьего верхнего моляра", "images": []}, {"text": "Второго верхнего моляра", "images": []}, {"text": "Второго нижнего моляра", "images": []}, {"text": "Второго верхнего премоляра", "images": []}, {"text": "Первого нижнего моляра", "images": []}, {"text": "Первого верхнего моляра", "images": []}], "rows": [], "correct": [1], "explanation": "«На уровне верхнего 2-го большого коренного зуба на ней имеется возвышение - сосочек протока околоушной железы (papilla ductus parotidei)» — то есть ductus parotideus открывается в преддверии рта на уровне второго верхнего моляра.", "source": "0064_Анатомия полости рта и зубов.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "aabc6b858b6b", "type": "multichoice", "multiple": false, "text": "Какая связка соединяет верхушку корня зуба с дном альвеолы, пропуская сосуды и нервы?", "images": [], "options": [{"text": "Межзубная связка (Lig. interdentale)", "images": []}, {"text": "Никакая", "images": []}, {"text": "Спиральная связка", "images": []}, {"text": "Зубная связка (Lig. dentis)", "images": []}, {"text": "Круговая связка зуба (Lig. circulare dentis)", "images": []}, {"text": "Десневая связка", "images": []}], "rows": [], "correct": [1], "explanation": "Такой связки не существует: фиксацию зуба обеспечивает периодонт, волокна которого (зубодесневые, межзубные, зубоальвеолярные) натянуты между цементом корня и костной альвеолой, а сосуды и нервы входят в зуб через апикальное отверстие, не образуя связки. Терминов «Lig. dentis», «Lig. circulare dentis» или «спиральная связка» в материалах курса и в Международной анатомической терминологии нет.", "source": "0064_Анатомия полости рта и зубов.docx.txt", "confidence": "claude-medium", "moodle_right": ""}, {"key": "eaf24708dc6f", "type": "multichoice", "multiple": false, "text": "В каком слое стенки пищевода находятся собственные железы пищевода (glandulae oesophageae)?", "images": [], "options": [{"text": "Продольный мышечный слой (Stratum longitudinale)", "images": []}, {"text": "Собственная пластинка слизистой оболочки (Lamina propria mucosae)", "images": []}, {"text": "Мышечная пластинка слизистой оболочки (Lamina muscularis mucosae)", "images": []}, {"text": "Подслизистая основа (Tela submucosa)", "images": []}, {"text": "Адвентициальная оболочка (Tunica adventitia)", "images": []}, {"text": "Круговой мышечный слой (Stratum circulare)", "images": []}], "rows": [], "correct": [3], "explanation": "По классической анатомии и гистологии собственные железы пищевода (glandulae oesophageae propriae) — сложные альвеолярно-трубчатые железы, залегающие именно в подслизистой основе (tela submucosa); их выводные протоки прободают мышечную пластинку слизистой и открываются на поверхности эпителия. ВНИМАНИЕ: в материале кафедры формулировка иная — железы отнесены к слизистой оболочке («В ней содержатся собственные пищеводные и кардиальные железы»), поэтому если кафедра ждёт ответ по своему тексту, правильным могут счесть вариант «Lamina propria mucosae» (индекс 1). Выбран стандартный вариант tela submucosa, но сомнение реальное.", "source": "классическая анатомия/гистология; ср. 0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-low", "moodle_right": ""}, {"key": "75ec89ef44b7", "type": "multichoice", "multiple": false, "text": "Какая костная структура образует заднюю треть костного неба (palatum osseum)?", "images": [], "options": [{"text": "Processus pterygoideus ossis sphenoidalis", "images": []}, {"text": "Lamina perpendicularis ossis palatini", "images": []}, {"text": "Processus palatinus maxillae", "images": []}, {"text": "Vomer", "images": []}, {"text": "Processus alveolaris maxillae", "images": []}, {"text": "Lamina horizontalis ossis palatini", "images": []}], "rows": [], "correct": [5], "explanation": "«Твердое нёбо (palatum durum) состоит из костного нёба (palatum osseum), включающего нёбный отросток верхней челюсти и горизонтальную пластинку нёбной кости». Нёбные отростки верхней челюсти формируют передние две трети, а горизонтальные пластинки нёбных костей (lamina horizontalis ossis palatini) — заднюю треть костного нёба.", "source": "0064_Анатомия полости рта и зубов.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "eb0bafa503e7", "type": "multichoice", "multiple": false, "text": "Какой слой стенки полого органа обеспечивает его перистальтику и постоянный тонус, и из какой ткани он преимущественно состоит в средней трети пищевода?", "images": [], "options": [{"text": "Мышечная оболочка (Tunica muscularis) — гладкая мышечная ткань", "images": []}, {"text": "Слизистая оболочка (Tunica mucosa) — многослойный плоский эпителий", "images": []}, {"text": "Серозная оболочка (Tunica serosa) — мезотелий", "images": []}, {"text": "Мышечная оболочка (Tunica muscularis) — поперечно-полосатая мышечная ткань", "images": []}, {"text": "Адвентициальная оболочка (Tunica adventitia) — рыхлая соединительная ткань", "images": []}, {"text": "Подслизистая основа (Tela submucosa) — рыхлая волокнистая соединительная ткань", "images": []}], "rows": [], "correct": [0], "explanation": "Перистальтику и тонус обеспечивает мышечная оболочка (tunica muscularis) из продольного и циркулярного слоёв. Лекция указывает, что поперечно-полосатая мышечная ткань есть «лишь в органах полости рта, глотке и в начальной части пищевода», остальная часть — гладкая, поэтому для средней трети выбран вариант с гладкой мышечной тканью. Замечание: в учебнике кафедры верхний отдел грудной части назван смешанным (поперечнополосатые + гладкие), а «только гладкие» — в нижней трети, так что средняя треть строго говоря переходная; но из предложенных формулировок гладкомышечная ближе всего.", "source": "0114_Лекция 4 . Общая спланхнология.pdf.txt + 0082_спланхнология - внутренние органы.docx.txt", "confidence": "claude-medium", "moodle_right": ""}, {"key": "c53f28bc664c", "type": "multichoice", "multiple": false, "text": "Какая анатомическая структура является структурно-функциональной единицей печени?", "images": [], "options": [{"text": "Acinus", "images": []}, {"text": "Segmentum hepatis", "images": []}, {"text": "Nephron", "images": []}, {"text": "Lobulus hepaticus", "images": []}, {"text": "Folliculus", "images": []}, {"text": "Osteon", "images": []}], "rows": [], "correct": [3], "explanation": "Дословно: «Долька печени, lobulus hepatis, является морфофункциональной единицей печени». Nephron — единица почки, osteon — кости, acinus — лёгкого/железы, segmentum hepatis — хирургическая, а не структурно-функциональная единица.", "source": "0115_Лекция 5. Пищеварительная система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "174781d1c936", "type": "multichoice", "multiple": false, "text": "Какая из перечисленных мышц языка является собственной, изменяющей форму языка, но не его положение?", "images": [], "options": [{"text": "Шилоязычная мышца (M. styloglossus)", "images": []}, {"text": "Небно-язычная мышца (M. palatoglossus)", "images": []}, {"text": "Хряще-язычная мышца (M. chondroglossus)", "images": []}, {"text": "Подбородочно-язычная мышца (M. genioglossus)", "images": []}, {"text": "Подъязычно-язычная мышца (M. hyoglossus)", "images": []}, {"text": "Поперечная мышца языка (M. transversus linguae)", "images": []}], "rows": [], "correct": [5], "explanation": "M. transversus linguae входит во внутреннюю (собственную) группу мышц языка: «начинается от перегородки языка и распространяется в стороны… Функция: суживает и удлиняет язык» — то есть меняет форму языка. Все остальные перечисленные (styloglossus, hyoglossus, genioglossus, chondroglossus, palatoglossus) — наружные (скелетные) мышцы, начинающиеся от костей/нёба и меняющие положение языка.", "source": "0064_Анатомия полости рта и зубов.docx.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "0e7d38fe7d1c", "type": "multichoice", "multiple": false, "text": "В какой отдел толстой кишки открывается подвздошная кишка через илеоцекальный клапан?", "images": [], "options": [{"text": "Восходящая ободочная кишка (Colon ascendens)", "images": []}, {"text": "Сигмовидная ободочная кишка (Colon sigmoideum)", "images": []}, {"text": s)", "images": []}, {"text": "Сегментарные бронхи (Bronchi segmentales)", "images": []}, {"text": "Главные бронхи (Bronchi principales)", "images": []}, {"text": "Альвеолы (Alveoli)", "images": []}, {"text": "Дыхательные бронхиолы (Bronchioli respiratorii)", "images": []}], "rows": [], "correct": [2], "explanation": "Главные бронхи (1 порядка) делятся на долевые (2 порядка), а те — на сегментарные (3 порядка). В лекции: «Долевые бронхи делятся на сегментарные bronchi segmentales (3 порядка) и внутрисегментарные бронхи».", "source": "0116_Лекция 6. Дыхательная система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "6839426c169c", "type": "multichoice", "multiple": false, "text": "Какие придаточные пазухи носа открываются в верхний носовой ход (meatus nasi superior)?", "images": [], "options": [{"text": "Клиновидная пазуха и задние ячейки решетчатой кости", "images": []}, {"text": "Только верхнечелюстная пазуха", "images": []}, {"text": "Только лобная пазуха", "images": []}, {"text": "Клиновидная пазуха и лобная пазуха", "images": []}, {"text": "Лобная пазуха и передние ячейки решетчатой кости", "images": []}, {"text": "Верхнечелюстная пазуха и средние ячейки решетчатой кости", "images": []}], "rows": [], "correct": [0], "explanation": "Лекция прямо указывает: «В верхний носовой ход открывается клиновидная пазуха, задние и средние ячейки решетчатой пазухи». Лобная и верхнечелюстная пазухи открываются в средний носовой ход, поэтому единственный подходящий вариант — клиновидная пазуха и задние ячейки решетчатой кости.", "source": "0116_Лекция 6. Дыхательная система.pdf.txt", "confidence": "claude-high", "moodle_right": ""}, {"key": "c20f8fb04cbc", "type": "multichoice", "multiple": false, "text": "Какое пространство гортани расположено между складками преддверия и голосовыми складками?", "images": [], "options": [{"text": "Грушевидный карман (Recessus piriformis)", "images": []}, {"text": "Преддверие гортани (Vestibulum laryngis)", "images": []}, {"
